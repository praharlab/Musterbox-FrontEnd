version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build production bundle
          command: npm run build:prod
      - store_artifacts:
          path: dist/musterbox-prod
          destination: production-build

workflows:
  build:
    jobs:
      - build
