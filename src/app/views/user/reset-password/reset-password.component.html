<style>
  .password-toggle-icon {
  position: absolute;
  top: 47%;
  right: 10px;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999; /* Adjust the color as needed */
}
</style>

<div class="card auth-card">
  <div class="position-relative image-side"></div>
  <div class="form-side">
    <a class="c-pointer">
      <span class="logo-single"></span>
    </a>
    <h6 class="mb-4">Reset Password</h6>

    <form #resetForm="ngForm" novalidate (ngSubmit)="onSubmit()">
      <label class="form-group has-float-label">
        <input
          class="form-control"
          type="{{ showPassword ? 'text' : 'password' }}"
          placeholder=""
          required
          ngModel
          #newPassword="ngModel"
          name="newPassword"
          />
          <span>{{ 'user.password' | translate }}*</span>
          @if (!newPassword.valid && resetForm.submitted) {
            <div class="invalid-tooltip">
              Password is required!
            </div>
          }
          <div class="password-toggle-icon" (click)="togglePasswordVisibility()">
            @if (showPassword == true) {
              <!-- <span class="glyph-icon simple-icon-close"></span> -->
              <img
                src="../../../../assets/eyeclosed.png"
                alt=""
              style="
                position: absolute;
                top: 47%;
                right: 10px;
                transform: translateY(-50%);
                cursor: pointer;
                width: 22px;
                color: #999;
              "
                />
              }
              @if (showPassword == false) {
                <img
                  src="../../../../assets/eyeopen.png"
                  alt=""
              style="
                position: absolute;
                top: 47%;
                right: 10px;
                transform: translateY(-50%);
                cursor: pointer;
                width: 22px;
                color: #999;
              "
                  />
                }
              </div>
            </label>

            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="{{ showPassword1 ? 'text' : 'password' }}"
                placeholder=""
                required
                ngModel
                #confPassword="ngModel"
                name="confPassword"
                />
                <span>Confirm Password *</span>
                @if (!confPassword.valid && resetForm.submitted) {
                  <div class="invalid-tooltip">
                    Confirm Password is required!
                  </div>
                }
                <div class="password-toggle-icon" (click)="togglePasswordVisibility1()">
                  @if (showPassword1 == true) {
                    <!-- <span class="glyph-icon simple-icon-close"></span> -->
                    <img
                      src="../../../../assets/eyeclosed.png"
                      alt=""
              style="
                position: absolute;
                top: 47%;
                right: 10px;
                transform: translateY(-50%);
                cursor: pointer;
                width: 22px;
                color: #999;
              "
                      />
                    }
                    @if (showPassword1 == false) {
                      <img
                        src="../../../../assets/eyeopen.png"
                        alt=""
              style="
                position: absolute;
                top: 47%;
                right: 10px;
                transform: translateY(-50%);
                cursor: pointer;
                width: 22px;
                color: #999;
              "
                        />
                      }
                    </div>
                  </label>

                  <div class="d-flex justify-content-between align-items-center">
                    <a routerLink="/user/forgot-password">{{ 'user.forgot-password' | translate }}?</a>
                    <app-state-button
                      [btnClass]="'btn btn-primary btn-lg btn-shadow'"
                      [currentState]="buttonState"
                      [isDisabled]="buttonDisabled"
                      click="onLoginClick()"
                      >
                      {{ 'user.reset-password-button' | translate | uppercase }}
                    </app-state-button>
                  </div>
                </form>
              </div>
            </div>
            <simple-notifications [options]="{ position: ['top', 'center'] }"></simple-notifications>
