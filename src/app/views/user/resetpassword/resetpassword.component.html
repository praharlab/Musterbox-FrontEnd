<div class="card auth-card">
  <div class="position-relative image-side"></div>
  <div class="form-side">
    <a class="c-pointer">
      <span class="logo-single"></span>
    </a>
    <h6 class="mb-4">Reset Password</h6>

    <form #resetForm="ngForm" novalidate (ngSubmit)="onSubmit()">
      <label class="form-group has-float-label">
        <input
          class="form-control"
          type="password"
          placeholder=""
          required
          ngModel
          #oldPassword="ngModel"
          name="oldPassword"
          />
          <span>Old Password</span>
          @if (!oldPassword.valid && resetForm.submitted) {
            <div class="invalid-tooltip">
              Old Password is required!
            </div>
          }
        </label>
        <label class="form-group has-float-label">
          <input
            class="form-control"
            type="password"
            placeholder=""
            required
            ngModel
            #newPassword="ngModel"
            name="newPassword"
            />
            <span>New Password</span>
            @if (!newPassword.valid && resetForm.submitted) {
              <div class="invalid-tooltip">
                New Password is required!
              </div>
            }
          </label>
          <label class="form-group has-float-label">
            <input
              class="form-control"
              type="password"
              placeholder=""
              required
              ngModel
              #confPassword="ngModel"
              name="confPassword"
              />
              <span>Confirm New Password</span>
              @if (!confPassword.valid && resetForm.submitted) {
                <div class="invalid-tooltip">
                  Confirm New Password is required!
                </div>
              }
            </label>
            <div class="d-flex justify-content-between align-items-center">
              <app-state-button
                [btnClass]="'btn btn-primary btn-lg btn-shadow'"
                [currentState]="buttonState"
                [isDisabled]="buttonDisabled"
                click="onLoginClick()"
                >
                {{ 'user.reset-password-button' | translate | uppercase }}
              </app-state-button>
            </div>
          </form>
        </div>
      </div>
      <simple-notifications [options]="{ position: ['top', 'center'] }"></simple-notifications>
