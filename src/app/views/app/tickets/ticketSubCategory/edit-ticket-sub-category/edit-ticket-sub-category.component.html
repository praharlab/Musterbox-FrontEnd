<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit Ticket Sub Category</h5>

    @if (editData && employee && company && ticketCategory) {
      <form
        #editTicketSubCategoty="ngForm"
        novalidate
        (ngSubmit)="onSubmit()"
        >
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #companyMasterID="ngModel"
                name="companyMasterID"
                [(ngModel)]="editData.ticketCategory.companyMasterId"
                required
                >
                @for (company of company; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && editTicketSubCategoty.submitted) {
                <div
                  class="invalid-tooltip"
                  >
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #ticketCategoryId="ngModel"
                [(ngModel)]="editData.ticketCategoryId"
                name="ticketCategoryId"
                required
                >
                @for (item of ticketCategory; track item) {
                  <ng-option [value]="item.id">
                    {{ item.name }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Ticket Category *</span>
              @if (!companyMasterID.valid && editTicketSubCategoty.submitted) {
                <div
                  class="invalid-tooltip"
                  >
                  Ticket Category is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                ngModel
                #ticketsubCategoryName="ngModel"
                [(ngModel)]="editData.name"
                name="ticketsubCategoryName"
                required
                />
                <span>Ticket SubCategory Name *</span>
                @if (!ticketsubCategoryName.valid && editTicketSubCategoty.submitted) {
                  <div
                    class="invalid-tooltip"
                    >
                    Ticket SubCategory Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <ng-select
                  placeholder="Choose your option"
                  ngModel
                  #user="ngModel"
                  name="user"
                  [(ngModel)]="editData.defaultAssignee"
                  required
                  >
                  @for (person of employee; track person) {
                    <ng-option [value]="person.userMasterID">
                      {{ person.displayName }}
                    </ng-option>
                  }
                </ng-select>
                <span>Assign Person *</span>
                @if (!user.valid && editTicketSubCategoty.submitted) {
                  <div class="invalid-tooltip">
                    Assign Person is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <textarea
                  class="form-control"
                  ngModel
                  #description="ngModel"
                  name="description"
                  [(ngModel)]="editData.description"
                  required
                ></textarea>
                <span>Description *</span>
                @if (!description.valid && editTicketSubCategoty.submitted) {
                  <div
                    class="invalid-tooltip"
                    >
                    Description is required!
                  </div>
                }
              </label>
            </div>
          </div>
          <app-state-button
            [btnClass]="'btn btn-primary btn-lg btn-shadow mt-4'"
            [currentState]="buttonState"
            [isDisabled]="buttonDisabled"
            click="onLoginClick()"
            >
            {{ 'forms.submit' | translate }}
          </app-state-button>
          <button
            class="btn btn-danger btn-lg btn-shadow mt-4"
            [routerLink]="adminRoot + '/tickets/listTicketSubCategory'"
            style="margin-left: 2%"
            >
            Cancel
          </button>
        </form>
      }
    </div>
  </div>

  <simple-notifications
    [options]="{ position: ['top', 'center'], maxStack: 1 }"
  ></simple-notifications>
