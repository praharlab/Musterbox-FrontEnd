<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showadd]="permissioncreate" [showOrderBy]="true" [showDisplayMode]="false"
  [searchValue]="body.searchQuery" (changeOrderBy)="onChangeOrderBy($event)" (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="body.limit" [itemOrder]="Order"
  [itemOptionsOrders]="changeOrderBy" [itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()"
name="Ticket"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #companyfilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" (change)="selectTicketCategory($event)"
                [(ngModel)]="body.companyMasterID" ngModel #companyMasterID="ngModel" name="companyMasterID" required>
                @for (company of comp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && companyfilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" (change)="selectTicketSubCategory($event)"
                [(ngModel)]="body.ticketCategoryId" ngModel #ticketCategoryID="ngModel" name="ticketCategoryID">
                @for (ticket of ticketCategory; track ticket) {
                  <ng-option [value]="ticket.id">
                    {{ ticket.name }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Ticket Category</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #ticketSubCategoryId="ngModel"
                [(ngModel)]="body.ticketSubCategoryId" name="ticketSubCategoryId">
                @for (item of ticketSubCategory; track item) {
                  <ng-option [value]="item.id">
                    {{ item.name }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Ticket Sub Category</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #priority="ngModel" [(ngModel)]="body.priority"
                name="priority">
                <ng-option value="High">HIGH</ng-option>
                <ng-option value="Low">LOW</ng-option>
                <ng-option value="Medium">MEDIUM</ng-option>
              </ng-select>
              <span>Select Priority</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #status="ngModel" [(ngModel)]="body.status"
                name="status">
                <ng-option value="Created">CREATED</ng-option>
                <ng-option value="In Progress">IN_PROGRESS</ng-option>
                <ng-option value="On Hold">ON_HOLD</ng-option>
                <ng-option value="Closed">CLOSED</ng-option>
              </ng-select>
              <span>Select Status</span>
            </label>
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          </div>
          <div class="col-md-3"></div>
          <div class="col-md-3" style="text-align: right">
            <div class="float-right float-none-xs mt-2">
              <label class="form-group has-float-label">
                <ng-select placeholder="Export" ngModel #cid2="ngModel" name="cid2" [(ngModel)]="selectedValue"
                  (ngModelChange)="onOptionSelectDownlad()">
                  <ng-option value="csv">CSV</ng-option>
                  <ng-option value="xlsx">XLSX</ng-option>
                </ng-select>
              </label>
            </div>
          </div>
        </div>
      </form>
    }
  </div>
</div>

@if (rows && permissionview.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="auto" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="body.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)" [selectionType]="SelectionType.cell" (activate)="onActivate($event)">
        <ngx-datatable-column name="Ticket Title" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="title-span">{{ row.title }}</span>
            <span style="cursor: pointer" title="On Click Ticket Chat">
              <img src="../../../../assets/img/cards/link.png" width="10" height="10" />
            </span>
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Description" prop="description" [flexGrow]="1.2" [width]="300"></ngx-datatable-column>
        <ngx-datatable-column name="Status" prop="status" [flexGrow]="1.2" [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Priority" prop="priority" [flexGrow]="1.2" [width]="80"></ngx-datatable-column>
        @if (permissionedit.length != 0 || permissiondelete.length != 0) {
          <ngx-datatable-column name="Action" [sortable]="true" [width]="200"
            >
            <ng-template let-row="row" ngx-datatable-cell-template>
              @if (
                (permissionedit.length != 0 && row.ticketAssignedTo.userMasterID == userId) ||
                usertype == '1'
                ) {
                <button class="btn btn-primary btn-xs form-group m-0" type="submit" (click)="navigateToEditPage(row)">
                  Edit
                </button>
              }
            </ng-template>
          </ngx-datatable-column>
        }
        <ngx-datatable-column name="Created By" prop="ticketCreatedBy.displayName" [flexGrow]="1.2"
        [width]="160"></ngx-datatable-column>
        <ngx-datatable-column name="Assign To" prop="ticketAssignedTo.displayName" [flexGrow]="1.2"
        [width]="160"></ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="body.limit" [maxSize]="5" [(ngModel)]="currentPage"
                  (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
