<div style="position: relative">
    <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showadd]="permissioncreate" [showOrderBy]="true" [showDisplayMode]="false"
[searchValue]="body.searchQuery"   (changeOrderBy)="onChangeOrderBy($event)" (searchKeyUp)="updateFilter($event)"
    (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="body.limit" [itemOrder]="Order"
    [itemOptionsOrders]="changeOrderBy" [itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()"
    name="Review Form"></app-list-page-header>

<div class="card mb-4" *ngIf="permissionview.length != 0">
    <div class="card-body">
        <form #companyfilter="ngForm" novalidate>
            <div class="row">
                <div class="col-md-4">
                    <label class="form-group has-float-label">
                        <ng-select placeholder="Choose your option" ngModel #companyMasterID="ngModel"
                            name="companyMasterID" [(ngModel)]="selectedCompany_id" required>
                            <ng-option *ngFor="let company of comp" [value]="company.companyMasterID">
                                {{ company.companyName }}
                            </ng-option>
                        </ng-select>
                        <span>Select Company *</span>
                        <div *ngIf="!companyMasterID.valid && companyfilter.submitted" class="invalid-tooltip">
                            Company is required!
                        </div>
                    </label>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
                        {{ 'forms.submit' | translate }}
                    </button>
                    &nbsp;&nbsp;
                    <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
                </div>
                <div class="col-md-4" style="text-align: right" *ngIf="rows.length != 0">
                    <div class="float-right float-none-xs mt-2">
                        <label class="form-group has-float-label">
                            <ng-select placeholder="Export" ngModel #cid2="ngModel" name="cid2"
                                [(ngModel)]="selectedValue" (ngModelChange)="onOptionSelect()">
                                <ng-option value="csv">CSV</ng-option>
                                <ng-option value="xlsx">XLSX</ng-option>
                            </ng-select>
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="row" *ngIf="rows && permissionview.length != 0">
    <div class="col-12 mb-4 data-table-rows">
        <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
            [limit]="body.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
            (page)="onChange($event)">
            <ngx-datatable-column name="Company Name" prop="companyMaster.companyName" [flexGrow]="1.2"
                [width]="140"></ngx-datatable-column>
            <ngx-datatable-column name="Review Form" prop="title" [flexGrow]="1.2" [width]="140"></ngx-datatable-column>


            <ngx-datatable-column name="View Form" [sortable]="true" [width]="120">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-outline-primary btn-xs" (click)="lgModal.show();viewReviewForm(row)">
                        View
                    </button>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column name="Action" [sortable]="true" [width]="180"
                *ngIf="permissionedit.length != 0 || permissiondelete.length != 0">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <button class="btn btn-primary btn-xs form-group m-0" type="submit"
                        *ngIf="permissionedit.length != 0" (click)="navigateToEditPage(row)">
                        Edit
                    </button>
                    &nbsp;&nbsp;
                    <button class="btn btn-danger btn-xs form-group m-0" type="button"
                        *ngIf="permissiondelete.length != 0" (click)="alertConfirmation(row.id)">
                        Delete
                    </button>
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Created Date" prop="createdAt" [flexGrow]="1.2" [width]="160">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{ row.createdAt | date: 'dd-MM-yyyy' }}
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-footer *ngIf="true">
                <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                    let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                    <div class="w-100 d-flex justify-content-center">
                        <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                            [customLastTemplate]="lastTemplate" [itemsPerPage]="body.limit" [maxSize]="5"
                            [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                            [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
                    </div>
                </ng-template>
            </ngx-datatable-footer>
        </ngx-datatable>
    </div>
</div>

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left"></i>
</ng-template>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>

<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title pull-left">Review Form - {{ modalData.title}}</h4>
                <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close">
                    <span aria-hidden="true" class="visually-hidden">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form #addreport="ngForm" novalidate>
                    <div class="row mb-4"
                        *ngFor="let questionCategory of modalData.reviewFormQuestionCategories; let i = index">
                        <table class="table table-striped">
                            <tbody>
                                <tr>
                                    <td style="font-weight: 800">{{ i + 1 }}.&nbsp;Category Name</td>
                                    <td>:&nbsp;{{questionCategory.title }}</td>
                                </tr>
                                <tr>
                                    <td style="font-weight: 800">&nbsp;&nbsp;&nbsp; Category Description</td>
                                    <td>:&nbsp;{{ questionCategory.description }}</td>
                                </tr>

                            </tbody>
                        </table>
                        <div class="col-md-12 mb-4" style="padding-left: 25px !important;"
                            *ngFor="let question of questionCategory.reviewFormQuestions; let j = index">

                            <div *ngIf="question.responseType == 'Rating'">
                                <div class="form-group mb-0">
                                    <label>Q{{ j + 1 }}. {{ question.question }}</label>
                                    <div class="d-flex align-items-center">
                                        <rating [max]="5" [titles]='["1 star","2 star","3 star","4 star","5 star"]'
                                            [customTemplate]="t" ngModel #rating="ngModel" name="rating"
                                            [readonly]="true"></rating>
                                        <ng-template class="rating" #t let-index="index" let-value="value">
                                        </ng-template>
                                    </div>
                                </div>
                            </div>



                            <div *ngIf="question.responseType == 'Text' || question.responseType == 'Grade' ">
                                <div class="form-group mb-0">
                                    <label>Q{{ j + 1 }}. {{ question.question }}</label>
                                    <input class="form-control" type="text" ngModel #text="ngModel" name="text"
                                        readonly />
                                </div>
                            </div>

                            <div *ngIf="question.responseType == 'Rating and Text'">
                                <div class="form-group mb-0">
                                    <label>Q{{ j + 1 }}. {{ question.question }}</label>
                                    <div class="d-flex align-items-center mb-2">
                                        <rating [max]="5" [titles]='["1 star","2 star","3 star","4 star","5 star"]'
                                            [customTemplate]="t" ngModel #rateText1="ngModel" name="rateText1"
                                            [readonly]="true">
                                        </rating>
                                        <ng-template class="rating" #t let-index="index" let-value="value">
                                        </ng-template>
                                    </div>
                                    <textarea class="form-control" ngModel #rateText2="ngModel" name="rateText2"
                                        readonly></textarea>
                                </div>
                            </div>

                            <div *ngIf="question.responseType == 'Grade and Text'">
                                <div class="form-group mb-0">
                                    <label>Q{{ j + 1 }}. {{ question.question }}</label>
                                    <input class="form-control mb-2" type="text" ngModel #gradeText2="ngModel"
                                        name="gradeText2" />
                                    <textarea class="form-control " ngModel #gradeText1="ngModel" name="gradeText1"
                                        readonly></textarea>
                                </div>
                            </div>
                        </div>

                        <hr>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
