<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showOrderBy]="true" [showDisplayMode]="false" (changeOrderBy)="onChangeOrderBy($event)"
  [searchValue]="body.searchQuery" (searchKeyUp)="updateFilter($event)" (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="body.limit"
  [itemOrder]="Order" [itemOptionsOrders]="changeOrderBy" [itemOptionsPerPage]="itemOptionsPerPage"
name="KRA"></app-list-page-header>
@if (permissionview.length != 0) {
  <div class="card mb-4">
    <div class="card-body">
      <form #companyfilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel [(ngModel)]="body.company_id" #companyMasterID="ngModel" name="companyMasterID"
                required>
                @for (company of comp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && companyfilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          </div>
          @if (rows.length != 0) {
            <div class="col-md-4" style="text-align: right">
              <div class="float-right float-none-xs mt-2">
                <label class="form-group has-float-label">
                  <ng-select placeholder="Export" ngModel #cid2="ngModel" name="cid2" [(ngModel)]="selectedValue"
                    (ngModelChange)="onOptionSelect()">
                    <ng-option value="csv">CSV</ng-option>
                    <ng-option value="xlsx">XLSX</ng-option>
                  </ng-select>
                </label>
              </div>
            </div>
          }
        </div>
      </form>
    </div>
  </div>
}
@if (rows && permissionview.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="body.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Company Name" prop="goalMaster.companyMaster.companyName" [flexGrow]="1.2"
          [width]="80">
        </ngx-datatable-column>
        <ngx-datatable-column name="Goal Name" prop="goalMaster.title" [flexGrow]="1.2" [width]="80">
        </ngx-datatable-column>
        <ngx-datatable-column name="Title" prop="title" [flexGrow]="1.2" [width]="80">
        </ngx-datatable-column>
        <ngx-datatable-column name="Description" prop="description" [flexGrow]="1.2" [width]="80">
        </ngx-datatable-column>
        <ngx-datatable-column name="Weightage" prop="weightage" [flexGrow]="1.2" [width]="80">
        </ngx-datatable-column>
        <ngx-datatable-column name="Created Date" prop="createdAt" [flexGrow]="1.2" [width]="160">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdAt | date: 'dd-MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="body.limit" [maxSize]="5"
                  (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate">
                </pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class='simple-icon-arrow-right'></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class='simple-icon-arrow-left'></i>
</ng-template>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
