<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>

<app-heading title="Goal Review Report"></app-heading>
<app-breadcrumb title="Goal Review Report"></app-breadcrumb>

@if (permissionview.length != 0) {
  <div class="card mb-4">
    <div class="card-body">
      <form #formFilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #companyMasterId="ngModel"
                [(ngModel)]="selectedCompany_id" name="companyMasterId" (change)="selectcompany($event)"
                required>
                @for (companyItem of company; track companyItem) {
                  <ng-option [value]="companyItem.companyMasterID">
                    {{ companyItem.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterId.valid && formFilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" [(ngModel)]="employeegoal_Id"
                #employeeGoalID="ngModel" name="employeeGoalID" ngModel required>
                @for (goal of emlpoyeeGoalData; track goal) {
                  <ng-option [value]="goal.id">
                    {{ goal.goalAssignedTo.displayName }}_{{goal.goalMaster.title}}
                  </ng-option>
                }
              </ng-select>
              <span>Select Employee Goal*</span>
              @if (!employeeGoalID.valid && formFilter.submitted) {
                <div class="invalid-tooltip">
                  Employee Goal is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-12">
            <button class="btn btn-primary form-group ml-2" type="submit" (click)="onSubmit()">
              Submit
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group ml-1" type="button" (click)="clear()">
              Clear
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
}

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>


@if (reportData) {
  <button class="btn btn-primary pull-right mb-2" (click)="onClickDownloadPdf()">
    Download PDF
  </button>
}


@if (reportData) {
  <div class="display: flex; justify-content: center;mt-4">
    <pdf-viewer [src]="reportData" [rotation]="0" [original-size]="false" [show-all]="true" [fit-to-page]="false"
      [zoom]="1" [zoom-scale]="'page-width'" [stick-to-page]="false" [render-text]="true"
      [external-link-target]="'blank'" [autoresize]="true" [show-borders]="false"
    style="width: 50%; height: 1000px"></pdf-viewer>
  </div>
}
