<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Advance Expense Payment</h5>

    <form #addPayment="ngForm" novalidate (ngSubmit)="AddPayment()">
      <div class="row">

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company"
              (change)="selectcompany($event)" required>
              @for (company1 of company1; track company1) {
                <ng-option [value]="company1.companyMasterID">
                  {{ company1.companyName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Company *</span>
            @if (!company.valid && addPayment.submitted) {
              <div class="invalid-tooltip">
                Company is required!
              </div>
            }
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select [items]="allbranch" [multiple]="true" bindLabel="branchName" groupBy="selectedAllGroup"
              (ngModelChange)="selectbranch()" [(ngModel)]="selectedBranch" [selectableGroup]="true"
              [selectableGroupAsModel]="false" bindValue="branchMasterID" [closeOnSelect]="false" ngModel
              #branch="ngModel" name="branch">
              <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                  [ngModelOptions]="{standalone: true}" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>


          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="false" bindLabel="displayName" bindValue="userMasterID" ngModel
                #user="ngModel" name="user" [(ngModel)]="selectedUser" required>
                <ng-template ng-optgroup-tmp let-item="item">
                  {{ item.displayName }}
                </ng-template>
              </ng-select>
              <span>Employee*</span>
              @if (!user.valid && addPayment.submitted) {
                <div class="invalid-tooltip">
                  Employee is user!
                </div>
              }
            </label>
          </div>


          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" ngModel #amount="ngModel" required name="amount" />
              <span>Amount *</span>
              @if (!amount.valid && addPayment.submitted) {
                <div class="invalid-tooltip">
                  Amount  is required!
                </div>
              }
            </label>
          </div>
          @if (expensefiltervalue == '0') {
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel #expenseDate="ngModel" name="expenseDate" />
                <span>Expense Date</span>
              </label>
            </div>
          }
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" ngModel #paymentDate="ngModel" name="paymentDate" required />
              <span>Payment Date *</span>
              @if (!paymentDate.valid && addPayment.submitted) {
                <div class="invalid-tooltip">
                  Payment Date is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #paymentmode="ngModel" name="paymentmode" required>
                <ng-option value="Cash">Cash</ng-option>
                <ng-option value="Cheque">Cheque</ng-option>
                <ng-option value="UPI">UPI</ng-option>
                <ng-option value="NetBanking">NetBanking</ng-option>
              </ng-select>
              <span>Payment Mode *</span>
              @if (!paymentmode.valid && addPayment.submitted) {
                <div class="invalid-tooltip">
                  Payment Mode is required!
                </div>
              }
            </label>
          </div>

          @if (
            addPayment.value.paymentmode && addPayment.value.paymentmode != 'Cash'
            ) {
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" #referenceNO="ngModel" ngModel name="referenceNO" />
                <!-- <span>{{ addPayment.value.paymentmode }} Reference NO</span> -->
                <span>Reference NO</span>
                <!-- <div *ngIf="!referenceNO.valid && addPayment.submitted" class="invalid-tooltip">
                Reference NO is required!
              </div> -->
            </label>
          </div>
        }
        @if (addPayment.value.paymentmode && addPayment.value.paymentmode != 'Cash') {
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" ngModel #referenceDate="ngModel" name="referenceDate" />
              <span> Reference Date</span>
            </label>
          </div>
        }



        <div class="col-md-4">
          <label class="form-group has-float-label">
            <textarea class="form-control" ngModel #remarks="ngModel" name="remarks"></textarea>
            <span>Remarks *</span>
            @if (!remarks.valid && addPayment.submitted) {
              <div class="invalid-tooltip">
                Remarks  is required!
              </div>
            }
          </label>
        </div>

      </div>


      <div class="col-md-12">
        <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
        <button class="btn btn-danger btn-shadow mt-4" [routerLink]="adminRoot + '/finances/list_advance_payment'"
          style="margin-left: 2%">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
