<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Appove Request Advance Payment</h5>

    @if (advanceData) {
      <form #approvereqadvancepayment="ngForm" novalidate (ngSubmit)="(onSubmit)">
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" [readonly]="true" (change)="selectcompany($event)" ngModel
                #company1="ngModel" name="company1" [(ngModel)]="advanceData.companyMasterID" required>
                @for (company of allcomp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Company *</span>
              @if (!company1.valid && approvereqadvancepayment.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" [readonly]="true" ngModel #userMasterId1="ngModel"
                name="userMasterId1" [(ngModel)]="advanceData.userMasterID" required>
                @for (user of employee; track user) {
                  <ng-option [value]="user.userMasterID">
                    {{ user.displayName }}
                  </ng-option>
                }
              </ng-select>
              <span>UserName *</span>
              @if (!userMasterId1.valid && approvereqadvancepayment.submitted) {
                <div class="invalid-tooltip">
                  User is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" required ngModel #advanceDate="ngModel" name="advanceDate"
                [(ngModel)]="advanceData.advanceDate" />
                <span>Advance Date *</span>
                @if (!advanceDate.valid && approvereqadvancepayment.submitted) {
                  <div class="invalid-tooltip">
                    Advance Date is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-3">
              <label class="form-group has-float-label">
                <input class="form-control" type="month" required ngModel #PaymentYearMonth1="ngModel"
                  name="PaymentYearMonth1" [(ngModel)]="advanceData.paymentYearMonth" />
                  <span>Select Month to Deduct Advance *</span>
                  @if (!PaymentYearMonth1.valid && approvereqadvancepayment.submitted) {
                    <div class="invalid-tooltip">
                      Month is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-3">
                <label class="form-group has-float-label">
                  <input class="form-control" type="number" required ngModel #advanceAmount="ngModel" name="advanceAmount"
                    [(ngModel)]="advanceData.amount" />
                    <span>Advance Amount *</span>
                    @if (!advanceAmount.valid && approvereqadvancepayment.submitted) {
                      <div class="invalid-tooltip">
                        Advance Amount is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-3">
                  <label class="form-group has-float-label">
                    <ng-select placeholder="Choose your option" ngModel #paymentmode="ngModel" name="paymentmode"
                      [(ngModel)]="advanceData.paymentmode" required>
                      <ng-option value="Cash">Cash</ng-option>
                      <ng-option value="Cheque">Cheque</ng-option>
                      <ng-option value="UPI">UPI</ng-option>
                      <ng-option value="NetBanking">NetBanking</ng-option>
                    </ng-select>
                    <span>Payment Mode *</span>
                    @if (!paymentmode.valid && approvereqadvancepayment.submitted) {
                      <div class="invalid-tooltip">
                        Payment Mode is required!
                      </div>
                    }
                  </label>
                </div>
                @if (
                  approvereqadvancepayment.value.paymentmode != '' &&
                  approvereqadvancepayment.value.paymentmode != 'Cash'
                  ) {
                  <div class="col-md-3">
                    <label class="form-group has-float-label">
                      <input class="form-control" required ngModel #referenceNo="ngModel" name="referenceNo"
                        [(ngModel)]="advanceData.referenceNO" />
                        <span>{{ approvereqadvancepayment.value.paymentmode }} Reference NO *</span>
                        @if (!referenceNo.valid && approvereqadvancepayment.submitted) {
                          <div class="invalid-tooltip">
                            Reference No is required!
                          </div>
                        }
                      </label>
                    </div>
                  }
                  @if (
                    approvereqadvancepayment.value.paymentmode != '' &&
                    approvereqadvancepayment.value.paymentmode != 'Cash'
                    ) {
                    <div class="col-md-3">
                      <label class="form-group has-float-label">
                        <input class="form-control" type="date" required ngModel #referencedate="ngModel" name="referencedate"
                          [(ngModel)]="advanceData.referenceDate" />
                          <span>{{ approvereqadvancepayment.value.paymentmode }} Reference Date *</span>
                          @if (!referencedate.valid && approvereqadvancepayment.submitted) {
                            <div class="invalid-tooltip">
                              Reference Date is required!
                            </div>
                          }
                        </label>
                      </div>
                    }
                    <div class="col-md-6">
                      <label class="form-group has-float-label">
                        <textarea class="form-control" type="text" required ngModel #Description="ngModel" name="Description"
                        [(ngModel)]="advanceData.description"></textarea>
                        <span>Description *</span>
                        @if (!Description.valid && approvereqadvancepayment.submitted) {
                          <div class="invalid-tooltip">
                            Description is required!
                          </div>
                        }
                      </label>
                    </div>
                  </div>
                  <br />
                  <button class="btn btn-primary mr-2" type="submit" [disabled]="isdisabled" (click)="onSubmit()">
                    {{ 'Approve' | translate }}
                  </button>
                  <button class="btn btn-danger btn-shadow" [routerLink]="adminRoot + '/finances/advancePayment'"
                    style="margin-left: 2%">
                    Cancel
                  </button>
                </form>
              }
            </div>
          </div>


          <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
