<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showOrderBy]="false" [showDisplayMode]="false" [searchValue]="filterData.search"
  (searchKeyUp)="updateFilter($event)" (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage" name="My Incentive"></app-list-page-header>
<div class="card mb-4">
  <div class="card-body">

    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="month" ngModel #startmonth="ngModel" name="startmonth"
                [(ngModel)]="startMonth" (change)="selectmonth()" required />
                <span>From Month *</span>
                @if (!startmonth.valid && datefilter.submitted) {
                  <div class="invalid-tooltip">
                    From Month is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="month" ngModel #tomonth="ngModel" name="tomonth" [(ngModel)]="endMonth"
                  (change)="selectmonth()" [min]="startMonth" required />
                  <span>To Month *</span>
                  @if (!tomonth.valid && datefilter.submitted) {
                    <div class="invalid-tooltip">
                      To Month is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <button class="btn btn-primary form-group" type="submit">
                  {{ 'forms.submit' | translate }}
                </button>
                &nbsp;&nbsp;
                <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
              </div>
            </div>
          </form>
        }
      </div>
    </div>

    @if (rows && permissionview.length != 0) {
      <div class="row">
        <div class="col-12 mb-4 data-table-rows">
          <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
            [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
            (page)="onChange($event)">
            <ngx-datatable-column name="MonthYear" prop="yearmonth" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
            <ngx-datatable-column name="Incentive Type" [flexGrow]="1.2" [width]="180">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row.inc_type_displayName ? row.inc_type_displayName:row.incentivetypename }}
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Amount" prop="amount" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
            <ngx-datatable-column name="Incentive Date" prop="incentiveDate" [flexGrow]="1.2" [width]="180">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row.incentiveDate | date: 'dd-MM-yyyy' }}
              </ng-template>
            </ngx-datatable-column>
            @if (true) {
              <ngx-datatable-footer>
                <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                  let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                  <div class="w-100 d-flex justify-content-center">
                    <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                      [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                      [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                    [customPreviousTemplate]="prevTemplate"></pagination>
                  </div>
                </ng-template>
              </ngx-datatable-footer>
            }
          </ngx-datatable>
        </div>
      </div>
    }

    <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
      <i class="simple-icon-arrow-left"></i>
    </ng-template>
    <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
      <i class="simple-icon-arrow-right"></i>
    </ng-template>
    <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-right"></i>
    </ng-template>
    <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-left"></i>
    </ng-template>

    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
