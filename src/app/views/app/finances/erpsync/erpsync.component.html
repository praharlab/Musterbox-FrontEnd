<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Erp Sync" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    <form #filterdata="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #userMasterID="ngModel" name="userMasterID"
              [(ngModel)]="filterData.userMasterID">
              @for (item of alldata1; track item) {
                <ng-option [value]="item.userMasterID">
                  {{ item.displayName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Employee</span>
          </label>
        </div>
        <div class="col-md-3">
          <label class="form-group has-float-label">
            <input class="form-control" type="date" ngModel #expensedate="ngModel" name="expensedate"
              [(ngModel)]="filterData.expense_date" />
              <span>Expense Date</span>
            </label>
          </div>
          <div class="col-md-5">
            <button class="btn btn-primary form-group" type="submit">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-danger form-group" type="button" (click)="clear()">
              Clear
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-success form-group" type="button" (click)="refresh()">
              Refresh
            </button>
          </div>
          <div class="col-md-12">

            <button class="btn btn-success form-group" type="button" (click)="findExpesneWithNegativeJvID()">
              Download -1 ERP JVID
            </button>
            &nbsp;&nbsp;

            <button class="btn btn-success form-group" type="button" (click)="findUnassigedERPAccountData()">
              Un-assigned ERP Acount Expense
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <br />
  @if (rows && permissionview.length != 0) {
    <div class="row">
      <div class="col-12 mb-4 data-table-rows">
        <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
          [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
          (page)="onChange($event)" #table>
          <ngx-datatable-column [flexGrow]="1.2" [width]="50">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button class="btn btn-info" (click)="alertSyncConfirmation(row)">
                Sync
              </button>
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Employee Name" prop="displayName" [flexGrow]="1.2"
          [width]="200"></ngx-datatable-column>
          <ngx-datatable-column name="Expense Date" prop="expense_date" [flexGrow]="1.2" [width]="100">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.expense_date | date: 'dd-MM-yyyy' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Expense Amount" prop="netAmount" [flexGrow]="1.2"
          [width]="100"></ngx-datatable-column>
          <!-- <ngx-datatable-column name="ERP Account ID" prop="erpAcountID" [flexGrow]="1.2" [width]="100"></ngx-datatable-column> -->
          <!-- <ngx-datatable-column name="Expense Account Head" prop="accountHeadID" [flexGrow]="1.2" [width]="200"></ngx-datatable-column> -->
          <!-- <ngx-datatable-column name="Expense Amount HeadWise" prop="expenseAmountheadwise" [flexGrow]="1.2" [width]="200"></ngx-datatable-column> -->
          <ngx-datatable-column name="Description" prop="description" [flexGrow]="1.2" [width]="200"></ngx-datatable-column>
          @if (true) {
            <ngx-datatable-footer>
              <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                <div class="w-100 d-flex justify-content-center">
                  <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                    [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                    (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"></pagination>
                </div>
              </ng-template>
            </ngx-datatable-footer>
          }
        </ngx-datatable>
      </div>
    </div>
  }

  <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-left"></i>
  </ng-template>
  <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-right"></i>
  </ng-template>
  <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right"></i>
  </ng-template>
  <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left"></i>
  </ng-template>

  <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
