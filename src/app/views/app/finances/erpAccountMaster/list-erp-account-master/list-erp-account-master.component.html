<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Erp Account Link" [showadd]="permissioncreate" [showOrderBy]="false"
  [showDisplayMode]="false" [showSearch]="false" (itemsPerPageChange)="onLimitChange($event)"
  [itemsPerPage]="filterData.limit" [itemOptionsPerPage]="itemOptionsPerPage"
(addNewItem)="showAddNewModal()"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="true" bindLabel="displayName" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="userMasterID" [closeOnSelect]="false"
                ngModel #user="ngModel" name="user" [(ngModel)]="selected">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select User</span>
            </label>
          </div>
          <div class="col-md-6" style="float: right">
            <button class="btn btn-primary form-group" type="submit">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          </div>
        </div>
      </form>
    }
  </div>
</div>
@if (rows && permissionview.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="User Name" prop="displayName" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Erp Account ID" prop="erpAcountID" [flexGrow]="1.2"
        [width]="180"></ngx-datatable-column>
        @if (permissionedit.length != 0 || permissiondelete.length != 0) {
          <ngx-datatable-column name="Action" [sortable]="true" [width]="220"
            >
            <ng-template let-row="row" ngx-datatable-cell-template>
              <!-- <a routerLink="/app/erpAccountMaster/edit_erpAccountMaster/{{ row.erpAcountMasterID }}">
              <span
                [class]="'glyph-icon simple-icon-pencil tool_tip'"
                style="padding-right: 10px; font-size: 18px;"
                *ngIf="permissionedit.length != 0"
              ></span>
              {{ ' ' }}
            </a> -->
            <a (click)="alertConfirmation(row.erpAcountMasterID)">
              @if (permissiondelete.length != 0) {
                <span [class]="'glyph-icon simple-icon-trash tool_tip'" style="padding-right: 6px; font-size: 18px"
                ></span>
              }
              {{ ' ' }}
            </a>
          </ng-template>
        </ngx-datatable-column>
      }
      @if (true) {
        <ngx-datatable-footer>
          <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
            let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
            <div class="w-100 d-flex justify-content-center">
              <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                [customLastTemplate]="lastTemplate" [itemsPerPage]="pageSize" [maxSize]="5" [(ngModel)]="currentPage"
                (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
              [customPreviousTemplate]="prevTemplate"></pagination>
            </div>
          </ng-template>
        </ngx-datatable-footer>
      }
    </ngx-datatable>
  </div>
</div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Refund</h4>
        <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close"
          #closeModal>
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
    </div>
  </div>
</div>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
