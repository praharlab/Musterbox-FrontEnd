<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Deposit</h5>

    <div
      bsModal
      #lgModal1="bs-modal"
      class="modal fade"
      tabindex="-1"
      role="dialog"
      aria-labelledby="dialog-sizes-name1"
      [config]="{ backdrop: 'static', keyboard: false }"
      >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title pull-left">Add Deposit Category</h4>
            <button
              type="button"
              class="btn-close close pull-right"
              (click)="lgModal1.hide()"
              aria-label="Close"
              #closeModal
              >
              <span aria-hidden="true" class="visually-hidden">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form #addcomp1="ngForm" novalidate (ngSubmit)="onSubmit1(); lgModal1.hide()">
              <div class="row">
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <ng-select
                      placeholder="Choose your option"
                      ngModel
                      #companyMasterID="ngModel"
                      name="companyMasterID"
                      required
                      >
                      @for (comp of company; track comp) {
                        <ng-option [value]="comp.companyMasterID">
                          {{ comp.companyName }}
                        </ng-option>
                      }
                    </ng-select>
                    <span>Select Company *</span>
                    @if (!companyMasterID.valid && addcomp1.submitted) {
                      <div
                        class="invalid-tooltip"
                        >
                        Company is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="text"
                      required
                      ngModel
                      #depositcategoryname="ngModel"
                      name="depositcategoryname"
                      />
                      <span>Deposit Category *</span>
                      @if (!depositcategoryname.valid && addcomp1.submitted) {
                        <div
                          class="invalid-tooltip"
                          >
                          Deposit Category is required!
                        </div>
                      }
                    </label>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <form #adddeposit="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #companyMasterID1="ngModel"
                name="companyMasterID1"
                required
                (change)="companyid($event)"
                [(ngModel)]="selectedCompany"
                >
                @for (company of company; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID1.valid && adddeposit.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>

          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                [items]="user"
                [multiple]="true"
                bindLabel="displayName"
                groupBy="selectedAllGroup"
                required
                [selectableGroup]="true"
                [selectableGroupAsModel]="false"
                bindValue="userMasterID"
                [closeOnSelect]="false"
                ngModel
                #user1="ngModel"
                name="user1"
                [(ngModel)]="selectedUser"
                >
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input
                    id="item-{{ index }}"
                    type="checkbox"
                    [ngModel]="item$.selected"
                    name="selectall"
                    [ngModelOptions]="{ standalone: true }"
                    />
                    Select All
                  </ng-template>
                </ng-select>
                <span>Select User *</span>
                @if (!user1.valid && adddeposit.submitted) {
                  <div class="invalid-tooltip">
                    User is required!
                  </div>
                }
              </label>
            </div>

            <div class="col-md-5">
              <label class="form-group has-float-label">
                <ng-select
                  placeholder="Choose your option"
                  ngModel
                  #depositCategoryID="ngModel"
                  name="depositCategoryID"
                  required
                  >
                  @for (category of category; track category) {
                    <ng-option [value]="category.depositcategoryid">
                      {{ category.depositcategoryname }}
                    </ng-option>
                  }
                </ng-select>
                <span>Select Deposit Category *</span>
                @if (!depositCategoryID.valid && adddeposit.submitted) {
                  <div class="invalid-tooltip">
                    Deposit Category is required!
                  </div>
                }
              </label>
            </div>

            <div class="col-md-1">
              <label class="form-group has-float-label">
                <button
                  (click)="lgModal1.show()"
                  style="font-size: large"
                  class="btn btn-primary"
                  type="button"
                  >
                  +
                </button>
              </label>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="number"
                  required
                  ngModel
                  #amount="ngModel"
                  name="amount"
                  />
                  <span>Amount *</span>
                  @if (!amount.valid && adddeposit.submitted) {
                    <div class="invalid-tooltip">
                      Amount is required!
                    </div>
                  }
                </label>
              </div>

              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <textarea
                    class="form-control"
                    ngModel
                    #description="ngModel"
                    name="description"
                  ></textarea>
                  <span>Description</span>
                </label>
              </div>

              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <ng-select
                    placeholder="Choose your option"
                    ngModel
                    #depositReceiveAs="ngModel"
                    name="depositReceiveAs"
                    required
                    (change)="depositreceived($event)"
                    >
                    <ng-option value="cash">Cash/Bank</ng-option>
                    <ng-option value="salary">Salary</ng-option>
                  </ng-select>
                  <span>Select Deposit Received As *</span>
                  @if (!depositReceiveAs.valid && adddeposit.submitted) {
                    <div class="invalid-tooltip">
                      Deposit Received As is required!
                    </div>
                  }
                </label>
              </div>

              @if (showdate) {
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="date"
                      ngModel
                      required
                      #dateOfDeposit="ngModel"
                      name="dateOfDeposit"
                      />
                      <span>Date Of Deposit *</span>
                      @if (!dateOfDeposit.valid && adddeposit.submitted) {
                        <div class="invalid-tooltip">
                          Date Of Deposit is required!
                        </div>
                      }
                    </label>
                  </div>
                }

                @if (salary) {
                  <div class="col-md-6">
                    <label class="form-group has-float-label">
                      <input
                        class="form-control"
                        type="month"
                        ngModel
                        required
                        #salaryMonth="ngModel"
                        name="salaryMonth"
                        />
                        <span>Salary Month *</span>
                        @if (!salaryMonth.valid && adddeposit.submitted) {
                          <div class="invalid-tooltip">
                            Salary Month is required!
                          </div>
                        }
                      </label>
                    </div>
                  }

                  <!-- <div class="col-md-12">
                  <hr />
                </div>

                <div class="col-md-6">

                    <ng-select

                    <div *ngIf="!depositPayAs.valid && adddeposit.submitted" class="invalid-tooltip">

                    </div>
                  </label>
                </div>

                      <div *ngIf="!salaryMonthPayable.valid && adddeposit.submitted" class="invalid-tooltip">
                        Salary Month To Pay is required!
                      </div>
                    </label>
                  </div> -->
                </div>

                <button class="btn btn-primary btn-shadow mt-4" style="margin-left: 2%" type="submit">Submit</button>

                <button
                  class="btn btn-danger btn-shadow mt-4"
                  [routerLink]="adminRoot + '/finances/deposit'"
                  style="margin-left: 2%"
                  >
                  Cancel
                </button>
              </form>
            </div>
          </div>

          <simple-notifications
            [options]="{ position: ['top', 'center'], maxStack: 1 }"
          ></simple-notifications>
