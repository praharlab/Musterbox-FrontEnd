<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header
  name="Skillsets Report"
  [showOrderBy]="false"
  [showSearch]="false"
  [showItemsPerPage]="false"
  [showDisplayMode]="false"
  [itemOptionsPerPage]="itemOptionsPerPage"
></app-list-page-header>
@if (permissionview.length != 0) {
  <div class="card mb-4">
    <div class="card-body">
      <form #datefilter="ngForm" novalidate (ngSubmit)="download()">
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #company="ngModel"
                name="company"
                (change)="selectcompany($event)"
                required
                >
                @for (company1 of company1; track company1) {
                  <ng-option [value]="company1.companyMasterID">
                    {{ company1.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!company.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="month"
                ngModel
                #YearMM="ngModel"
                name="YearMM"
                required
                />
                <span>Select YearMonth *</span>
                @if (!YearMM.valid && datefilter.submitted) {
                  <div class="invalid-tooltip">
                    From yearmonth is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-3">
              <label class="form-group has-float-label">
                <ng-select
                  [items]="designation1"
                  [multiple]="true"
                  bindLabel="designationName"
                  groupBy="selectedAllGroup"
                  [selectableGroup]="true"
                  [selectableGroupAsModel]="false"
                  bindValue="designationId"
                  [closeOnSelect]="false"
                  ngModel
                  #designation="ngModel"
                  name="designation"
                  [(ngModel)]="selected"
                  >
                  <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                    <input
                      id="item-{{ index }}"
                      type="checkbox"
                      [ngModel]="item$.selected"
                      name="selectall1"
                      />
                      Select All
                    </ng-template>
                  </ng-select>
                  <span>Select Designation</span>
                </label>
              </div>
              <div class="col-md-12">
                <!-- <button class="btn btn-primary form-group" type="submit">
                {{ 'forms.submit' | translate }}
              </button> -->
              <button class="btn btn-success form-group ml-2">Download CSV</button>
              &nbsp;&nbsp;
              <button class="btn btn-primary form-group ml-1" type="button" (click)="clear()">
                Clear
              </button>
            </div>
          </div>
        </form>
        <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-right"></i>
        </ng-template>
        <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-left"></i>
        </ng-template>
      </div>
    </div>
  }

  <simple-notifications
    [options]="{ position: ['top', 'center'], maxStack: 1 }"
  ></simple-notifications>
