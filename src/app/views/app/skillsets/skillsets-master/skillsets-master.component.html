<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="col-12">
  <app-heading></app-heading>
  <app-breadcrumb></app-breadcrumb>
  <div class="separator mb-5"></div>
</div>
@if (visible) {
  <div>
    <div class="row"></div>
    <!-- <h1 *ngIf="formdata.includes('VisitMain')">Visit</h1> -->
    @if (formdata.includes('SkillSets')) {
      <div class="row">
        @for (item of SkillsetsArray; track item) {
          @if (formdata.includes(item.menu)) {
            <div class="col-md-3" style="margin-bottom: 2%">
              <div class="card">
                <div class="card-body d-flex flex-lg-column flex-md-row flex-sm-row flex-column">
                  <div class="price-top-part" style="cursor: pointer" [routerLink]="item.to">
                    <i [class]="item.icon + ' large-icon'"></i>
                    <h5 class="mb-0 font-weight-semibold color-theme-1 mb-4">{{ item.label }}</h5>
                  </div>
                </div>
              </div>
            </div>
          }
        }
      </div>
    }
  </div>
}
