<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (permissionedit.length != 0) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Verify Form</h5>
      <form novalidate (ngSubmit)="onSubmit()">
        @for (value of values; track value; let i = $index) {
          <div class="row">
            <div class="col-md-12">
              <p style="text-align: justify; font-size: 14px !important; font-weight: 600 !important">
                {{ i + 1 }}. &nbsp;&nbsp;{{ value.skillSet }}
              </p>
            </div>
            <div class="col-md-3 leftside">
              <div class="radio-group d-flex justify-content-between">
                <label class="radio-label">
                  <input
                    type="radio"
                    class="radio-button"
                    required
                    name="skillsetsForm{{ i }}"
                    [value]="0"
                    [checked]="value.answers == 0"
                    (change)="onSkillSetChange(i, 0)"
                    />
                    <span style="font-weight: 600 !important">0%</span>
                  </label>
                  <label class="radio-label">
                    <input
                      type="radio"
                      class="radio-button"
                      required
                      name="skillsetsForm{{ i }}"
                      [value]="25"
                      [checked]="value.answers == 25"
                      (change)="onSkillSetChange(i, 25)"
                      />
                      <span style="font-weight: 600 !important">25%</span>
                    </label>
                    <label class="radio-label">
                      <input
                        type="radio"
                        class="radio-button"
                        required
                        name="skillsetsForm{{ i }}"
                        [value]="50"
                        [checked]="value.answers == 50"
                        (change)="onSkillSetChange(i, 50)"
                        />
                        <span style="font-weight: 600 !important">50%</span>
                      </label>
                      <label class="radio-label">
                        <input
                          type="radio"
                          class="radio-button"
                          required
                          name="skillsetsForm{{ i }}"
                          [value]="75"
                          [checked]="value.answers == 75"
                          (change)="onSkillSetChange(i, 75)"
                          />
                          <span style="font-weight: 600 !important">75%</span>
                        </label>
                        <label class="radio-label">
                          <input
                            type="radio"
                            class="radio-button"
                            required
                            name="skillsetsForm{{ i }}"
                            [value]="100"
                            [checked]="value.answers == 100"
                            (change)="onSkillSetChange(i, 100)"
                            />
                            <span style="font-weight: 600 !important">100%</span>
                          </label>
                        </div>
                      </div>
                    </div>
                  }
                  <div class="col-md-3 mt-4">
                    <button class="btn btn-primary form-group" type="submit">Verify</button>
                  </div>
                </form>
              </div>
            </div>
          }

          <simple-notifications
            [options]="{ position: ['top', 'center'], maxStack: 1 }"
          ></simple-notifications>
