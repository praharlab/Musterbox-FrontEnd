<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Employee NDA</h5>

    <div
      bsModal
      #lgModal1="bs-modal"
      class="modal fade"
      tabindex="-1"
      role="dialog"
      aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}"
      >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title pull-left">Add NDA Category</h4>
            <button
              type="button"
              class="btn-close close pull-right"
              (click)="lgModal1.hide()"
              aria-label="Close"
              #closeModal
              >
              <span aria-hidden="true" class="visually-hidden">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form #addcomp1="ngForm" novalidate (ngSubmit)="onSubmit1(); lgModal1.hide()">
              <div class="row">
                @if (childcompany == 'false') {
                  <div class="col-md-6">
                    <label class="form-group has-float-label">
                      <ng-select
                        placeholder="Choose your option"
                        ngModel
                        #company="ngModel"
                        name="company"
                        required
                        >
                        @for (comp of comp; track comp) {
                          <ng-option [value]="comp.companyMasterID">
                            {{ comp.companyName }}
                          </ng-option>
                        }
                      </ng-select>
                      <span>Select Company *</span>
                      @if (!company.valid && addcomp1.submitted) {
                        <div class="invalid-tooltip">
                          Company is required!
                        </div>
                      }
                    </label>
                  </div>
                }
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="text"
                      required
                      ngModel
                      #category="ngModel"
                      name="category"
                      />
                      <span>NDA Category *</span>
                      @if (!category.valid && addcomp1.submitted) {
                        <div class="invalid-tooltip">
                          NDA Category is required!
                        </div>
                      }
                    </label>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          @if (childcompany == 'false') {
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <ng-select
                  placeholder="Choose your option"
                  ngModel
                  #company="ngModel"
                  name="company"
                  (change)="setcompid($event)"
                  required
                  >
                  @for (comp of comp; track comp) {
                    <ng-option [value]="comp.companyMasterID">
                      {{ comp.companyName }}
                    </ng-option>
                  }
                </ng-select>
                <span>Select Company *</span>
                @if (!company.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    Company is required!
                  </div>
                }
              </label>
            </div>
          }
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #user="ngModel"
                name="user"
                required
                >
                @for (user of employee; track user) {
                  <ng-option [value]="user.userMasterID">
                    {{ user.displayName }} ({{ user.userNumber }})
                  </ng-option>
                }
              </ng-select>
              <span>Select User *</span>
              @if (!user.valid && addcomp.submitted) {
                <div class="invalid-tooltip">
                  User is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #ndamane="ngModel"
                name="ndamane"
                />
                <span>NDA Name *</span>
                @if (!ndamane.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    NDA Name is required!
                  </div>
                }
              </label>
            </div>

            <div class="col-md-3">
              <label class="form-group has-float-label">
                <ng-select
                  placeholder="Choose your option"
                  ngModel
                  #ndacat="ngModel"
                  name="ndacat"
                  required
                  >
                  @for (ndacategory1 of ndacategory1; track ndacategory1) {
                    <ng-option
                      [value]="ndacategory1.Ndacategoryid"
                      >
                      {{ ndacategory1.nda_category }}
                    </ng-option>
                  }
                </ng-select>
                <span>Select NDA Category *</span>
                @if (!ndacat.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    NDA Category is required!
                  </div>
                }
              </label>
            </div>

            <div class="col-md-1">
              <label class="form-group has-float-label">
                <button
                  (click)="lgModal1.show()"
                  style="font-size: large"
                  class="btn btn-primary"
                  type="button"
                  >
                  +
                </button>
              </label>
            </div>

            <div class="col-md-4">
              <label class="form-group has-float-label">
                <textarea
                  class="form-control"
                  ngModel
                  #description="ngModel"
                  name="description"
                ></textarea>
                <span>Description *</span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="file"
                  required
                  ngModel
                  #pdf="ngModel"
                  (change)="onSelectFile($event)"
                  name="pdf"
                  />
                  <span>File *</span>
                  @if (!pdf.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      File is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="date" required ngModel #date="ngModel" name="date" />
                  <span>Given Date *</span>
                  @if (!date.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      Date is required!
                    </div>
                  }
                </label>
              </div>

              <div class="col-md-4">
                <span><b>Show to Employee *</b></span>
                &nbsp;&nbsp;
                <input
                  type="radio"
                  name="defaultRight"
                  value="true"
                  ngModel
                  #defaultRight="ngModel"
                  style="margin-right: 1%"
                  required
                  />
                  <label for="true" style="margin-right: 1%">Yes</label>
                  <input
                    type="radio"
                    name="defaultRight"
                    value="false"
                    ngModel
                    #defaultRight="ngModel"
                    style="margin-right: 1%"
                    required
                    />
                    <label for="false">No</label>
                    @if (!defaultRight.valid && addcomp.submitted) {
                      <div class="invalid-tooltip">
                        Show to Employee is required!
                      </div>
                    }
                  </div>
                </div>
                <div class="col-md-12">
                  <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                  <button
                    class="btn btn-danger btn-shadow mt-4"
                    [routerLink]="adminRoot + '/payrolls/employee_nda'"
                    style="margin-left: 2%"
                    >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          </div>

          <simple-notifications
            [options]="{ position: ['top', 'center'], maxStack: 1 }"
          ></simple-notifications>
