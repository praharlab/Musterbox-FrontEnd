<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Weekoff Shuffle</h5>

    <form #addPayment="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company"
              (change)="selectcompany($event)" required>
              @for (company1 of company1; track company1) {
                <ng-option [value]="company1.companyMasterID">
                  {{ company1.companyName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Company *</span>
            @if (!company.valid && addPayment.submitted) {
              <div class="invalid-tooltip">
                Company is required!
              </div>
            }
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select [items]="allbranch" [multiple]="true" bindLabel="branchName"
              groupBy="selectedAllGroup" (ngModelChange)="selectbranch()" [(ngModel)]="selectedBranch"
              [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="branchMasterID"
              [closeOnSelect]="false" ngModel #branch="ngModel" name="branch">
              <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                  [ngModelOptions]="{standalone: true}" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>

          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="true" bindLabel="displayName"
                groupBy="selectedAllGroup" required [selectableGroup]="true"
                [selectableGroupAsModel]="false" bindValue="userMasterID" [closeOnSelect]="false" ngModel
                #user="ngModel" name="user" [(ngModel)]="selectedUser">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall"
                    [ngModelOptions]="{standalone: true}" />
                    Select All
                  </ng-template>
                </ng-select>
                <span>Select User *</span>
                @if (!user.valid && addPayment.submitted) {
                  <div class="invalid-tooltip">
                    User is required!
                  </div>
                }
              </label>
            </div>

            <!--
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <ng-select [items]="alluser" [multiple]="true" bindLabel="displayName" bindValue="userMasterID"
                  ngModel #user="ngModel" name="user" [(ngModel)]="selectedUser" required>
                  <ng-template ng-optgroup-tmp let-item="item">
                    {{ item.displayName }}
                  </ng-template>
                </ng-select>
                <span>Employee*</span>
                <div *ngIf="!user.valid && addPayment.submitted" class="invalid-tooltip">
                  Employee is user!
                </div>
              </label>
            </div> -->

            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel #weekoffshuffled="ngModel"
                  name="weekoffshuffled"  required/>
                  <span>Week Off Shuffle*</span>
                  @if (!weekoffshuffled.valid && addPayment.submitted) {
                    <div class="invalid-tooltip">
                      Week Off Shuffle is required!
                    </div>
                  }
                </label>
              </div>

              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="date" ngModel #shuffled="ngModel" name="shuffled" required />
                  <span>Shuffled*</span>
                  @if (!shuffled.valid && addPayment.submitted) {
                    <div class="invalid-tooltip">
                      Shuffled is required!
                    </div>
                  }
                </label>
              </div>


              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <textarea class="form-control" ngModel #remarks="ngModel" name="remarks" required></textarea>
                  <span>Remarks *</span>
                  @if (!remarks.valid && addPayment.submitted) {
                    <div class="invalid-tooltip">
                      Remarks is required!
                    </div>
                  }
                </label>
              </div>

            </div>


            <div class="col-md-12">
              <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
              <button class="btn btn-danger btn-shadow mt-4" [routerLink]="adminRoot + '/payrolls/weekoff_shuffle'"
                style="margin-left: 2%">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>

      <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
