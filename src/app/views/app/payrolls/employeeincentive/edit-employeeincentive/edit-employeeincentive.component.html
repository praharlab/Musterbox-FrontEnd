<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit Employee incentive</h5>

    <form #editincentive="ngForm" novalidate (ngSubmit)="onSubmit()">
      @if (visible) {
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #companyMasterID="ngModel" required
                (change)="companydata($event)" name="companyMasterID" [readonly]="true"
                [(ngModel)]="employeedata.userMaster.companyMasterId">
                @for (company of company; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && editincentive.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="ownerList" bindLabel="name" required [selectableGroup]="true" bindValue="userMasterID"
                [readonly]="true" ngModel #employee="ngModel" name="employee"
                [(ngModel)]="employeedata.userMaster.userMasterID">
                <!-- <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{index}}" type="checkbox" [ngModel]="item$.selected" /> Select All
              </ng-template>  -->
            </ng-select>
            <span>Select Employee *</span>
            @if (!employee.valid && editincentive.submitted) {
              <div class="invalid-tooltip">
                Employee is required!
              </div>
            }
          </label>
        </div>
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #incentivetypename="ngModel" name="incentivetypename"
              [readonly]="true" required [(ngModel)]="employeedata.IncentivetypeID">
              @for (list of list; track list) {
                <ng-option [value]="list.IncentivetypeID">
                  {{ list.incentivetypename }}
                  @if (!incentivetypename.valid && editincentive.submitted) {
                    <div class="invalid-tooltip">
                      Incentive type Category is required!
                    </div>
                  }
                </ng-option>
              }
            </ng-select>
            <span>Select incentive Category *</span>
            @if (!incentivetypename.valid && editincentive.submitted) {
              <div class="invalid-tooltip">
                Incentive Category is required!
              </div>
            }
          </label>
        </div>
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <input class="form-control" type="month" required ngModel #yearmonth="ngModel" name="yearmonth"
              [(ngModel)]="employeedata.yearmonth" />
              <span>YearMonth *</span>
              @if (!yearmonth.valid && editincentive.submitted) {
                <div class="invalid-tooltip">
                  YearMonth is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="number" required ngModel #amount="ngModel" name="amount"
                [(ngModel)]="employeedata.amount" />
                <span>Amount *</span>
                @if (!amount.valid && editincentive.submitted) {
                  <div class="invalid-tooltip">
                    amount is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" placeholder="" ngModel #incentiveDate="ngModel"
                  [(ngModel)]="employeedata.incentiveDate" name="incentiveDate" required />
                  <span>Incentive Date *</span>
                  @if (!incentiveDate.valid && editincentive.submitted) {
                    <div class="invalid-tooltip">
                      Incentive Date is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <textarea class="form-control" [(ngModel)]="employeedata.description" ngModel #description="ngModel"
                  name="description"></textarea>
                  <span>Description</span>
                </label>
              </div>
            </div>
          }
          <div class="row">
            <div class="col-md-12">
              <button class="btn btn-primary" type="submit">{{ 'forms.submit' | translate }}</button>
              <button class="btn btn-danger btn-shadow" [routerLink]="'/app/list-employeeincentive'"
                [routerLink]="adminRoot + '/payrolls/list-employeeincentive'" style="margin-left: 1%">
                Cancel
              </button>
            </div>
          </div>
        </form>
        <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
      </div>
    </div>
