@if (rows && rows.length && permissionview.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Year Month" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.yearMonth | date : 'MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Payroll Frequency" [flexGrow]="1.2" [width]="220">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div>
              {{ row.payrollFrequency|| '' }}
            </div>
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Start Date" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.startDate | date : 'dd-MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="End Date" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.endDate | date : 'dd-MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Show Data" [flexGrow]="1.2" [width]="150">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <button type="button" class="btn btn-primary btn-xs" (click)="lgModal.show(); showSalarySlip(row)">
              {{ 'Show Data' | translate }}
            </button>
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Created At" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdAt | date : 'dd-MM-yyyy h:mm a' }}
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="limit" [maxSize]="5"
                  (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>


<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1"
  [config]="{ backdrop: 'static', keyboard: false }">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Show Data</h4>
        <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div>
          <button class="btn btn-primary" (click)="download()">Download</button>
        </div>
        <div>
          <pdf-viewer [src]="salarySlipPath" [rotation]="0" [original-size]="false" [show-all]="true"
            [fit-to-page]="false" [zoom]="1" [zoom-scale]="'page-width'" [stick-to-page]="false" [render-text]="true"
            [external-link-target]="'blank'" [autoresize]="true" [show-borders]="false"
          style="height: 1000px"></pdf-viewer>
        </div>
      </div>
    </div>
  </div>
