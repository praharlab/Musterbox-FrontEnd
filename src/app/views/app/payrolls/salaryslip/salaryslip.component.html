<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="row">
  <div class="col-12">
    <app-heading title="Salary Slip"></app-heading>
    <app-breadcrumb title="Salary Slip"></app-breadcrumb>
    <div class="separator mb-5"></div>
  </div>
</div>
@if (salarydata && permissiondelete.length != 0) {
  <button
    class="btn btn-primary pull-right mb-2"
    (click)="onClickDownloadPdf()"
    >
    Download PDF
  </button>
}
<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form
        #datefilter="ngForm"
        novalidate
        (ngSubmit)="salaryslip()"
        >
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="month"
                required
                ngModel
                #YearMM="ngModel"
                name="YearMM"
                />
                <span>YearMonth *</span>
                <!-- <div *ngIf="!ctc.valid && addattendance.submitted" class="invalid-tooltip">CTC is required!</div> -->
              </label>
            </div>
            <div class="col-md-3">
              <button class="btn btn-primary form-group" type="submit">
                {{ 'forms.submit' | translate }}
              </button>
              &nbsp;&nbsp;
              <!-- <button
              class="btn btn-primary form-group"
              type="button"
              (click)="clear()"
              >
              Clear
            </button> -->
          </div>
          <div class="col-md-3" style="text-align: right">
            <!-- <span class="btn btn-info mb-1" (click)="downloadFile()">Export</span> -->
          </div>
        </div>
      </form>
    }
  </div>
</div>

<br />
@if (salarydata && permissionview.length != 0) {
  <div style="text-align: center; margin-top: 25px">
    <pdf-viewer
      [src]="salarydata.path"
      [rotation]="0"
      [original-size]="false"
      [show-all]="true"
      [fit-to-page]="false"
      [zoom]="1"
      [zoom-scale]="'page-width'"
      [stick-to-page]="false"
      [render-text]="true"
      [external-link-target]="'blank'"
      [autoresize]="true"
      [show-borders]="false"
      style="width: 50%; height: 1000px"
    ></pdf-viewer>
  </div>
}

<simple-notifications
  [options]="{ position: ['top', 'center'], maxStack: 1 }"
></simple-notifications>
