<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Employee List" [showadd]="permissioncreate" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showSearch]="false"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>
<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" (change)="selectcompany($event)" ngModel #company="ngModel"
                name="company" required>
                @for (company of company1; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Company *</span>
              @if (!company.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" (change)="selectbranch($event)" ngModel #branch="ngModel"
                name="branch" [(ngModel)]="finalbranch">
                @for (allbranch of allbranch; track allbranch) {
                  <ng-option [value]="allbranch.branchMasterID">
                    {{ allbranch.branchName }}
                  </ng-option>
                }
              </ng-select>
              <span>Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="employee" [multiple]="true" bindLabel="displayName" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="userMasterID" [closeOnSelect]="false"
                [(ngModel)]="selected" ngModel #userMasterID="ngModel" name="userMasterID">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
                  Select All
                </ng-template>
                <!-- <ng-template ng-option-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{index}}" type="checkbox" [ngModel]="item$.selected" />{{item.name}}
              </ng-template> -->
            </ng-select>
            <span>Select Employee</span>
          </label>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">
        {{ 'forms.submit' | translate }}
      </button>
      &nbsp;&nbsp;
      <button (click)="clear()" type="button" class="btn btn-primary">clear</button>
      <span> &nbsp;&nbsp; </span>
      @if (rows.length != 0) {
        <button (click)="downloadFile()" class="btn btn-primary">Export</button>
      }
    </form>
  }
</div>
</div>
@if (rows.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Name" prop="displayName" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Mobile Number" prop="userNumber" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Gender" prop="gender" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Email" prop="email" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
        <ngx-datatable-column name="Joining Date" prop="empJoining.joiningDate" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Biometric Code" prop="empJoining.biometricCode" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Biometric Serial No" prop="empJoining.biometricSerialNo" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Branch" prop="branchName" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Department" prop="departmentName" [flexGrow]="1.2"
        [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Designation" prop="designationName" [flexGrow]="1.2"
        [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Photo" [flexGrow]="1.2" [width]="230">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (row.facePhoto != '' || row.facePhoto != null) {
              <img src="{{ apiURL }}uploads/SalaryFace/{{ row.facePhoto }}" (click)="lgModal.show(); editimage(row)"
                height="50px" width="50px" />
            }
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Image</h4>
        <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div style="text-align: center">
          <img src="{{ apiURL }}uploads/SalaryFace/{{ image }}" height="350px" width="350px" />
        </div>
      </div>
    </div>
  </div>
</div>
