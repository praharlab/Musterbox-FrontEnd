<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Download Salary Slip In Bulk" [showSearch]="false" [showOrderBy]="false"
[showItemsPerPage]="false" [showDisplayMode]="false"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #cid="ngModel"
                (change)="selectcompany($event)" name="cid" required>
                @for (data of company; track data) {
                  <ng-option [value]="data.companyMasterID">
                    {{ data.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!cid.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #branchName="ngModel" name="branch">
                @for (item of allbranch; track item) {
                  <ng-option [value]="item.branchMasterID">
                    {{ item.branchName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="month" required ngModel #YearMM="ngModel" name="YearMM"
                required />
                <span>YearMonth *</span>
                @if (!YearMM.valid && datefilter.submitted) {
                  <div class="invalid-tooltip">
                    Year Month is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-6">
              <button class="btn btn-info form-group" type="submit">
                Download
              </button>
              &nbsp;&nbsp;
              <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
            </div>
          </div>
        </form>
      }
    </div>
  </div>
