<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="E-Mail Salary Slip" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
[showItemsPerPage]="false"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="month" ngModel #month="ngModel" name="month" required />
        <span>Month *</span>
        @if (!month.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            Month is required!
          </div>
        }
      </label>
    </div>
  </app-common-filter>
}

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
