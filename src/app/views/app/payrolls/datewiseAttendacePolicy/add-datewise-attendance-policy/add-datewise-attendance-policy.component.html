<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Outside Attendance Permission</h5>

    <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel required #company="ngModel" name="company"
              (change)="selectcompany($event);" [(ngModel)]="selectedCompanyData">
              @for (comp of comp; track comp) {
                <ng-option [value]="comp.companyMasterID">
                  {{ comp.companyName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Company *</span>
            @if (!company.valid && addcomp.submitted) {
              <div class="invalid-tooltip">
                Company is required!
              </div>
            }
          </label>
        </div>


        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #branch="ngModel" name="branch"
              [(ngModel)]="selectedBranch" (change)="getusers($event);">
              @for (item of allbranch; track item) {
                <ng-option [value]="item.branchMasterID">
                  {{ item.branchName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Branch</span>
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel required #user="ngModel" name="user"
              [(ngModel)]="selectedUser">
              @for (users of users; track users) {
                <ng-option [value]="users.userMasterID">
                  {{ users.displayName }}
                </ng-option>
              }
            </ng-select>
            <span>Select User *</span>
            @if (!user.valid && addcomp.submitted) {
              <div class="invalid-tooltip">
                User is required!
              </div>
            }
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <input class="form-control" type="date" required ngModel required #fromDate="ngModel" name="fromDate"
              [(ngModel)]="selectedfromDate" (change)="fromDateChange()" />
              <span>From Date *</span>
              @if (!fromDate.valid && addcomp.submitted) {
                <div class="invalid-tooltip">
                  From Date is required!
                </div>
              }
            </label>
          </div>

          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" required ngModel #ToDate="ngModel" name="ToDate"
                [(ngModel)]="selectedToDate" [min]="selectedfromDate" />
                <span>To Date *</span>
                @if (!ToDate.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    To Date is required!
                  </div>
                }
              </label>
            </div>
          </div>
          <div class="col-md-12">
            <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
            <button class="btn btn-danger btn-shadow mt-4" [routerLink]="adminRoot + '/payrolls/datewiseAttendancePolicy'"
              style="margin-left: 2%">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
