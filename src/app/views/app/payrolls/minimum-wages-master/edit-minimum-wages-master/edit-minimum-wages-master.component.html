<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit Minimum Wages Master</h5>

    @if (permissionedit.length && minWagesData) {
      <form #editminWagesMaster="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" ngModel #companyMasterID="ngModel" name="companyMasterID"
                [(ngModel)]="minWagesData.companyMaster.companyName" disabled />
                <span>Select Company *</span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" ngModel #stateName="ngModel" name="stateName"
                  [(ngModel)]="minWagesData.stateMaster.stateName" disabled />
                  <span>Select State *</span>
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="month" required ngModel #yearmonth="ngModel" name="yearmonth"
                    [(ngModel)]="selectedYearMonth" disabled />
                    <span>Applicable YYYYMM *</span>
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="number" ngModel #skilled="ngModel" name="skilled"  [(ngModel)]="minWagesData.skilled" />
                    <span>Skilled Amount</span>
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="number" ngModel #semiskilled="ngModel" name="semiskilled" [(ngModel)]="minWagesData.semiSkilled"/>
                    <span>Semi-Skilled Amount</span>
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="number" ngModel #unskilled="ngModel" name="unskilled" [(ngModel)]="minWagesData.unSkilled"/>
                    <span>Un-Skilled Amount</span>
                  </label>
                </div>
                <div class="col-md-4">
                  <button class="btn btn-primary form-group" type="submit">
                    {{ 'forms.submit' | translate }}
                  </button>
                  &nbsp;&nbsp;
                  <button class="btn btn-danger form-group" type="button"
                    [routerLink]="adminRoot + '/payrolls/minimumWagesMaster'">
                    Cancel
                  </button>
                </div>
              </div>
            </form>
          }
        </div>
      </div>
      <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
