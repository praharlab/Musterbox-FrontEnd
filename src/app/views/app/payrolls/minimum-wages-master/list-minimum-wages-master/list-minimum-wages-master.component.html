<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showadd]="permissioncreate" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
  [itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()" [showadd]="true"
name="Minimum Wages Master"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="Export()"
    (getCompany)="initGetCompany($event)" (import)="lgModal2.show()">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select placeholder="Choose your option" ngModel #stateName="ngModel" name="stateName" [(ngModel)]="selectedState">
          @for (state of states; track state) {
            <ng-option [value]="state.stateMasterID">
              {{ state.stateName }}
            </ng-option>
          }
        </ng-select>
        <span>Select State</span>
      </label>
    </div>
  </app-common-filter>
}

@if (rows.length && permissionview.length > 0) {
  <div class="row">
    <div class="col-12 mb-6 data-table-rows">
      <ngx-datatable [rows]="rows" [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100"
        [columnMode]="ColumnMode" [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount"
        [offset]="page.offset" (page)="onChange($event)">
        <ngx-datatable-column name="Company Name" prop="companyMaster.companyName" [flexGrow]="1.2"
        [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="State Name" prop="stateMaster.stateName" [flexGrow]="1.2"
        [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Applicable YYYYMM" prop="applicableYYYYMM" [flexGrow]="1.2" [width]="180">
        </ngx-datatable-column>
        <ngx-datatable-column name="Skilled" prop="skilled" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Semi-Skilled" prop="semiSkilled" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Un-Skilled" prop="unSkilled" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="200">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <ng-container >
              @if (permissionedit.length !=0) {
                <a
                  (click)="navigateToEditPage(row)">
                  <span tooltip="Edit Minimum Wages Master details" [class]="'glyph-icon simple-icon-pencil tool_tip'"
                  style="padding-right: 10px; font-size: 18px"></span>
                  {{ ' ' }}
                </a>
              }
            </ng-container>
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
