<div class="position-relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Employee Bonus Payment" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="$safeNavigationMigration(filterData?.limit)"
[itemOptionsPerPage]="itemOptionsPerPage" [showItemsPerPage]="true"></app-list-page-header>

<!-- (onClear)="clear()" (clearData)="clear()" *ngIf="permissionview.length > 0" (init)="init($event)"> -->
@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (clearData)="clear()" (export)="download()" (getCompany)="getCompany($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="month" [(ngModel)]="currentMonth" ngModel #monthYear="ngModel"
          name="monthYear" max="{{ maxMonth }}" />
          <span>Select MonthYear *</span>
          @if (!monthYear.valid && bonusForm.submitted) {
            <div class="invalid-tooltip">
              Month Year is required!
            </div>
          }
        </label>
      </div>
    </app-common-filter>
  }

  <!-- <button class="btn btn-primary" (click)="navigateToViewPage()">
  View
</button> -->

@if (rows && permissionview.length > 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="columnMode"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Employee Code" prop="Employee Code" [flexGrow]="1.2" [width]="180">
        </ngx-datatable-column>
        <ngx-datatable-column name="Employee Name" prop="Employee Name" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Employee Number" prop="Employee Number" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
        <ngx-datatable-column name="Pending Bonus" prop="Pending Bonus" [flexGrow]="1.2" [width]="180">
        </ngx-datatable-column>
        <ngx-datatable-column name="Payment" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (row['Pending Bonus'] > 0) {
              <button class="btn btn-primary" (click)="lgModal.show(); pay(row)">
                Pay
              </button>
            }
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="View" [sortable]="true" [width]="150" >
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (permissionedit.length) {
              <button type="button" class="btn btn-primary" (click)="navigateToViewPage(row)">
                View Details
              </button>
            }
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="onPageChange($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1"   [config]="{backdrop: 'static', keyboard: false}"
  >
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Payment</h4>
        <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close"
          #closeModal>
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <form #bonusForm="ngForm" novalidate (ngSubmit)="submitPayment()">
          <div class="mt-2 row">
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" [(ngModel)]="amountToPay" ngModel #bonusAmount="ngModel"
                  name="bonusAmount" disabled />
                  <span>Amount</span>
                </label>
              </div>
              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <input class="form-control" type="month" [(ngModel)]="currentMonth" ngModel #payYYYYMM="ngModel"
                    name="payYYYYMM" max="{{ maxMonth }}" />
                    <span>Select YearMonth *</span>
                    @if (!payYYYYMM.valid && bonusForm.submitted) {
                      <div class="invalid-tooltip">
                        Month Year is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <ng-select placeholder="Choose your option" ngModel required #payment="ngModel" name="payment"
                      [(ngModel)]="paymentMode">
                      <ng-option [value]="paymentModes.CASH">
                        {{ paymentModes.CASH }}
                      </ng-option>
                      <ng-option [value]="paymentModes.CHEQUE">
                        {{ paymentModes.CHEQUE }}
                      </ng-option>
                      <ng-option [value]="paymentModes.UPI">
                        {{ paymentModes.UPI }}
                      </ng-option>

                    </ng-select>
                    <span>Select Payment Mode *</span>
                    @if (!payment.valid && bonusForm.submitted) {
                      <div class="invalid-tooltip">
                        Payment Mode is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-6">
                  @if (paymentMode == paymentModes.CHEQUE || paymentMode == paymentModes.UPI) {
                    <label class="form-group has-float-label"
                      >
                      <input class="form-control" type="text" ngModel #referenceNO="ngModel" name="referenceNO" />
                      <span>Reference No.</span>
                    </label>
                  }
                </div>
                <div class="d-flex gap-10 ml-3">
                  <button class="btn btn-primary" type="submit">Submit</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
