<div class="position-relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
  (getCompany)="getCompany($event)" heading="Manage Leave Balance" cancelRoute="/payrolls/manage-leave-balance"
  [multiUser]="false">
  <!-- <h1>Manage Leave Balance</h1> -->
  <div class="col-md-4">
    <label class="form-group has-float-label">
      <ng-select placeholder="Choose your option" ngModel #operationType="ngModel" name="operationType"
        [(ngModel)]="selectedOperationType" required (ngModelChange)="updateMonthLimits()">
        <ng-option value="AddLeaveBalance">Add</ng-option>
        <ng-option value="Lapse">Lapse</ng-option>
        <ng-option value="Encashment">Encash</ng-option>
      </ng-select>

      <span>Select Operation Type *</span>
      @if (!operationType.valid && commonFilter?.filterForm?.submitted) {
        <div class="invalid-tooltip">
          Operation Type is required!
        </div>
      }
    </label>
  </div>

  <div class="col-md-4">
    <label class="form-group has-float-label">
      <ng-select ngModel #LeaveTranId="ngModel" placeholder="Choose your option" [(ngModel)]="selectedLeave" required
        name="LeaveTranId">
        @for (leave of allLeaves; track leave) {
          <ng-option [value]="leave.LeaveTranId">
            {{ leave?.LeaveMaster?.LeaveName }}
          </ng-option>
        }
      </ng-select>
      <span>Leave Type *</span>
      @if (!LeaveTranId.valid && commonFilter?.filterForm?.submitted) {
        <div class="invalid-tooltip">
          Leave Type is required!
        </div>
      }
    </label>
  </div>

  <div class="col-md-4">
    <label class="form-group has-float-label">
      <input class="form-control" type="month" required ngModel #month="ngModel" name="month" [(ngModel)]="selectedMonth"
        [min]="minMonth" [max]="maxMonth" required [disabled]="!selectedOperationType" />
        <span>Month *</span>
        @if (!month.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            Month is required!
          </div>
        }
      </label>
    </div>

    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="number" required ngModel #balance="ngModel" name="balance"
          [(ngModel)]="balanceVal" required
          [placeholder]="selectedOperationType == 'Lapse' ? 'Add Lapse Balance' : selectedOperationType == 'Encashment' ? 'Add Encash Balance' : 'Add Leave Balance'"
          onwheel="return false;" (keydown)="preventArrowKeys($event)" />
          <span>Balance *</span>
          @if (!balance.valid && commonFilter?.filterForm?.submitted) {
            <div class="invalid-tooltip">
              Balance is required!
            </div>
          }
          @if (invalidBalance) {
            <div class="invalid-tooltip">
              Invalid Balance
            </div>
          }
        </label>
      </div>
    </app-common-filter>

    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
