<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header [showOrderBy]="false" [showDisplayMode]="false" (itemsPerPageChange)="onLimitChange($event)"
  [showSearch]="false" [itemsPerPage]="filterData.limit" [itemOptionsPerPage]="itemOptionsPerPage"
name="Tour Report"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()" (init)="init($event)" [showRequiredFields]="showRequiredFields" (emitUsers)="emitUsers($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="date" ngModel #startdate="ngModel" name="startdate" />
        <span>From Date</span>
      </label>
    </div>
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="date" ngModel #enddate="ngModel" name="enddate" />
        <span>To Date</span>
      </label>
    </div>
  </app-common-filter>
}

@if (rows.length > 0) {
  <div class="row">
    <div class="col-12 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Tour Assign" prop="Employee" [flexGrow]="1.2" [width]="200"></ngx-datatable-column>
        <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Tour Name" prop="TourName" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Tour From Date" prop="TourFromDate" [flexGrow]="1.2" [width]="130">
          <!-- <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.TourFromDate | date: 'dd-MM-yyyy' }}
        </ng-template> -->
      </ngx-datatable-column>
      <ngx-datatable-column name="Tour End Date" prop="TourEndDate" [flexGrow]="1.2" [width]="130">
        <!-- <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.TourEndDate | date: 'dd-MM-yyyy' }}
      </ng-template> -->
    </ngx-datatable-column>
    <ngx-datatable-column name="Tour Days" prop="TotalDays" [flexGrow]="1.2" [width]="100"></ngx-datatable-column>
    <ngx-datatable-column name="Tour Co-Person" prop="Coperson" [flexGrow]="1.2" [width]="200"></ngx-datatable-column>
    <ngx-datatable-column name="Action" [sortable]="true" [width]="180">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="edit" style="z-index: 999999999">
          <a (click)="navigateToEditPage(row)">
            <span tooltip="edit visit details" [class]="'glyph-icon simple-icon-pencil tool_tip'"
            style="padding-right: 10px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
          <a (click)="alertConfirmation(row.TourID)">
            <span tooltip="delete visit details" [class]="'glyph-icon simple-icon-trash tool_tip'"
            style="padding-right: 6px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
        </div>
      </ng-template>
    </ngx-datatable-column>
    @if (true) {
      <ngx-datatable-footer>
        <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
          let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
          <div class="w-100 d-flex justify-content-center">
            <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
              [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
              [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
            [customPreviousTemplate]="prevTemplate"></pagination>
          </div>
        </ng-template>
      </ngx-datatable-footer>
    }
  </ngx-datatable>
</div>
</div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
