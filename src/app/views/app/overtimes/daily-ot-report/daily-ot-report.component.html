<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Daily Overtime Report" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showSearch]="false"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>
<div class="card">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #cid="ngModel"
                (change)="selectcompany($event)" name="cid" [(ngModel)]="companyid" required>
                @for (data of company; track data) {
                  <ng-option [value]="data.companyMasterID">
                    {{ data.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!cid.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #branch="ngModel" name="branch"
                [(ngModel)]="selectedBranch" (change)="selectbranch($event)">
                @for (item of allbranch; track item) {
                  <ng-option [value]="item.branchMasterID">
                    {{ item.branchName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="true" bindLabel="displayName"
                groupBy="selectedAllGroup" [selectableGroup]="true" [selectableGroupAsModel]="false"
                bindValue="userMasterID" [closeOnSelect]="false" ngModel [(ngModel)]="selectedEmployees"
                #employee="ngModel" name="employee">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                    [ngModelOptions]="{ standalone: true }" />
                    Select All
                  </ng-template>
                </ng-select>
                <span>Select Employee</span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel #startdate="ngModel" (change)="selectdate()"
                  name="startdate" required />
                  <span>From Date *</span>
                  @if (!startdate.valid && datefilter.submitted) {
                    <div class="invalid-tooltip">
                      From Date is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="date" ngModel #enddate="ngModel" (change)="selectdate()"
                    name="enddate" required />
                    <span>To Date *</span>
                    @if (!enddate.valid && datefilter.submitted) {
                      <div class="invalid-tooltip">
                        To Date is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <ng-select placeholder="Choose your option" ngModel [multiple]="true" [closeOnSelect]="false"
                      #authStatus="ngModel" name="authStatus">
                      <ng-option value="Accepted">
                        Accepted
                      </ng-option>
                      <ng-option value="Rejected">
                        Rejected
                      </ng-option>
                      <ng-option value="Pending">
                        Pending
                      </ng-option>
                    </ng-select>
                    <span>Status </span>
                  </label>
                </div>
                <br />
                <div class="col-md-4">
                  <button class="btn btn-primary form-group" type="submit">
                    {{ 'forms.submit' | translate }}
                  </button>
                  &nbsp;&nbsp;
                  <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
                  <span> &nbsp;&nbsp; </span>
                  @if (rows.length > 0) {
                    <button class="btn btn-success form-group" type="button"
                    (click)="Export()">Export</button>
                  }
                </div>
              </div>
            </form>
          }
        </div>
      </div>

      @if (rows && permissionview.length != 0) {
        <div class="row">
          @if (rows && rows.length != 0) {
            <div class="col-12 mb-4 data-table-rows">
              <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
                [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
                (page)="onChange($event)">
                <ngx-datatable-column name="Employee Code" prop="Employee Code" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Employee Name" prop="Employee Name" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Mobile No." prop="Mobile No." [flexGrow]="1.2"
                [width]="120"></ngx-datatable-column>
                <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Overtime Date" prop="Overtime Date" [flexGrow]="1.2"
                [width]="120"></ngx-datatable-column>
                <ngx-datatable-column name="PunchIn Time" prop="PunchIn Time" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="PunchOut Time" prop="PunchOut Time" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Overtime Start DateTime" prop="Overtime Start DateTime" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Overtime End DateTime" prop="Overtime End DateTime" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Overtime Minutes" prop="Overtime Minutes" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                <ngx-datatable-column name="Status" prop="Status" [flexGrow]="1.2" [width]="100"></ngx-datatable-column>
                <ngx-datatable-column name="Authorization" prop="Authorization" [flexGrow]="1.2"
                [width]="200"></ngx-datatable-column>
                <ngx-datatable-column name="Authorization Criteria" prop="Authorization Criteria" [flexGrow]="1.2"
                [width]="180"></ngx-datatable-column>
                @if (true) {
                  <ngx-datatable-footer>
                    <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                      let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                      <div class="w-100 d-flex justify-content-center">
                        <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                          [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                          (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                        [customPreviousTemplate]="prevTemplate"></pagination>
                      </div>
                    </ng-template>
                  </ngx-datatable-footer>
                }
              </ngx-datatable>
            </div>
          }
        </div>
      }


      <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-left"></i>
      </ng-template>
      <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left"></i>
      </ng-template>
