<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Consolidate Overtime Report" [showOrderBy]="false" [showDisplayMode]="false"
[showSearch]="false" [showItemsPerPage]="false"></app-list-page-header>
<div class="card">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="Export()">
        <div class="row">
          <!--fromdate-->
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" ngModel #startdate="ngModel" (change)="selectdate()"
                name="startdate" required />
                <span>From Date *</span>
                @if (!startdate.valid && datefilter.submitted) {
                  <div class="invalid-tooltip">
                    From Date is required!
                  </div>
                }
              </label>
            </div>
            <!--todate-->
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel #enddate="ngModel" (change)="selectdate()" name="enddate"
                  required />
                  <span>To Date *</span>
                  @if (!enddate.valid && datefilter.submitted) {
                    <div class="invalid-tooltip">
                      To Date is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select placeholder="Choose your option" ngModel #cid="ngModel" (change)="selectcompany($event)"
                    name="cid" required>
                    @for (data of company; track data) {
                      <ng-option [value]="data.companyMasterID">
                        {{ data.companyName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>Select Company *</span>
                  @if (!cid.valid && datefilter.submitted) {
                    <div class="invalid-tooltip">
                      Company is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select placeholder="Choose your option" ngModel #branch="ngModel" name="branch"
                    [(ngModel)]="selectedBranch" (change)="selectbranch($event)">
                    @for (item of allbranch; track item) {
                      <ng-option [value]="item.branchMasterID">
                        {{ item.branchName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>Select Branch</span>
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select [items]="alluser" [multiple]="true" bindLabel="displayName" groupBy="selectedAllGroup"
                    [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="userMasterID" [closeOnSelect]="false"
                    ngModel [(ngModel)]="selectedEmployees" #employee="ngModel" name="employee">
                    <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                      <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                        [ngModelOptions]="{ standalone: true }" />
                        Select All
                      </ng-template>
                    </ng-select>
                    <span>Select Employee</span>
                  </label>
                </div>
                <br />
                <div class="col-md-3">
                  <!-- <button class="btn btn-primary form-group" type="submit">
                  {{ 'forms.submit' | translate }}
                </button>
                &nbsp;&nbsp; -->
                <button class="btn btn-success form-group" type="submit">Export</button>
              </div>
              <div class="col-md-3" style="text-align: right"></div>
            </div>
          </form>
        }
      </div>
    </div>
    <br />
