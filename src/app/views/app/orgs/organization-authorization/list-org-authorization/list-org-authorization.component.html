<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Set Organization Authorization" [showOrderBy]="false" [showSearch]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showadd]="permissioncreate" (addNewItem)="showAddNewModal()"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>
@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)" (getCompany)="getCompany($event)"
    (onClear)="clear()" (export)="export()" (clearData)="clear()" (getBranch)="getBranch($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select placeholder="Choose your option" ngModel #site="ngModel" name="site" [(ngModel)]="selectedSite">
          @for (site of allSites; track site) {
            <ng-option [value]="site.siteID">
              {{ site.siteName }}
            </ng-option>
          }
        </ng-select>
        <span>Sites</span>
      </label>
    </div>
  </app-common-filter>
}
@if (rows) {
  <div class="row">
    <div class="col-12 data-table-rows" style="width: 100%">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Company Name" prop="branchMaster.companyMaster.companyName" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Branch Name" prop="branchMaster.branchName" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Site Name" prop="site.siteName" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Auth Criteria" prop="AuthorizationCriteriaMaster.AuthorizationCriteria" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Org Auth Type" prop="orgAuthorizationType.orgAuthorizationType" [flexGrow]="1.2"
        [width]="120"></ngx-datatable-column>
        @if (permissionedit.length != 0 || permissiondelete.length != 0) {
          <ngx-datatable-column name="Action" [sortable]="true" [width]="230"
            >
            <ng-template let-row="row" ngx-datatable-cell-template>
              <a (click)="navigateToEditPage(row)">
                @if (permissionedit.length != 0) {
                  <span tooltip="Edit Organization Authorization" [class]="'glyph-icon simple-icon-pencil tool_tip'"
                  style="padding-right: 10px; font-size: 18px"></span>
                }
                {{ ' ' }}
              </a>
              <a (click)="alertConfirmation(row)">
                @if (permissiondelete.length != 0) {
                  <span tooltip="Delete Organization Authorization" [class]="'glyph-icon simple-icon-trash tool_tip'"
                  style="padding-right: 6px; font-size: 18px"></span>
                }
                {{ ' ' }}
              </a>
            </ng-template>
          </ngx-datatable-column>
        }
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate" [(ngModel)]="currentPage"
                  [customPreviousTemplate]="prevTemplate" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                [customLastTemplate]="lastTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
