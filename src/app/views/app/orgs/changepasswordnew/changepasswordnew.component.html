<style>
  .password-toggle-icon {
  position: absolute;
  top: 47%;
  right: 10px;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999;
  /* Adjust the color as needed */
}
</style>

<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>

<app-list-page-header name="Change Password" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false" [showItemsPerPage]="false"></app-list-page-header>

<app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
  userBindValue="userNumber" (onClear)="clear()" cancelRoute="/orgs">
  <div class="col-md-4"></div>
  <div class="col-md-4">
    <label class="form-group has-float-label">
      <input
        class="form-control"
        type="{{ showPassword ? 'text' : 'password' }}"
        placeholder=""
        required
        ngModel
        #newPassword="ngModel"
        name="newPassword"
        />
        <span>New Password *</span>
        @if (!newPassword.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            New Password is required!
          </div>
        }
        <div class="password-toggle-icon" (click)="togglePasswordVisibility()">
          @if (showPassword == true) {
            <!-- <span class="glyph-icon simple-icon-close"></span> -->
            <img
              src="../../../../../assets/eyeclosed.png"
              alt=""
            style="
              position: absolute;
              top: 47%;
              right: 10px;
              transform: translateY(-50%);
              cursor: pointer;
              width: 22px;
              color: #999;
            "
              />
            }
            @if (showPassword == false) {
              <img
                src="../../../../../assets/eyeopen.png"
                alt=""
            style="
              position: absolute;
              top: 47%;
              right: 10px;
              transform: translateY(-50%);
              cursor: pointer;
              width: 22px;
              color: #999;
            "
                />
              }
            </div>
          </label>
        </div>
      </app-common-filter>

      <simple-notifications
        [options]="{ position: ['top', 'center'], maxStack: 1 }"
      ></simple-notifications>
