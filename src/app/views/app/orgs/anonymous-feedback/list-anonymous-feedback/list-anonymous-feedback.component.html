<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Anonymous Feedback" [showOrderBy]="false" [showDisplayMode]="false"
  [searchValue]="filterData.searchQuery" (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>


<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #companyMasterID="ngModel" name="companyMasterID"   [(ngModel)]="filterform.companyMasterID" required>
                @for (companydata of companydata; track companydata) {
                  <ng-option [value]="companydata.companyMasterID">
                    {{ companydata.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" ngModel #startdate="ngModel" name="startdate" [max]="date12"
                />
                <span>From Date </span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel #enddate="ngModel" name="enddate" [max]="date12"  />
                <span>To Date </span>
              </label>
            </div>
            <div class="col-md-12">
              <button class="btn btn-primary form-group" type="submit">
                Submit
              </button>
              &nbsp;&nbsp;
              <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
              <span> &nbsp;&nbsp; </span>
              @if (rows && rows.length != 0) {
                <button class="btn btn-success form-group" type="button" (click)="download()"
                  >
                  Export
                </button>
              }
            </div>
          </div>
        </form>
      }
    </div>
  </div>


  @if (rows) {
    <div class="row">
      <div class="col-12 mb-4 data-table-rows">
        <ngx-datatable [scrollbarH]="scrollBarHorizontal" [rowHeight]="50" [rows]="rows" [footerHeight]="100"
          [columnMode]="'force'" [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount"
          [offset]="page.offset" (page)="onChange($event)">
          <ngx-datatable-column name="Feedback" prop="feedback" [flexGrow]="1.2" [width]="60"></ngx-datatable-column>
          <!-- <ngx-datatable-column name="Date" prop="createdAt" [flexGrow]="1.2" [width]="60"></ngx-datatable-column> -->
          <ngx-datatable-column name="Date" prop="createdAt" [flexGrow]="1.2" [width]="150">
            <ng-template ngx-datatable-cell-template let-value="value">
              {{ value | date:'dd-MM-yyyy HH:mm' }}
            </ng-template>
          </ngx-datatable-column>
          @if (true) {
            <ngx-datatable-footer>
              <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                <div class="w-100 d-flex justify-content-center">
                  <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                    [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                    [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"></pagination>
                </div>
              </ng-template>
            </ngx-datatable-footer>
          }
        </ngx-datatable>
      </div>
    </div>
  }

  <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-left"></i>
  </ng-template>
  <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
    <i class="simple-icon-arrow-right"></i>
  </ng-template>

  <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-right"></i>
  </ng-template>
  <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
    <i class="simple-icon-arrow-left"></i>
  </ng-template>

  <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
