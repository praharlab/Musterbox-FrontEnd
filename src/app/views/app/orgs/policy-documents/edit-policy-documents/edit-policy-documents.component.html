<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (editData) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Edit Department</h5>
      <form #editPolicyDocument="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #companyMasterID="ngModel"
                name="companyMasterID"
                [(ngModel)]="editData.companyMasterId"
                [disabled]="true"
                >
                @for (company of company; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #policyDocumentName="ngModel"
                [(ngModel)]="editData.name"
                name="policyDocumentName"
                />
                <span>Policy Documenet Name *</span>
                @if (!policyDocumentName.valid && editPolicyDocument.submitted) {
                  <div
                    class="invalid-tooltip"
                    >
                    Policy Documenet Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-12">
              <label class="form-group has-float-label">
                <textarea
                  class="form-control"
                  ngModel
                  #description="ngModel"
                  name="description"
                  [(ngModel)]="editData.description"
                  required
                ></textarea>
                <span>Description *</span>
                @if (!description.valid && editPolicyDocument.submitted) {
                  <div class="invalid-tooltip">
                    Description is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="file"
                  ngModel
                  #file="ngModel"
                  (change)="onSelectFile($event)"
                  accept=".pdf,.doc,.docx"
                  name="file"
                  />
                  <span>Policy Document *</span>
                </label>
              </div>
              @if (editData.document) {
                <div class="col-md-4">
                  <!-- <img src="{{apiURL}}{{editData.document}}" (click)="lgModal.show()" style="margin-left: 10%;" height="100px"
                  width="100px"> -->
                  <button
                    class="btn btn-primary form-group m-0"
                    type="button"
                    (click)="ViewDocument(editData)"
                    >
                    View Document
                  </button>
                </div>
              }
            </div>
            <app-state-button
              [btnClass]="'btn btn-primary btn-lg btn-shadow mt-4'"
              [currentState]="buttonState"
              [isDisabled]="buttonDisabled"
              click="onLoginClick()"
              >
              {{ 'forms.submit' | translate }}
            </app-state-button>
            <button
              class="btn btn-danger btn-lg btn-shadow mt-4"
              [routerLink]="adminRoot + '/orgs/listPolicyDocuments'"
              style="margin-left: 2%"
              >
              Cancel
            </button>
          </form>
        </div>
      </div>
    }

    <simple-notifications
      [options]="{ position: ['top', 'center'], maxStack: 1 }"
    ></simple-notifications>
