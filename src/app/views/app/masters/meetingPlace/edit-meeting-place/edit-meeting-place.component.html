<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (meetingPlaceData) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Edit Meeting Location</h5>
      <form #editmeetingplace="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #meetingPlaceName="ngModel"
                name="meetingPlaceName"
                [(ngModel)]="meetingPlaceData.meetingPlaceName"
                />
                <span>Meeting Location Name *</span>
                @if (!meetingPlaceName.valid && editmeetingplace.submitted) {
                  <div
                    class="invalid-tooltip"
                    >
                    Meeting Location Name is required!
                  </div>
                }
              </label>
            </div>
            @if (childcompany == 'false') {
              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <ng-select
                    placeholder="Choose your option"
                    ngModel
                    #companyMasterID="ngModel"
                    name="companyMasterID"
                    [(ngModel)]="meetingPlaceData.companyMasterID"
                    required
                    >
                    @for (company of company; track company) {
                      <ng-option [value]="company.companyMasterID">
                        {{ company.companyName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>Select Company *</span>
                  @if (!companyMasterID.valid && editmeetingplace.submitted) {
                    <div
                      class="invalid-tooltip"
                      >
                      Company is required!
                    </div>
                  }
                </label>
              </div>
            }
          </div>
          <app-state-button
            [btnClass]="'btn btn-primary btn-lg btn-shadow mt-4'"
            [currentState]="buttonState"
            [isDisabled]="buttonDisabled"
            click="onLoginClick()"
            >
            {{ 'forms.submit' | translate }}
          </app-state-button>
          <button
            class="btn btn-danger btn-lg btn-shadow mt-4"
            [routerLink]="adminRoot + '/masters/meetingPlace'"
            style="margin-left: 2%"
            >
            Cancel
          </button>
        </form>
      </div>
    </div>
  }

  <simple-notifications
    [options]="{ position: ['top', 'center'], maxStack: 1 }"
  ></simple-notifications>
