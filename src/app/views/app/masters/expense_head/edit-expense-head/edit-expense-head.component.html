<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (companydata) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Edit Expense Head</h5>
      <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #companyMasterID="ngModel" name="companyMasterID"
                [(ngModel)]="companydata.companyMasterID" (change)="company($event)" required>
                @for (product of product; track product) {
                  <ng-option [value]="product.companyMasterID">
                    {{ product.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && addcomp.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #expenseCategoryId="ngModel" name="expenseCategoryId"
                [(ngModel)]="companydata.expenseCategoryId" required>
                @for (category of category; track category) {
                  <ng-option [value]="category.expenseCategoryId">
                    {{ category.expenseCategory }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Expense Category *</span>
              @if (!expenseCategoryId.valid && addcomp.submitted) {
                <div class="invalid-tooltip">
                  Expense Category is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-1 p-0 d-flex align-items-center">
            @if (showdepart == true && permissioncreate.length > 0) {
              <button type="button" style="font-size: large"
                class="btn btn-primary" (click)="lgModal.show()">
                +
              </button>
            }
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" required ngModel #expenseHead="ngModel" name="expenseHead"
                [(ngModel)]="companydata.expenseHead" />
                <span>Expense Head *</span>
                @if (!expenseHead.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    Expense Head is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" ngModel #accountHeadID="ngModel" name="accountHeadID"
                  [(ngModel)]="companydata.accountHeadID" />
                  <span>Account Head ID</span>
                </label>
              </div>
            </div>
            <div class="col-md-12">
              <button class="btn btn-primary mt-4" type="submit">
                {{ 'forms.submit' | translate }}
              </button>
              <button class="btn btn-danger btn-shadow mt-4" [routerLink]="adminRoot + '/masters/expense_head'"
                style="margin-left: 2%">
                Cancel
              </button>
            </div>
          </form>
          @if (rows1.length) {
            <div>
              <!-- Table to display API response data -->
              <h5 class="mt-4">Expense Heads</h5>
              <table class="table table-bordered mt-3">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Expense Head</th>
                  </tr>
                </thead>
                <tbody>
                  @for (item of rows1; track item; let i = $index) {
                    <tr>
                      <td>{{ i + 1 }}</td>
                      <td>{{ item }}</td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          }
        </div>
      </div>
    }

    <div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1"
      [config]="{backdrop: 'static', keyboard: false}">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title pull-left">Add Expense Category</h4>
            <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()" aria-label="Close"
              #closeModal>
              <span aria-hidden="true" class="visually-hidden">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <form #addcategory="ngForm" novalidate (ngSubmit)="onSubmit1()">
              <div class="row">
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="text" required ngModel #expenseCategory="ngModel"
                      name="expenseCategory" />
                      <span>Expense Category*</span>
                      @if (!expenseCategory.valid && addcategory.submitted) {
                        <div class="invalid-tooltip">
                          ExpenseCategory is required!
                        </div>
                      }
                    </label>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
