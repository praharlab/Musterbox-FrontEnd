<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit Penalty</h5>

    @if (companydata) {
      <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #penaltyName="ngModel"
                name="penaltyName"
                [(ngModel)]="companydata.penaltyName"
                />
                <span>Penalty Name *</span>
                @if (!penaltyName.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    Penalty Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="number"
                  required
                  ngModel
                  #penaltyAmount="ngModel"
                  name="penaltyAmount"
                  [(ngModel)]="companydata.penaltyAmount"
                  />
                  <span>Penalty Amount *</span>
                  @if (!penaltyAmount.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      Penalty Amount is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-6">
                <label>Deduction From Salary</label>
                <br />
                <input
                  type="radio"
                  name="deductionFromSalary"
                  ngModel
                  #deductionFromSalary="ngModel"
                  value="1"
                  [(ngModel)]="values"
                  />
                  &nbsp;
                  <label for="html">YES</label>
                  &nbsp;&nbsp;
                  <input
                    type="radio"
                    name="deductionFromSalary"
                    ngModel
                    #deductionFromSalary="ngModel"
                    value="0"
                    [(ngModel)]="values"
                    />
                    &nbsp;
                    <label for="css">NO</label>
                    <br />
                    <br />
                  </div>
                  <div class="col-md-6">
                    <label class="form-group has-float-label">
                      <ng-select
                        placeholder="Choose your option"
                        ngModel
                        #companyMasterID="ngModel"
                        name="companyMasterID"
                        [(ngModel)]="companydata.companyMasterID"
                        >
                        @for (product of product; track product) {
                          <ng-option [value]="product.companyMasterID">
                            {{ product.companyName }}
                          </ng-option>
                        }
                      </ng-select>
                      <span>Select Company</span>
                    </label>
                  </div>
                </div>
                <div class="col-md-12">
                  <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                  <button
                    class="btn btn-danger btn-shadow mt-4"
                    [routerLink]="adminRoot + '/masters/penalty'"
                    style="margin-left: 2%"
                    >
                    Cancel
                  </button>
                </div>
              </form>
            }
          </div>
        </div>

        <simple-notifications
          [options]="{ position: ['top', 'center'], maxStack: 1 }"
        ></simple-notifications>
