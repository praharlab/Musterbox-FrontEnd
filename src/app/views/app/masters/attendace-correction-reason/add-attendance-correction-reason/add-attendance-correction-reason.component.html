<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Reason</h5>
    <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        @if (company.length > 0) {
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #companyMasterID="ngModel"
                name="companyMasterID" [(ngModel)]="company_id" required>
                @for (company of company; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
        }
        <!-- <div class="col-md-6">
        <label class="form-group has-float-label">
          <input type="text" ngModel #reason="ngModel" class="form-control" name="reason" required>
          <span>Reason *</span>
        </label>
      </div> -->
      <div class="col-md-6">
        <label class="form-group has-float-label">
          <textarea type="text" class="form-control" name="reason" #reason="ngModel" ngModel
          required></textarea>
          <span>Reason *</span>
          @if (reason.invalid && (reason.dirty || reason.touched)) {
            <div class="invalid-tooltip">
              Reason is required!
            </div>
          }
        </label>
      </div>
      <div class="col-md-6">
        <button class="btn btn-primary form-group" type="submit">
          {{ 'Submit' | translate }}
        </button>
        &nbsp;&nbsp;
        <button class="btn btn-primary form-group" type="button" (click)="cancel()">Cancel</button>
      </div>
    </div>
  </form>
</div>
</div>
