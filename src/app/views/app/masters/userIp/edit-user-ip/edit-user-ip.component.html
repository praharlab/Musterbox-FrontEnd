<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit IP Whitelisting</h5>

    @if (edit_Data) {
      <form #addtask="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <!-- Display the employee's name -->
              <input
                class="form-control"
                type="text"
                [attr.disabled]="true"
                required
                [(ngModel)]="edit_Data['userMaster.displayName']"
                name="userDisplayName"
                />
                <span>Select Employee *</span>
              </label>
            </div>
            <!-- Hidden field for userMasterID -->
            <input type="hidden" [(ngModel)]="edit_Data.userMasterID" name="userMasterID" />
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" ngModel [(ngModel)]="edit_Data.ip" #taskname="ngModel" required
                  name="taskname" />
                  <span>Ip *</span>
                </label>
                @if (!taskname.valid && addtask.submitted) {
                  <div class="invalid-tooltip">
                    Ip is required!
                  </div>
                }
              </div>
            </div>
            <div class="col-md-12">
              <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
              <button class="btn btn-danger btn-shadow mt-4" [routerLink]="adminRoot + '/masters/userIp'"
                style="margin-left: 2%">
                Cancel
              </button>
            </div>
          </form>
        }
      </div>
    </div>

    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
