<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit User</h5>

    @if (showRole) {
      <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" required ngModel #firstNAme="ngModel"
                [(ngModel)]="companydata.firstName" name="firstNAme" />
                <span>First Name *</span>
                @if (!firstNAme.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    First Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" ngModel #middleNAme="ngModel" [(ngModel)]="companydata.middleName"
                  name="middleNAme" />
                  <span>Middle Name</span>
                  <!-- <div *ngIf="!middleNAme.valid && addcomp.submitted" class="invalid-tooltip">
                  Middle Name is required!
                </div> -->
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" required ngModel #lastNAme="ngModel"
                  [(ngModel)]="companydata.lastName" name="lastNAme" />
                  <span>Last Name *</span>
                  @if (!lastNAme.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      Last Name is required!
                    </div>
                  }
                </label>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="text" required ngModel #contactNumber="ngModel"
                    [(ngModel)]="companydata.userNumber" name="contactNumber" />
                    <span>User Number *</span>
                    @if (!contactNumber.valid && addcomp.submitted) {
                      <div class="invalid-tooltip">
                        Contact Number is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="email" required email ngModel #email="ngModel"
                      [(ngModel)]="companydata.email" name="email" />
                      <span>User Email *</span>
                      @if (!email.valid && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          Email is required!
                        </div>
                      }
                      @if (email?.errors?.email && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          Email must be a valid address!
                        </div>
                      }
                    </label>
                  </div>
                  <div class="col-md-4">
                    <label class="form-group has-float-label">
                      <ng-select placeholder="Choose your option" ngModel #role="ngModel" name="role" required
                        [(ngModel)]="companydata.roleMasterID">
                        @for (role of allRoles; track role) {
                          <ng-option [value]="role.roleMasterID">
                            {{ role.roleName }}
                          </ng-option>
                        }
                      </ng-select>
                      <span>Role *</span>
                      @if (!role.valid && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          Role is required!
                        </div>
                      }
                    </label>
                  </div>
                  <!-- <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="password" required ngModel #password="ngModel"  name="password"/>
                    <span>Password</span>
                    <div *ngIf="!password.valid && addcomp.submitted" class="invalid-tooltip">Password is required!</div>
                  </label>
                </div> -->
              </div>
              <!-- <div class="form-check mb-2 mr-sm-2">
              <input class="form-check-input" type="checkbox" ngModel #isadmin="ngModel" [(ngModel)]="isadmins" name="isadmin" >
              <label class="form-check-label" for="inlineFormCheck">
                IsAdmin
              </label>
            </div> -->
            <button class="btn btn-primary" type="submit">{{ 'forms.submit' | translate }}</button>
            <button class="btn btn-danger" type="button" (click)="prev()" style="margin-left: 2%">
              Cancel
            </button>
          </form>
        }
      </div>
    </div>

    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
