<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (branchdata) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Edit Branch</h5>
      <form #editbranch="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" (change)="selectcompany($event)"
                [(ngModel)]="branchdata.companyMasterID" ngModel #company="ngModel" name="company" required>
                @for (company of allcomp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Company *</span>
              @if (!company.valid && editbranch.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-5">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" required ngModel #branchName="ngModel"
                [(ngModel)]="branchdata.branchName" name="branchName" />
                <span>Branch Name *</span>
                @if (!branchName.valid && editbranch.submitted) {
                  <div class="invalid-tooltip">
                    Branch Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" placeholder="" required ngModel #branchCode="ngModel"
                  [(ngModel)]="branchdata.branchCode" name="branchCode" name="branchCode" />
                  <span>Branch Code *</span>
                  @if (!branchCode.valid && editbranch.submitted) {
                    <div class="invalid-tooltip">
                      Branch Code is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="text" placeholder="" ngModel #latitude="ngModel"
                    [(ngModel)]="branchdata.latitude" name="latitude" />
                    <span>Latitude</span>
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="text" placeholder="" ngModel #longitude="ngModel"
                      [(ngModel)]="branchdata.longitude" name="longitude" />
                      <span>Longitude</span>
                    </label>
                  </div>
                  <div class="col-md-4">
                    <label class="form-group has-float-label">
                      <input class="form-control" type="text" placeholder="" ngModel #radius="ngModel"
                        [(ngModel)]="branchdata.radius" name="radius" />
                        <span>Radius</span>
                      </label>
                    </div>
                    <div class="col-md-12">
                      <label class="form-group has-float-label">
                        <textarea class="form-control" ngModel #branchAddress="ngModel" name="branchAddress"
                        [(ngModel)]="branchdata.branchAddress" required></textarea>
                        <span>Branch Address *</span>
                        @if (!branchAddress.valid && editbranch.submitted) {
                          <div class="invalid-tooltip">
                            Branch Address is required!
                          </div>
                        }
                      </label>
                    </div>
                    <div class="col-md-4">
                      <label class="form-group has-float-label">
                        <ng-select placeholder="Choose your option" (change)="selectcountry($event)" [(ngModel)]="countryid"
                          required ngModel #country1="ngModel" name="country1">
                          @for (countrys of country; track countrys) {
                            <ng-option [value]="countrys.countryMasterID">
                              {{ countrys.countryName }}
                            </ng-option>
                          }
                        </ng-select>
                        <span>Branch Country *</span>
                        @if (!country1.valid && editbranch.submitted) {
                          <div class="invalid-tooltip">
                            Country is required!
                          </div>
                        }
                      </label>
                    </div>
                    <div class="col-md-4">
                      <label class="form-group has-float-label">
                        <ng-select placeholder="Choose your option" (change)="selectstate($event)" [(ngModel)]="stateid" required
                          ngModel #state1="ngModel" name="state1">
                          @for (states of state; track states) {
                            <ng-option [value]="states.stateMasterID">
                              {{ states.stateName }}
                            </ng-option>
                          }
                        </ng-select>
                        <span>Branch State *</span>
                        @if (!state1.valid && editbranch.submitted) {
                          <div class="invalid-tooltip">
                            State is required!
                          </div>
                        }
                      </label>
                    </div>
                    <div class="col-md-4">
                      <label class="form-group has-float-label">
                        <ng-select placeholder="Choose your option" (change)="selectcity($event)" [(ngModel)]="cityid" required
                          ngModel #city1="ngModel" name="city1">
                          @for (citys of city; track citys) {
                            <ng-option [value]="citys.cityMasterID">
                              {{ citys.cityName }}
                            </ng-option>
                          }
                        </ng-select>
                        <span>Branch City *</span>
                        @if (!city1.valid && editbranch.submitted) {
                          <div class="invalid-tooltip">
                            City is required!
                          </div>
                        }
                      </label>
                    </div>
                    <div class="col-md-4">
                      <label class="form-group has-float-label">
                        <input class="form-control" type="text" placeholder="" ngModel #gstNumber="ngModel"
                          [(ngModel)]="branchdata.gstNumber" name="gstNumber" />
                          <span>GST No.</span>
                        </label>
                      </div>
                      <div class="col-md-4">
                        <label class="form-group has-float-label">
                          <input class="form-control" type="text" placeholder="" ngModel #lwfNumber="ngModel"
                            [(ngModel)]="branchdata.lwfNumber" name="lwfNumber" />
                            <span>LWF No.</span>
                          </label>
                        </div>
                        <div class="col-md-4">
                          <label class="form-group has-float-label">
                            <input class="form-control" type="text" placeholder="" ngModel #professionaltaxNumber="ngModel"
                              [(ngModel)]="branchdata.professionaltaxNumber" name="professionaltaxNumber" />
                              <span>Professional Tax No.</span>
                            </label>
                          </div>
                          <div class="col-md-4">
                            <label class="form-group has-float-label">
                              <input class="form-control" type="text" placeholder="" ngModel #pfNumber="ngModel"
                                [(ngModel)]="branchdata.pfNumber" name="pfNumber" />
                                <span>{{pfNumberlabel}}</span>
                              </label>
                            </div>
                            <div class="col-md-4">
                              <label class="form-group has-float-label">
                                <input class="form-control" type="text" placeholder="" ngModel #esicNumber="ngModel"
                                  [(ngModel)]="branchdata.esicNumber" name="esicNumber" />
                                  <span>{{esicNumberlabel}}</span>
                                </label>
                              </div>
                            </div>
                            <app-state-button [btnClass]="'btn btn-primary btn-lg btn-shadow mt-4'" [currentState]="buttonState"
                              [isDisabled]="buttonDisabled" click="onLoginClick()">
                              {{ 'forms.submit' | translate }}
                            </app-state-button>
                            <button class="btn btn-danger btn-lg btn-shadow mt-4" [routerLink]="adminRoot + '/masters/branch'"
                              style="margin-left: 2%">
                              Cancel
                            </button>
                          </form>
                        </div>
                      </div>
                    }

                    <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
