<div class="row">
  <div class="col-md-12">
    <form #feedbackForm="ngForm" novalidate (ngSubmit)="AnonymousFeedback()">
      <div class="row" style="padding-left: 20px;">
        <div class="col-lg-12">
          <label class="form-group has-float-label">
            <textarea class="form-control" ngModel #feedback="ngModel" required name="feedback"
            rows="4"></textarea>
            <span>Feedback *</span>
            @if (!feedback.valid && feedbackForm.submitted) {
              <div class="invalid-tooltip">
                Feedback is required!
              </div>
            }
          </label>
        </div>

        <div class="col-12">
          <button class="btn btn-primary mb-4" type="submit">
            {{ 'forms.submit' | translate }}
          </button>
        </div>
      </div>
    </form>
  </div>

</div>
