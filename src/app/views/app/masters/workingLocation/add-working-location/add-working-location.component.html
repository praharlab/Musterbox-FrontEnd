<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Working Location</h5>

    <form #addworkinglocation="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        @if (allcomp.length > 0) {
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                (change)="selectcompany($event)"
                ngModel
                #company="ngModel"
                name="company"
                required
                [(ngModel)]="company_id"
                >
                @for (company of allcomp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Company *</span>
              @if (!company.valid && addworkinglocation.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
        }

        <!-- <div class="col-md-4">
        <label class="form-group has-float-label">
          <ng-select
            placeholder="Choose your option"
            ngModel
            #branch="ngModel"
            name="branch"
            [(ngModel)]="selectedBranch"
            required
            >
            <ng-option [value]="item.branchMasterID" *ngFor="let item of allbranch">
              {{ item.branchName }}
            </ng-option>
          </ng-select>
          <span>Branch *</span>
          <div *ngIf="!branch.valid && addworkinglocation.submitted" class="invalid-tooltip">
            Branch is required!
          </div>
        </label>
      </div> -->

      <div class="col-md-4">
        <label class="form-group has-float-label">
          <input
            class="form-control"
            type="text"
            required
            ngModel
            #workingLocationName="ngModel"
            name="workingLocationName"
            />
            <span>Working Location Name *</span>
            @if (!workingLocationName.valid && addworkinglocation.submitted) {
              <div
                class="invalid-tooltip"
                >
                Working Location Name is required!
              </div>
            }
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <input
              class="form-control"
              type="number"
              placeholder=""
              ngModel
              #latitude="ngModel"
              name="latitude"
              required
              />
              <span>Latitude *</span>
              @if (!latitude.valid && addworkinglocation.submitted) {
                <div class="invalid-tooltip">
                  This field is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="number"
                placeholder=""
                ngModel
                #longitude="ngModel"
                name="longitude"
                required
                />
                <span>Longitude *</span>
                @if (!longitude.valid && addworkinglocation.submitted) {
                  <div class="invalid-tooltip">
                    This field is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="number"
                  placeholder=""
                  ngModel
                  #radius="ngModel"
                  name="radius"
                  required
                  />
                  <span>Radius *</span>
                  @if (!radius.valid && addworkinglocation.submitted) {
                    <div class="invalid-tooltip">
                      This field is required!
                    </div>
                  }
                </label>
              </div>

              <div class="col-md-12">
                <label class="form-group has-float-label">
                  <textarea
                    class="form-control"
                    ngModel
                    #workingLocationAddress="ngModel"
                    name="workingLocationAddress"
                    required
                  ></textarea>
                  @if (!workingLocationAddress.valid && addworkinglocation.submitted) {
                    <div
                      class="invalid-tooltip"
                      >
                      Working Location Address is required!
                    </div>
                  }
                  <span>Working Location Address *</span>
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select
                    placeholder="Choose your option"
                    (change)="selectcountry($event)"
                    ngModel
                    #country1="ngModel"
                    required
                    name="country1"
                    >
                    @for (countrys of country; track countrys) {
                      <ng-option [value]="countrys.countryMasterID">
                        {{ countrys.countryName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>Country *</span>
                  @if (!country1.valid && addworkinglocation.submitted) {
                    <div class="invalid-tooltip">
                      Country is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select
                    placeholder="Choose your option"
                    (change)="selectstate($event)"
                    ngModel
                    #state1="ngModel"
                    [(ngModel)]="selectedstate"
                    required
                    name="state1"
                    >
                    @for (states of state; track states) {
                      <ng-option [value]="states.stateMasterID">
                        {{ states.stateName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>State *</span>
                  @if (!state1.valid && addworkinglocation.submitted) {
                    <div class="invalid-tooltip">
                      Country is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <ng-select
                    placeholder="Choose your option"
                    (change)="selectcity($event)"
                    ngModel
                    #city1="ngModel"
                    required
                    [(ngModel)]="selectedcity"
                    name="city1"
                    >
                    @for (citys of city; track citys) {
                      <ng-option [value]="citys.cityMasterID">
                        {{ citys.cityName }}
                      </ng-option>
                    }
                  </ng-select>
                  <span>City *</span>
                  @if (!city1.valid && addworkinglocation.submitted) {
                    <div class="invalid-tooltip">
                      Country is required!
                    </div>
                  }
                </label>
              </div>
            </div>

            <app-state-button
              [btnClass]="'btn btn-primary btn-lg btn-shadow mt-4'"
              [currentState]="buttonState"
              [isDisabled]="buttonDisabled"
              click="onLoginClick()"
              >
              {{ 'forms.submit' | translate }}
            </app-state-button>
            <button
              class="btn btn-danger btn-lg btn-shadow mt-4"
              [routerLink]="adminRoot + '/masters/workingLocation'"
              style="margin-left: 2%"
              >
              Cancel
            </button>
          </form>
        </div>
      </div>

      <simple-notifications
        [options]="{ position: ['top', 'center'], maxStack: 1 }"
      ></simple-notifications>
