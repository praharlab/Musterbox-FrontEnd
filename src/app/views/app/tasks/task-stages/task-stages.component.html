<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Task Stages" [showadd]="permissioncreate" [showOrderBy]="false" [showDisplayMode]="false"
  [searchValue]="filterData.searchQuery" (searchKeyUp)="updateFilter($event)" (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="lgModal2.show(); getcompany()"></app-list-page-header>
<!-- import and export files -->

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel [multiple]="true" [closeOnSelect]="false"
                #companyMasterID="ngModel" name="companyMasterID" [(ngModel)]="filterData.companyMasterID" required>
                @for (company of comp; track company) {
                  <ng-option [value]="company.companyMasterID">
                    {{ company.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!companyMasterID.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary form-group" type="submit" (click)="onsubmit3()">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          </div>
          <div class="col-md-3" style="text-align: right">
            <span class="btn btn-info mb-1" style="margin-right: 15px" (click)="importExcel()">Import</span>
            @if (rows.length != 0) {
              <span class="btn btn-info mb-1" (click)="downloadFile()">Export</span>
            }
          </div>
        </div>
      </form>
    }
  </div>
</div>


<div style="text-align: right"></div>
@if (rows) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="scrollBarHorizontal" [rowHeight]="50" [rows]="rows" [footerHeight]="100"
        [columnMode]="'force'" [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount"
        [offset]="page.offset" (page)="onChange($event)">
        <ngx-datatable-column name="Company Name" prop="company.companyName" [flexGrow]="1.2"
        [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Task Stage" prop="TaskStage" [flexGrow]="1.2" [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Status" prop="status" [flexGrow]="1.2" [width]="30">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (row.status == '1') {
              <button type="button" class="btn btn-success"
                (click)="alertDeactiveConfirmation(row.tasks_stagesID)">
                {{ 'Active' | translate }}
              </button>
            }
            {{ ' ' }}
            @if (row.status == '0') {
              <button type="button" class="btn btn-danger"
                (click)="alertActiveConfirmation(row.tasks_stagesID)">
                {{ 'Deactive' | translate }}
              </button>
            }
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <a (click)="getcompany(); getData(row.tasks_stagesID); lgModal1.show()">
              <span tooltip="Edit Company Details." [class]="'glyph-icon simple-icon-pencil tool_tip'"
              style="padding-right: 10px; font-size: 18px"></span>
              {{ ' ' }}
            </a>
            @if (row.delete == true) {
              <a (click)="alertConfirmation(row.tasks_stagesID)">
                <span tooltip="Delete Company Details." [class]="'glyph-icon simple-icon-trash tool_tip'"
                style="padding-right: 6px; font-size: 18px"></span>
                {{ ' ' }}
              </a>
            }
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<!--Import file-->

<div bsModal #lgModal2="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Add Task Stage</h4>
        <button #closeModal type="button" class="btn-close close pull-right" (click)="lgModal2.hide()"
          aria-label="Close">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #addtaskstage="ngForm" novalidate (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company" required>
                  @for (company of allcomp; track company) {
                    <ng-option [value]="company.companyMasterID">
                      {{ company.companyName }}
                    </ng-option>
                  }
                </ng-select>
                <span>Company *</span>
                @if (!company.valid && addtaskstage.submitted) {
                  <div class="invalid-tooltip">
                    Company is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" required ngModel #taskstage="ngModel" name="taskstage" />
                <span>Task Stage *</span>
                @if (!taskstage.valid && addtaskstage.submitted) {
                  <div class="invalid-tooltip">
                    Task Stage is required!
                  </div>
                }
              </label>
            </div>
          </div>

          <button class="btn btn-primary" type="submit">
            {{ 'forms.submit' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div bsModal #lgModal1="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Edit Task Stage</h4>
        <button #closeModal1 type="button" class="btn-close close pull-right" (click)="lgModal1.hide()"
          aria-label="Close">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #edittaskstage="ngForm" novalidate (ngSubmit)="onSubmit1()">
          <div class="row">
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company"
                  [(ngModel)]="companyID" required>
                  @for (company of allcomp; track company) {
                    <ng-option [value]="company.companyMasterID">
                      {{ company.companyName }}
                    </ng-option>
                  }
                </ng-select>
                <span>Company *</span>
                @if (!company.valid && edittaskstage.submitted) {
                  <div class="invalid-tooltip">
                    Company is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" required ngModel #taskstage="ngModel" [(ngModel)]="editdata"
                  name="taskstage" />
                  <span>Task Stage *</span>
                  @if (!taskstage.valid && edittaskstage.submitted) {
                    <div class="invalid-tooltip">
                      Task Stage is required!
                    </div>
                  }
                </label>
              </div>
            </div>

            <button class="btn btn-primary" type="submit">
              {{ 'forms.submit' | translate }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
