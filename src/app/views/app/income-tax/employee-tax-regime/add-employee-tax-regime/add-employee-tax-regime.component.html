<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>


<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Employee Tax Regime</h5>
    @if (permissioncreate.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit1()">
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company"
                (change)="selectcompany($event)" required>
                @for (company1 of company1; track company1) {
                  <ng-option [value]="company1.companyMasterID">
                    {{ company1.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!company.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #branchName="ngModel" name="branch"
                (change)="selectbranch($event)">
                @for (item of allbranch; track item) {
                  <ng-option [value]="item.branchMasterID">
                    {{ item.branchName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #financialYear="ngModel" name="financialYear"
                (change)="selectfinancialYear($event)" required>
                @for (year of financialYears; track year) {
                  <ng-option [value]="year">
                    {{ year }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Financial Year *</span>
              @if (!financialYear.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Financial Year is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="true" bindLabel="name" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="userMasterID" [closeOnSelect]="false"
                ngModel #name="ngModel" name="name" required>
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select User *</span>
              @if (!name.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  User is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #regime="ngModel" name="regime" required>
                <ng-option value="Old Regime">Old Regime</ng-option>
                <ng-option value="New Regime">New Regime</ng-option>
              </ng-select>
              <span>Select Regime *</span>
              @if (!regime.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Regime is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary form-group" type="submit">
              {{ 'Submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-danger form-group" [routerLink]="adminRoot + '/incometax/list_employee_tax_regime'"
              style="margin-left: 2%">
              Cancel
            </button>
          </div>
        </div>
      </form>
    }
  </div>
</div>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
