<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="TDS Sub Section Category"  [showadd]="permissioncreate" [showOrderBy]="true" [showDisplayMode]="false" [showOrderBy]="false"
  (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="limit" [itemOrder]="Order"
[itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()"></app-list-page-header>

<div class="row">
  <div class="col-12 mb-4 data-table-rows">
    <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
      [limit]="limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
      (page)="onChange($event)">
      <ngx-datatable-column name="Category Name" prop="categoryName" [flexGrow]="1.2"
      [width]="120"></ngx-datatable-column>
      <ngx-datatable-column name="Description" prop="description" [flexGrow]="1.2"
      [width]="120"></ngx-datatable-column>

      <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <a (click)="lgModal1.show(); edit(row.tdsSubSectionCategoryID) ">
            <span tooltip="Edit Subsection category Details." [class]="'glyph-icon simple-icon-pencil tool_tip'"
            style="padding-right: 10px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
          <a (click)="alertConfirmation(row.tdsSubSectionCategoryID)">
            <span tooltip="Delete Subsection category Details." [class]="'glyph-icon simple-icon-trash tool_tip'"
            style="padding-right: 6px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
        </ng-template>
      </ngx-datatable-column>

      @if (true) {
        <ngx-datatable-footer>
          <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
            let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
            <div class="w-100 d-flex justify-content-center">
              <pagination [totalItems]="rowCount" [itemsPerPage]="pageSize" [maxSize]="5"
                (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
              [customPreviousTemplate]="prevTemplate"></pagination>
            </div>
          </ng-template>
        </ngx-datatable-footer>
      }
    </ngx-datatable>
  </div>
</div>


<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>



<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Add TDS Sub Section Category</h4>
        <button #closeModal type="button" class="btn-close close pull-right" (click)="lgModal.hide()"
          aria-label="Close">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input class="form-control" type="text" ngModel  #categoryName="ngModel"
                  name="categoryName" required />
                  <span>TDS Sub Section Category Name *</span>
                  @if (!categoryName.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      TDS Sub Section Category Name is required!
                    </div>
                  }
                </label>
              </div>

              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <textarea class="form-control" type="text" ngModel  #description="ngModel"
                  name="description" required > </textarea>
                  <span>Description *</span>
                  @if (!description.valid && addcomp.submitted) {
                    <div class="invalid-tooltip">
                      Description is required!
                    </div>
                  }
                </label>
              </div>
            </div>

            <button class="btn btn-primary" type="submit">{{ 'forms.submit' | translate }}</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div bsModal #lgModal1="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title pull-left">Edit TDS Sub Section Category</h4>
          <button #closeModal1 type="button" class="btn-close close pull-right" (click)="lgModal1.hide()"
            aria-label="Close">
            <span aria-hidden="true" class="visually-hidden">&times;</span>
          </button>
        </div>
        <div class="modal-body" >
          @if (editdata) {
            <form #editcomp="ngForm" novalidate (ngSubmit)="onSubmit1()">
              <div class="row">
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="text" ngModel  #categoryName="ngModel" [(ngModel)]="editdata.categoryName"
                      name="categoryName" required />
                      <span>TDS Sub Section Category Name *</span>
                      @if (!categoryName.valid && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          TDS Sub Section Category Name is required!
                        </div>
                      }
                    </label>
                  </div>
                  <div class="col-md-6">
                    <label class="form-group has-float-label">
                      <textarea class="form-control" type="text" ngModel  #description="ngModel"
                      name="description" [(ngModel)]="editdata.description" required > </textarea>
                      <span>Description *</span>
                      @if (!description.valid && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          Description is required!
                        </div>
                      }
                    </label>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">{{ 'forms.submit' | translate }}</button>
              </form>
            }
          </div>
        </div>
      </div>
    </div>
