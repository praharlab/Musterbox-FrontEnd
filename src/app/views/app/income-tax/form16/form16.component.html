<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="row">
  <div class="col-12">
    <app-heading title="Form 16"></app-heading>
    <app-breadcrumb title="Form 16"></app-breadcrumb>
    <div class="separator mb-5"></div>
  </div>
</div>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="onClickDownloadPdf()" (clearData)="clear()" [multiUser]="false">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select placeholder="Choose your option" ngModel #financialYear="ngModel" name="financialYear" required>
          @for (year of previousFinancialYears; track year) {
            <ng-option [value]="year">
              {{ year }}
            </ng-option>
          }
        </ng-select>
        <span>Select financialYear *</span>
        @if (!financialYear.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            Year is required!
          </div>
        }
      </label>
    </div>
  </app-common-filter>
}

@if (rows) {
  <div class="d-flex justify-content-center mt-4">
    <pdf-viewer [src]="rows" [rotation]="0" [original-size]="false" [show-all]="true" [fit-to-page]="false" [zoom]="1"
      [zoom-scale]="'page-width'" [stick-to-page]="false" [render-text]="true" [external-link-target]="'blank'"
    [autoresize]="true" [show-borders]="false" style="width: 80%; height: 1000px"></pdf-viewer>
  </div>
}

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
