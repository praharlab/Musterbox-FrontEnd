<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Employee Declaration Report" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage" [showSearch]="false"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()"
    (getCompany)="getCompany($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select placeholder="Choose your option" ngModel #financialYear="ngModel"
          name="financialYear" required>
          @for (year of financialYears; track year) {
            <ng-option [value]="year">
              {{ year }}
            </ng-option>
          }
        </ng-select>
        <span>Select Assessment Year *</span>
        @if (!financialYear.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            Financial Year is required!
          </div>
        }
      </label>
    </div>
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select placeholder="Choose your option" ngModel #authStatus="ngModel" name="authStatus"
          [multiple]="true">
          <ng-option value="0">
            {{ 'Pending' }}
          </ng-option>
          <ng-option value="1">
            {{ 'Accepted' }}
          </ng-option>
          <ng-option value="2">
            {{ 'Rejected' }}
          </ng-option>
        </ng-select>
        <span>Select AuthStatus</span>
      </label>
    </div>
  </app-common-filter>
}

@if (rows && rows.length > 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [columnMode]="ColumnMode" [footerHeight]="50" [rowHeight]="50" [rows]="rows"
        [limit]="filterData.limit" [scrollbarH]="true" [rowHeight]="50" [footerHeight]="100"
        [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset" (page)="onChange($event)">
        <ngx-datatable-column name="Employee Code" prop="Employee Code" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Employee Name" prop="Employee Name" [flexGrow]="1.2" [width]="250">
        </ngx-datatable-column>
        <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="120">
        </ngx-datatable-column>
        <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Assessment Year" prop="Assessment Year" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="TDS Section" prop="TDS Section" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="TDS Sub-Section" prop="TDS Sub-Section" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Declared Amount" prop="Declared Amount" [flexGrow]="1.2" [width]="150">
        </ngx-datatable-column>
        <ngx-datatable-column name="Auth Status" prop="Auth Status" [flexGrow]="1.2" [width]="150">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (
              row['Auth Status'] == 'Pending') {
              <button type="button" class="btn btn-outline-warning btn-xs">
                Pending
              </button>
            }
            {{ ' ' }}
            @if (row['Auth Status'] == 'Accepted') {
              <button type="button" class="btn btn-outline-success btn-xs"
                >
                Accepted
              </button>
            }
            {{ ' ' }}
            @if (row['Auth Status'] == 'Rejected') {
              <button type="button" class="btn btn-outline-danger btn-xs"
                >
                Rejected
              </button>
            }
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}


<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
