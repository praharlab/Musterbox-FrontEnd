<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="TDS Sub Section Limit" [showadd]="permissioncreate" [showOrderBy]="true"
  [showDisplayMode]="false" [searchValue]="body.searchQuery" [showOrderBy]="false"
  (searchKeyUp)="updateFilter($event)" (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="body.limit"
  [itemOrder]="Order" [itemOptionsPerPage]="itemOptionsPerPage"
(addNewItem)="showAddNewModal()"></app-list-page-header>


<div class="card mb-4">
  <div class="card-body">
    <form #sectionfilter="ngForm" novalidate>
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #tdsSectionID="ngModel" name="tdsSectionID"
              [(ngModel)]="selectedSection" (change)="getTDSSubSection(true)">
              @for (item of tdsSectionData; track item) {
                <ng-option [value]="item.tdsSectionID">
                  {{ item.tdsSectionName }}
                </ng-option>
              }
            </ng-select>
            <span>Select TDS Section </span>
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #tdsSubSectionCategoryID="ngModel"
              name="tdsSubSectionCategoryID" [(ngModel)]="selectedCategory" (change)="getTDSSubSection(true)">
              @for (category of tdsSubSectionCategory; track category) {
                <ng-option
                  [value]="category.tdsSubSectionCategoryID">
                  {{ category.categoryName }}
                </ng-option>
              }
            </ng-select>
            <span>Select TDS Sub Section Category </span>
          </label>
        </div>


        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #tdsSubSectionID="ngModel"
              name="tdsSubSectionID" [(ngModel)]="selectedSubSectionID">
              @for (item of tdsSubSectionData; track item) {
                <ng-option [value]="item.tdsSubSectionID">
                  {{ item.tdsSubSectionName }}
                </ng-option>
              }
            </ng-select>
            <span>Select TDS Sub Section </span>
          </label>
        </div>

        <div class="col-md-4">
          <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
            {{ 'forms.submit' | translate }}
          </button>
          &nbsp;&nbsp;
          <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          <span> &nbsp;&nbsp; </span>
          @if (rows.length) {
            <button class="btn btn-info form-group" type="button" (click)="Export()">Export</button>
          }

        </div>
      </div>
    </form>
  </div>
</div>



@if (rows.length) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="body.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Sub Section Name" prop="tdsSubSection.tdsSubSectionName" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Section Name" prop="tdsSubSection.tdsSection.tdsSectionName" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Category Name" prop="tdsSubSection.tdsSubSectionCategory.categoryName"
        [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Limit ApplicableYYYYMM" prop="applicableYYYYMM" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="MaxLimit" prop="maxLimit" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <a (click)="navigateToEditPage(row)">
              <span tooltip=" Edit Subsection Limit Details."
                [class]="'glyph-icon simple-icon-pencil tool_tip'"
              style="padding-right: 10px; font-size: 18px"></span>
              {{ ' ' }}
            </a>
            <a (click)="alertConfirmation(row.id)">
              <span tooltip="Delete Subsection Limit Details."
                [class]="'glyph-icon simple-icon-trash tool_tip'"
              style="padding-right: 6px; font-size: 18px"></span>
              {{ ' ' }}
            </a>
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Created Date" prop="createdAt" [flexGrow]="1.2" [width]="160">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdAt | date: 'dd-MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="body.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}


<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
