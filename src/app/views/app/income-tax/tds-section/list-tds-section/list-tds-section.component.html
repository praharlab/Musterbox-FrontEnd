<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="TDS Section" [showadd]="permissioncreate" [showOrderBy]="true" [showDisplayMode]="false"
  [searchValue]="body.searchQuery" [showOrderBy]="false" (changeOrderBy)="onChangeOrderBy($event)" (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="body.limit" [itemOrder]="Order"
[itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()"></app-list-page-header>


<div class="row">
  <div class="col-md-12" style="text-align: right">
    <span class="btn btn-info mb-1" style="margin-right: 15px" (click)="lgModal.show()">
      Import
    </span>
    @if (rows.length != 0) {
      <span class="btn btn-info mb-1" (click)="onOptionSelect()">Export</span>
    }
  </div>
</div>


<div class="row">
  <div class="col-12 mb-4 data-table-rows">
    <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
      [limit]="body.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
      (page)="onChange($event)">
      <ngx-datatable-column name="Name" prop="tdsSectionName" [flexGrow]="1.2"
      [width]="120"></ngx-datatable-column>
      <ngx-datatable-column name="Description" prop="tdsSectionDescription" [flexGrow]="1.2"
      [width]="300"></ngx-datatable-column>
      <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <a (click)="navigateToEditPage(row)">
            <span tooltip="Edit Section Details." [class]="'glyph-icon simple-icon-pencil tool_tip'"
            style="padding-right: 10px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
          <a (click)="alertConfirmation(row.tdsSectionID)">
            <span tooltip="Delete Section Details." [class]="'glyph-icon simple-icon-trash tool_tip'"
            style="padding-right: 6px; font-size: 18px"></span>
            {{ ' ' }}
          </a>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Created Date" prop="createdAt" [flexGrow]="1.2" [width]="160">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.createdAt | date: 'dd-MM-yyyy' }}
        </ng-template>
      </ngx-datatable-column>
      @if (true) {
        <ngx-datatable-footer>
          <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
            let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
            <div class="w-100 d-flex justify-content-center">
              <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                [customLastTemplate]="lastTemplate" [itemsPerPage]="body.limit" [maxSize]="5"
                [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
              [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
            </div>
          </ng-template>
        </ngx-datatable-footer>
      }
    </ngx-datatable>
  </div>
</div>

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>

<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>


<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>


<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Import Section</h4>
        <button type="button" class="btn-close close pull-right" (click)="lgModal.hide();modalClear()"
          aria-label="Close" #closeModal>
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form #addimportuser="ngForm" novalidate (ngSubmit)="submit()">
          <div class="row">
            <div class="col-md-6 mr-2">
              <label class="form-group has-float-label">
                <input class="form-control" type="file" ngModel #file="ngModel"
                  (change)="onSelectFile($event)"
                  accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel"
                  name="file" required />
                  <span>Import File *</span>
                </label>
                @if (!file.valid && addimportuser.submitted) {
                  <div class="invalid-tooltip">
                    File is required!
                  </div>
                }
              </div>

              <div class="col-md-6">
                <button class="btn btn-primary" type="submit">
                  {{ 'forms.submit' | translate }}
                </button>
                &nbsp;
                <button (click)="demo()" type="button" class="btn btn-success">
                  Download Demo Excel
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
