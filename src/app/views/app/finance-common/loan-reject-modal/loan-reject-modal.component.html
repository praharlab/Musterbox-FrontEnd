<div bsModal #lgModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title pull-left">Reject</h4>
                <button type="button" class="btn-close close pull-right" (click)="lgModal.hide()"
                    aria-label="Close" #closeModal>
                    <span aria-hidden="true" class="visually-hidden">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form #reject="ngForm" novalidate (ngSubmit)="onSubmit1()">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-group has-float-label">
                                <textarea type="text" class="form-control" ngModel #remarks="ngModel"
                                    name="remarks"></textarea>
                                <span>Remarks</span>
                            </label>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit">
                        {{ 'forms.submit' | translate }}
                    </button>
                    &nbsp;
                    <button type="button" class="btn btn-primary" (click)="lgModal.hide()"
                        #closeModal>
                        Cancel
                    </button>
                </form>
            </div>
        </div>
    </div>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
