<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header
  name="Employee Investment"
  [showOrderBy]="false"
  [showDisplayMode]="false"
  (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)"
  [itemsPerPage]="filterData.limit"
  [itemOptionsPerPage]="itemOptionsPerPage"
  (addNewItem)="showAddNewModal()"
  [showadd]="true"
></app-list-page-header>
@if (rows) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable
        [scrollbarH]="scrollBarHorizontal"
        [rowHeight]="50"
        [rows]="rows"
        [footerHeight]="100"
        [columnMode]="'force'"
        [limit]="filterData.limit"
        [externalPaging]="true"
        [count]="page.totalCount"
        [offset]="page.offset"
        (page)="onChange($event)"
        >
        <ngx-datatable-column name="Sr. No" prop="srlNo" [flexGrow]="1.2" [width]="40" value="1">
          <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
            {{ filterData.limit * (filterData.page - 1) + rowIndex + 1 }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column
          name="Name"
          prop="userMaster.displayName"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column
          name="Under Tax"
          prop="form16child.form16.SalaryDetails"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column
          name="InvestmentName"
          prop="InvestmentName"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column
          name="InvestmentAmount"
          prop="InvestmentAmount"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column
          name="YearMonth"
          prop="YearMonth"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column name="Status" prop="Status" [flexGrow]="1.2" [width]="80">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (row.Status == '1') {
              <button
                type="button"
                class="btn btn-success"
                (click)="alertDeactiveConfirmation(row.InvestmentDetailsID)"
                >
                {{ 'Active' | translate }}
              </button>
            }
            {{ ' ' }}
            @if (row.Status == '0') {
              <button
                type="button"
                class="btn btn-danger"
                (click)="alertActiveConfirmation(row.InvestmentDetailsID)"
                >
                {{ 'Deactive' | translate }}
              </button>
            }
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <a
            routerLink="{{ adminRoot }}/form16s/edit_employee_investment/{{
              row.InvestmentDetailsID
            }}"
              >
              <span
                tooltip="Edit Employee Investment Details."
                [class]="'glyph-icon simple-icon-pencil tool_tip'"
                style="padding-right: 10px; font-size: 18px"
              ></span>
              {{ ' ' }}
            </a>
            <a (click)="alertConfirmation(row.InvestmentDetailsID)">
              <span
                tooltip="Delete Employee Investment Details."
                [class]="'glyph-icon simple-icon-trash tool_tip'"
                style="padding-right: 6px; font-size: 18px"
              ></span>
              {{
              '
              '
              }}
            </a>
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template
              ngx-datatable-footer-template
              let-rowCount="rowCount"
              let-pageSize="pageSize"
              let-selectedCount="selectedCount"
              let-curPage="curPage"
              let-offset="offset"
              let-limit="limit"
              >
              <div class="w-100 d-flex justify-content-center">
                <pagination
                  [totalItems]="rowCount"
                  [itemsPerPage]="pageSize"
                  [maxSize]="5"
                  (pageChanged)="table.onFooterPage($event)"
                  [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"
                ></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
