<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit Tax Challan</h5>

    @if (editformdata) {
      <form #editform="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                [items]="empList"
                bindLabel="name"
                groupBy="selectedAllGroup"
                [selectableGroup]="true"
                [selectableGroupAsModel]="false"
                bindValue="userMasterID"
                [closeOnSelect]="true"
                [(ngModel)]="selecteddata"
                ngModel
                #userid="ngModel"
                name="userid"
                >
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select User</span>
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                required
                #assessmentyear="ngModel"
                name="assessmentyear"
                [(ngModel)]="editformdata.AssessmentYear"
                >
                @for (assessmentYear of assessmentYear; track assessmentYear) {
                  <ng-option [value]="assessmentYear">
                    {{ assessmentYear }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Assesment Year *</span>
              @if (!assessmentyear.valid && editform.submitted) {
                <div class="invalid-tooltip">
                  Assessment Year is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="number"
                required
                ngModel
                #SrNo="ngModel"
                name="SrNo"
                [(ngModel)]="editformdata.SrNo"
                />
                <span>Sr No *</span>
                @if (!SrNo.valid && editform.submitted) {
                  <div class="invalid-tooltip">
                    SrNo is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="number"
                  required
                  ngModel
                  #TaxDepositedAmt="ngModel"
                  name="TaxDepositedAmt"
                  [(ngModel)]="editformdata.TaxDepositedAmt"
                  />
                  <span>Tax Deposited Amount *</span>
                  @if (!TaxDepositedAmt.valid && editform.submitted) {
                    <div class="invalid-tooltip">
                      Tax Deposited Amount is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <input
                    class="form-control"
                    type="text"
                    required
                    ngModel
                    #BSRCode="ngModel"
                    name="BSRCode"
                    [(ngModel)]="editformdata.BSRCode"
                    />
                    <span>BSRCode *</span>
                    @if (!BSRCode.valid && editform.submitted) {
                      <div class="invalid-tooltip">
                        BSRCode is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="date"
                      required
                      ngModel
                      #TaxDepositedDate="ngModel"
                      name="TaxDepositedDate"
                      [(ngModel)]="editformdata.TaxDepositedDate"
                      />
                      <span>Tax Deposited Date *</span>
                      @if (!TaxDepositedDate.valid && editform.submitted) {
                        <div class="invalid-tooltip">
                          Tax Deposited Date is required!
                        </div>
                      }
                    </label>
                  </div>
                  <div class="col-md-6">
                    <label class="form-group has-float-label">
                      <input
                        class="form-control"
                        type="number"
                        required
                        ngModel
                        #ChallanSerialNo="ngModel"
                        name="ChallanSerialNo"
                        [(ngModel)]="editformdata.ChallanSerialNo"
                        />
                        <span>Challan Serial No *</span>
                        @if (!ChallanSerialNo.valid && editform.submitted) {
                          <div class="invalid-tooltip">
                            Challan Serial No is required!
                          </div>
                        }
                      </label>
                    </div>
                    <div class="col-md-6">
                      <label class="form-group has-float-label">
                        <ng-select ngModel #Oltas="ngModel" name="Oltas" [(ngModel)]="editformdata.Oltas">
                          <ng-option value="U">U</ng-option>
                          <ng-option value="P">P</ng-option>
                          <ng-option value="F">F</ng-option>
                          <ng-option value="O">O</ng-option>
                        </ng-select>
                        <span>Oltas *</span>
                        @if (!Oltas.valid && editform.submitted) {
                          <div class="invalid-tooltip">
                            Oltas is required!
                          </div>
                        }
                      </label>
                    </div>
                  </div>
                  <br />
                  <div class="col-md-12">
                    <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                    <button
                      class="btn btn-danger btn-shadow mt-4"
                      [routerLink]="adminRoot + '/form16s/tax_challan'"
                      style="margin-left: 2%"
                      >
                      Cancel
                    </button>
                  </div>
                </form>
              }
            </div>
          </div>

          <simple-notifications
            [options]="{ position: ['top', 'center'], maxStack: 1 }"
          ></simple-notifications>
