<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Attendance Correction Request Report" [showOrderBy]="false" [showDisplayMode]="false"
  [showSearch]="false" (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[showItemsPerPage]="rows.length != 0"></app-list-page-header>
@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()" (init)="init($event)" (emitUsers)="emitUsers($event)" [showRequiredFields]="showRequiredFields">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="date" ngModel #startdate="ngModel" name="startdate" required />
        <span>From Date *</span>
        @if (!startdate.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            From Date is required!
          </div>
        }
      </label>
    </div>
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <input class="form-control" type="date" ngModel #enddate="ngModel" name="enddate" required />
        <span>To Date *</span>
        @if (!enddate.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            To Date is required!
          </div>
        }
      </label>
    </div>
  </app-common-filter>
}

@if (rows && rows.length > 0 && permissionview.length > 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Employee Code" prop="employeeCode" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Employee Name" prop="displayName" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Division" prop="Division" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
        <ngx-datatable-column name="Attendance Date" prop="AttendanceDate" [flexGrow]="1.2" [width]="120">
        </ngx-datatable-column>
        <ngx-datatable-column name="Auth Criteria" prop="authCriteria" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Status" prop="authorizationStatus" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Remarks" prop="remark" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Attendance Status" prop="attendanceStatus" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Log Time" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @for (log of row.logTime; track log; let i = $index) {
              <div>
                {{ log }}
              </div>
            }
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Authorizations" prop="authorizations" [flexGrow]="1.2"
        [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Created By" prop="createBy" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        <ngx-datatable-column name="Updated By" prop="updateBy" [flexGrow]="1.2" [width]="150"></ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
