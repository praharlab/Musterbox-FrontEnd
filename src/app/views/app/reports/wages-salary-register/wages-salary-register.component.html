<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Wages/Salary Register" [showadd]="permissioncreate" [showOrderBy]="false"
  [showSearch]="false" [showDisplayMode]="false" (itemsPerPageChange)="onLimitChange($event)"
[itemsPerPage]="filterData.limit" [itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #cid="ngModel" (change)="selectcompany($event)"
                name="cid" required>
                @for (data of company; track data) {
                  <ng-option [value]="data.companyMasterID">
                    {{ data.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!cid.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <input class="form-control" type="month" required ngModel #YearMM="ngModel" name="YearMM" required />
              <span>YearMonth *</span>
              @if (!YearMM.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  YearMonth is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select [items]="allbranch" [multiple]="true" bindLabel="branchName" groupBy="selectedAllGroup" required
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="branchMasterID"
                (change)="selectbranch($event)" [closeOnSelect]="false" [(ngModel)]="selectedBranches" ngModel
                #branchName="ngModel" name="branchName">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall1" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select Branch *</span>
              @if (!branchName.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Branch is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select [items]="employeement" [multiple]="true" bindLabel="employeement" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="item" [closeOnSelect]="false" ngModel
                #fromdate="ngModel" name="fromdate">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index"></ng-template>
              </ng-select>
              <span>Select Employeement</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #division="ngModel" name="division"
                [(ngModel)]="selectedDivision" (change)="selectdivision($event)">
                @for (item of allDivision; track item) {
                  <ng-option [value]="item.id">
                    {{ item.divisionName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Division</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #salarytype="ngModel" name="salarytype">
                <ng-option value="'S'">Staff</ng-option>
                <ng-option value="'W'">Wages</ng-option>
              </ng-select>
              <span>Select Salary Type</span>
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select [items]="showdataList" [multiple]="true" groupBy="selectedAllGroup" [selectableGroup]="true"
                [selectableGroupAsModel]="false" bindValue="item" [closeOnSelect]="false" ngModel #showdata="ngModel"
                name="showdata" [(ngModel)]="selectedshowdata">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index"></ng-template>
              </ng-select>
              <span>Show Department/Designation </span>
            </label>
          </div>
        </div>
        <div class="row">
          <div class="col-md-3">
            <button class="btn btn-primary form-group" type="submit">
              {{ 'Submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
          </div>
          <div class="col-md-3">
            @if (rows.length > 0) {
              <button class="btn btn-success form-group" type="button" (click)="download()">
                Download PDF
              </button>
            }
          </div>
        </div>
      </form>
    }
  </div>
</div>

@if (rows.length > 0 && permissionview.length != 0) {
  <div class="row">
    <div class="col-12 data-table-rows" style="width: 100%">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="'auto'" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Sr No." [flexGrow]="1.2" [width]="80">
          <ng-template ngx-datatable-cell-template let-rowIndex="rowIndex" let-row="row">
            {{ filterData.limit * (filterData.page - 1) + rowIndex + 1 }}
          </ng-template>
        </ngx-datatable-column>
        @for (column of resultColumns; track column; let i = $index) {
          <ngx-datatable-column name="{{ column.name }}"
          prop="{{ column.prop }}" [flexGrow]="column.flexGrow" [width]="column.minWidth"></ngx-datatable-column>
        }
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>

<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
