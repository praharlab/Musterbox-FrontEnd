<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>

<app-list-page-header name="Office Expense Report" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
(itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"></app-list-page-header>
<div class="card">
  <div class="card-body">
    <form #filterForm="ngForm" novalidate>
      <div class="row mt-4">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel required #company="ngModel" name="company"
              (change)="selectcompany($event)" [(ngModel)]="filterData.companyMasterID">
              @for (company of allCompanies; track company) {
                <ng-option [value]="company.companyMasterID">
                  {{ company.companyName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Company *</span>
            @if (!company.valid && filterForm.submitted) {
              <div class="invalid-tooltip">
                Company is required!
              </div>
            }
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select [items]="allBranches" bindLabel="branchName" (ngModelChange)="selectBranch($event)"
              [selectableGroupAsModel]="false" bindValue="branchMasterID" [closeOnSelect]="false" ngModel
              #branch="ngModel" name="branch" placeholder="Choose your option" [(ngModel)]="filterData.branchMasterID">
              <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                  [ngModelOptions]="{ standalone: true }" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #site="ngModel" name="site" [(ngModel)]="filterData.siteID">
                @for (site of allSites; track site) {
                  <ng-option [value]="site.siteID">
                    {{ site.siteName }}
                  </ng-option>
                }
              </ng-select>
              <span>Sites</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="date" placeholder="" ngModel #fromDate="ngModel"
                name="fromDate" required [(ngModel)]="filterData.fromDate"/>
                <span>From Date *</span>
                @if (!fromDate.valid && filterForm.submitted) {
                  <div class="invalid-tooltip">
                    From Date is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" placeholder="" ngModel #toDate="ngModel" name="toDate"
                  required [(ngModel)]="filterData.toDate"/>
                  <span>To Date *</span>
                  @if (!toDate.valid && filterForm.submitted) {
                    <div class="invalid-tooltip">
                      To Date is required!
                    </div>
                  }
                </label>
              </div>
            </div>
            <div>
              <button class="btn btn-primary" type="button" (click)="onSubmit()">Submit</button>
              <button class="btn btn-danger ml-2" type="button" (click)="clear()">Clear</button>
              @if (rows?.length > 0) {
                <button class="btn btn-success ml-2" type="button" (click)="export()">Export</button>
              }
            </div>
          </form>
        </div>
      </div>

      @if (rows && permissionview.length > 0) {
        <div class="row mt-4">
          <div class="col-12 mb-4 data-table-rows">
            <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
              [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
              (page)="onChange($event)">
              <ngx-datatable-column name="Branch Name" prop="branch" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Site Name" prop="site" [flexGrow]="1.2"
              [width]="150"></ngx-datatable-column>
              <ngx-datatable-column name="Expense Date" prop="expense_date" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Office Expense Category" prop="officeExpenseCategory" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Office Expense Head" prop="officeExpenseHead" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Expense Amount" prop="expenseAmount" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Description" prop="description" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              <ngx-datatable-column name="Status" prop="authorizationStatus" [flexGrow]="1.2" [width]="150">
                <ng-template let-row="row" ngx-datatable-cell-template>
                  @if (row?.authorizationStatus == 3) {
                    <button class="btn btn-outline-success btn-xs">
                      Approved
                    </button>
                  }
                  @if (row?.authorizationStatus == 4) {
                    <button class="btn btn-outline-danger btn-xs">
                      Rejected
                    </button>
                  }
                  @if (
                    row?.authorizationStatus == 0 ||
                    row?.authorizationStatus == 1 ||
                    row?.authorizationStatus == 2
                    ) {
                    <button class="btn btn-outline-warning btn-xs">
                      Pending
                    </button>
                  }
                </ng-template>
              </ngx-datatable-column>
              <ngx-datatable-column name="Applied By" prop="appliedBy" [flexGrow]="1.2" [width]="150">
              </ngx-datatable-column>
              @if (true) {
                <ngx-datatable-footer>
                  <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                    let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                    <div class="w-100 d-flex justify-content-center">
                      <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                        [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                        [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                      [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
                    </div>
                  </ng-template>
                </ngx-datatable-footer>
              }
            </ngx-datatable>
          </div>
        </div>
      }

      <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-left"></i>
      </ng-template>
      <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left"></i>
      </ng-template>
