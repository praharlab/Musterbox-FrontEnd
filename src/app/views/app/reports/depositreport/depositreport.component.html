<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Deposit Report" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showSearch]="false"
[itemOptionsPerPage]="itemOptionsPerPage" [showItemsPerPage]="rows.length != 0"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()" (init)="init($event)" (emitUsers)="emitUsers($event)" [showRequiredFields]="showRequiredFields">
  </app-common-filter>
}
@if (rows && rows.length != 0) {
  <div class="col-12 mb-4 data-table-rows">
    <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
      [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
      (page)="onChange($event)">
      <ngx-datatable-column name="Employee Code" prop="EmployeeCode" [flexGrow]="1.2"
      [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Name" prop="EmployeeName" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Designation" prop="Designation" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Department" prop="Department" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Branch" prop="Branch" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Deposit Category" prop="Deposit Category Name" [flexGrow]="1.2"
      [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Date" prop="Deposit Date" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Amount" prop="Deposit Amount" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Description" prop="Deposit Description" [flexGrow]="1.2"
      [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Received As" prop="Deposit Received As" [flexGrow]="1.2"
      [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Refund Date" prop="Refund Date" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Refund Remarks" prop="Refund Remarks" [flexGrow]="1.2"
      [width]="250"></ngx-datatable-column>
      <ngx-datatable-column name="Refund Mode" prop="Refund Mode" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
      @if (true) {
        <ngx-datatable-footer>
          <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
            let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
            <div class="w-100 d-flex justify-content-center">
              <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
              [customPreviousTemplate]="prevTemplate"></pagination>
            </div>
          </ng-template>
        </ngx-datatable-footer>
      }
    </ngx-datatable>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>


<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
