<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Nda Report" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showSearch]="false"
[showItemsPerPage]="rows.length != 0"></app-list-page-header>
@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()" (init)="init($event)" (emitUsers)="emitUsers($event)" [showRequiredFields]="showRequiredFields">
  </app-common-filter>
}
@if (rows) {
  <div class="row">
    @if (rows && rows.length != 0) {
      <div class="col-12 mb-4 data-table-rows">
        <ngx-datatable [columnMode]="'force'" [headerHeight]="50" [footerHeight]="50" [rowHeight]="50" [rows]="rows"
          [limit]="filterData.limit" [externalPaging]="true" [scrollbarH]="true" [rowHeight]="50" [footerHeight]="100"
          [columnMode]="'force'" [count]="page.totalCount" [offset]="page.offset" (page)="onChange($event)">
          <ngx-datatable-column name="Sr. No" prop="srlNo" [flexGrow]="1.2" [width]="50" value="1">
            <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
              {{ filterData.limit * (filterData.page - 1) + rowIndex + 1 }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Employee Code" prop="EmployeeCode" [flexGrow]="1.2" [width]="250"
          value="1"></ngx-datatable-column>
          <ngx-datatable-column name="Name" prop="EmplyoeeName" [flexGrow]="1.2" [width]="250"
          value="1"></ngx-datatable-column>
          <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="250" value="1"></ngx-datatable-column>
          <ngx-datatable-column name="Nda Name" prop="NDAName" [flexGrow]="1.2" [width]="150"
          value="1"></ngx-datatable-column>
          <ngx-datatable-column name="Given Date" prop="GivenDate" [flexGrow]="1.2" [width]="150" value="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.GivenDate | date: 'shortDate' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Category" prop="Category" [flexGrow]="1.2" [width]="150"
          value="1"></ngx-datatable-column>
          <ngx-datatable-column name="Description" prop="Description" [flexGrow]="1.2" [width]="200"
          value="1"></ngx-datatable-column>
          @if (true) {
            <ngx-datatable-footer>
              <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                <div class="w-100 d-flex justify-content-center">
                  <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                    [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                    [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"></pagination>
                </div>
              </ng-template>
            </ngx-datatable-footer>
          }
        </ngx-datatable>
      </div>
    }
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
