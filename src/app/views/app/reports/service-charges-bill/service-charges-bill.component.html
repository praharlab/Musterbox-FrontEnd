<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
<app-list-page-header name="Service Charges Bill" [showOrderBy]="false" [showDisplayMode]="false"
[showSearch]="false" [showItemsPerPage]="false"></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #cid="ngModel" (change)="selectcompany($event)"
                name="cid" required>
                @for (data of company; track data) {
                  <ng-option [value]="data.companyMasterID">
                    {{ data.companyName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Company *</span>
              @if (!cid.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  Company is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <input class="form-control" type="month" required ngModel #YearMM="ngModel" name="YearMM" required />
              <span>YearMonth *</span>
              @if (!YearMM.valid && datefilter.submitted) {
                <div class="invalid-tooltip">
                  YearMonth is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-3">
            <label class="form-group has-float-label">
              <ng-select [items]="allContractor" [multiple]="true" bindLabel="contractorName" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="contractorId" [closeOnSelect]="false"
                ngModel #contractor="ngModel" [(ngModel)]="selectedContractor" name="contractor" required>
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                    [ngModelOptions]="{standalone: true}" />
                    Select All
                  </ng-template>
                </ng-select>
                <span>Select Contractor *</span>
                @if (!contractor.valid && datefilter.submitted) {
                  <div class="invalid-tooltip">
                    Contractor is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-3">
              <button class="btn btn-success form-group" type="submit">
                {{ 'Export PDF' | translate }}
              </button>
              &nbsp;&nbsp;
              <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
            </div>
          </div>
        </form>
      }
    </div>
  </div>
