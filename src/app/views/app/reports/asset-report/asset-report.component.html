<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Asset Report" [showOrderBy]="false" [showSearch]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (export)="download()" (clearData)="clear()"
    (getCompany)="getCompany($event)" [showRequiredFields]="showRequiredFields" (emitUsers)="allUsers($event)"
    (init)="allUsers($event)">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select [items]="allasset" [multiple]="true" bindLabel="assetCategory" groupBy="selectedAllGroup"
          [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="assetCategoryID" [closeOnSelect]="false"
          ngModel #assetcat="ngModel" name="assetcat" [(ngModel)]="selectedAssetCategory">
          <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
            <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall" />
            Select All
          </ng-template>
        </ng-select>
        <span>Select Asset Category</span>
      </label>
    </div>
  </app-common-filter>
}
@if (rows && rows.length > 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
        [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
        (page)="onChange($event)">
        <ngx-datatable-column name="Sr.No" prop="srlNo" [flexGrow]="1.2" [width]="100" value="1">
          <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
            {{ filterData.limit * (filterData.page - 1) + rowIndex + 1 }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Employee Code" prop="Employee Code" [flexGrow]="1.2"
        [width]="350"></ngx-datatable-column>
        <ngx-datatable-column name="Name" prop="Employee Name" [flexGrow]="1.2" [width]="350"></ngx-datatable-column>
        <ngx-datatable-column name="Number" prop="Number" [flexGrow]="1.2" [width]="350"></ngx-datatable-column>
        <ngx-datatable-column name="Asset Category" prop="Asset Category" [flexGrow]="1.2"
        [width]="250"></ngx-datatable-column>
        <ngx-datatable-column name="Asset Name" prop="Asset Name" [flexGrow]="1.2" [width]="300"></ngx-datatable-column>
        <ngx-datatable-column name="Asset Serail No." prop="Asset Serial No" [flexGrow]="1.2"
        [width]="350"></ngx-datatable-column>
        <ngx-datatable-column name="Description" prop="Asset Description" [flexGrow]="1.2"
        [width]="250"></ngx-datatable-column>
        <ngx-datatable-column name="Assign Date" prop="Asset Asign Date" [flexGrow]="1.2"
        [width]="250"></ngx-datatable-column>
        <ngx-datatable-column name="Return Date" prop="Asset Return Date" [flexGrow]="1.2"
        [width]="250"></ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>
