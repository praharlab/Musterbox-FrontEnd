<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>

<app-list-page-header name="Leave Balance Report" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
[showItemsPerPage]="false"></app-list-page-header>
@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (getPdf)="onClickDownloadPdf()" (clearData)="clear()" [multiUser]="false">
    <div class="col-md-4">
      <label class="form-group has-float-label">
        <ng-select [items]="yearDropDownData" [multiple]="true" bindLabel="year" groupBy="selectedAllGroup"
          [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="item" [closeOnSelect]="false" ngModel
          #fromdate="ngModel" name="fromdate" required>
          <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
            <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
            Select All
          </ng-template>
        </ng-select>
        <span>Select Year *</span>
        @if (!fromdate.valid && commonFilter?.filterForm?.submitted) {
          <div class="invalid-tooltip">
            Year is required!
          </div>
        }
      </label>
    </div>
  </app-common-filter>
}
<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>


@if (leaveBalanceData) {
  <div class="d-flex justify-content-center mt-4">
    <pdf-viewer [src]="leaveBalanceData" [rotation]="0" [original-size]="false" [show-all]="true" [fit-to-page]="false" [zoom]="1"
      [zoom-scale]="'page-width'" [stick-to-page]="false" [render-text]="true" [external-link-target]="'blank'"
    [autoresize]="true" [show-borders]="false" style="width: 80%; height: 1000px"></pdf-viewer>
  </div>
}
