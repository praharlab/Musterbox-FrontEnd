<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Bank Statement Report" [showOrderBy]="false" [showDisplayMode]="false" [showSearch]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>

<div class="card">
  <div class="card-body">
    <form #bankFilter="ngForm" novalidate>
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #company="ngModel" name="company"
              (change)="selectcompany($event)" [(ngModel)]="company_id" required>
              @for (company1 of company1; track company1) {
                <ng-option [value]="company1.companyMasterID">
                  {{ company1.companyName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Company *</span>
            @if (!company.valid && bankFilter.submitted) {
              <div class="invalid-tooltip">
                Company is required!
              </div>
            }
          </label>
        </div>
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select [items]="allbranch" [multiple]="true" bindLabel="branchName" groupBy="selectedAllGroup"
              [selectableGroup]="true" [selectableGroupAsModel]="false" bindValue="branchMasterID"
              [closeOnSelect]="false" ngModel #branch="ngModel" name="branch" placeholder="Choose your option">
              <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected"
                  [ngModelOptions]="{ standalone: true }" />
                  Select All
                </ng-template>
              </ng-select>
              <span>Select Branch</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input class="form-control" type="month" ngModel #monthYear="ngModel" required name="monthYear" />
              <span>Select Month *</span>
              @if (!monthYear.valid && bankFilter.submitted) {
                <div class="invalid-tooltip">
                  Month is required!
                </div>
              }
            </label>
          </div>

          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #bankMasterID="ngModel" name="bankMasterID"
                (change)="onChangeBank($event)">
                @for (bankdata of bankdata; track bankdata; let i = $index) {
                  <ng-option [value]="bankdata.bankMasterID">
                    {{ bankdata.bankName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select Bank</span>
            </label>
          </div>

          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="selectedFieldsList" [multiple]="true" groupBy="selectedAllGroup"
                [selectableGroup]="true" [selectableGroupAsModel]="false" [closeOnSelect]="false" ngModel
                [disabled]="isDisabled" #fields="ngModel" [(ngModel)]="selectedFields" name="fields"
              [required]="!isDisabled"></ng-select>
              <span>Select Fields *</span>
              @if (!fields.valid && bankFilter.submitted && !isDisabled) {
                <div class="invalid-tooltip">
                  Fields is required!
                </div>
              }
            </label>
          </div>

          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select placeholder="Choose your option" ngModel #paymentStatus="ngModel" name="paymentStatus">
                <ng-option value="paid">
                  Paid
                </ng-option>
                <ng-option value="unpaid">
                  Un-Paid
                </ng-option>
              </ng-select>
              <span>Select Payment Status</span>
            </label>
          </div>

          <div class="col-md-12">
            <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
              {{ 'forms.submit' | translate }}
            </button>
            &nbsp;&nbsp;
            <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
            <span> &nbsp;&nbsp; </span>
            @if (rows.length != 0) {
              <button class="btn btn-success form-group" (click)="onDownlad()" type="button">
                Export Excel
              </button>
            }
          </div>
        </div>
      </form>
    </div>
  </div>

  @if (rows) {
    <div class="row">
      @if (resultColumns && resultColumns.length != 0) {
        <div class="col-12 mb-4 data-table-rows">
          <ngx-datatable [rows]="rows" [scrollbarH]="true" [rowHeight]="50" [footerHeight]="100" [columnMode]="'force'"
            [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
            (page)="onChange($event)">
            @for (column of resultColumns; track column; let i = $index) {
              <ngx-datatable-column name="{{ column.name }}"
              prop="{{ column.prop }}" [flexGrow]="column.flexGrow" [width]="column.minWidth"></ngx-datatable-column>
            }

          @if (true) {
            <ngx-datatable-footer>
              <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                <div class="w-100 d-flex justify-content-center">
                  <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                    [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                    [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"></pagination>
                </div>
              </ng-template>
            </ngx-datatable-footer>
          }
        </ngx-datatable>
      </div>
    }
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
