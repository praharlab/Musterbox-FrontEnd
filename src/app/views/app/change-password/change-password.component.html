<style>
  .password-toggle-icon {
  position: absolute;
  top: 47%;
  right: 10px;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999; /* Adjust the color as needed */
}
</style>

<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (companydata) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Change Password</h5>
      <form #addcomp="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="{{ showPassword ? 'text' : 'password' }}"
                placeholder=""
                required
                ngModel
                #oldPassword="ngModel"
                name="oldPassword"
                />
                <span>Old Password *</span>
                @if (!oldPassword.valid && addcomp.submitted) {
                  <div class="invalid-tooltip">
                    Old Password is required!
                  </div>
                }
                <div class="password-toggle-icon" (click)="togglePasswordVisibility()">
                  @if (showPassword == true) {
                    <!-- <span class="glyph-icon simple-icon-close"></span> -->
                    <img
                      src="../../../../../assets/eyeclosed.png"
                      alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                      />
                    }
                    @if (showPassword == false) {
                      <img
                        src="../../../../../assets/eyeopen.png"
                        alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                        />
                      }
                    </div>
                  </label>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="{{ showPassword1 ? 'text' : 'password' }}"
                      placeholder=""
                      required
                      ngModel
                      #newPassword="ngModel"
                      name="newPassword"
                      />
                      <span>New Password *</span>
                      @if (!newPassword.valid && addcomp.submitted) {
                        <div class="invalid-tooltip">
                          New Password is required!
                        </div>
                      }
                      <div class="password-toggle-icon" (click)="togglePasswordVisibility1()">
                        @if (showPassword1 == true) {
                          <!-- <span class="glyph-icon simple-icon-close"></span> -->
                          <img
                            src="../../../../../assets/eyeclosed.png"
                            alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                            />
                          }
                          @if (showPassword1 == false) {
                            <img
                              src="../../../../../assets/eyeopen.png"
                              alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                              />
                            }
                          </div>
                        </label>
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-md-6">
                        <label class="form-group has-float-label">
                          <input
                            class="form-control"
                            type="{{ showPassword2 ? 'text' : 'password' }}"
                            placeholder=""
                            required
                            ngModel
                            #conformPassword="ngModel"
                            name="conformPassword"
                            />
                            <span>Confirm Password *</span>
                            @if (!conformPassword.valid && addcomp.submitted) {
                              <div class="invalid-tooltip">
                                Confirm Password is required!
                              </div>
                            }
                            <div class="password-toggle-icon" (click)="togglePasswordVisibility2()">
                              @if (showPassword2 == true) {
                                <!-- <span class="glyph-icon simple-icon-close"></span> -->
                                <img
                                  src="../../../../../assets/eyeclosed.png"
                                  alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                                  />
                                }
                                @if (showPassword2 == false) {
                                  <img
                                    src="../../../../../assets/eyeopen.png"
                                    alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                                    />
                                  }
                                </div>
                              </label>
                            </div>
                          </div>
                          <button class="btn btn-primary" type="submit">
                            {{ 'forms.submit' | translate }}
                          </button>
                        </form>
                      </div>
                    </div>
                  }

                  <simple-notifications
                    [options]="{ position: ['top', 'center'], maxStack: 1 }"
                  ></simple-notifications>
