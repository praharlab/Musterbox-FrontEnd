<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Form</h5>

    <form #addform="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6">
          <label class="form-group has-float-label">
            <input
              class="form-control"
              type="text"
              required
              ngModel
              #formName="ngModel"
              name="formName"
              />
              <span>Form Name *</span>
              @if (!formName.valid && addform.submitted) {
                <div class="invalid-tooltip">
                  Form Name is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <textarea
                class="form-control"
                type="text"
                ngModel
                #description="ngModel"
                name="description"
              ></textarea>
              <span>Description</span>
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                placeholder="Choose your option"
                ngModel
                #parentFormMasterID="ngModel"
                name="parentFormMasterID"
                >
                @for (parentformdata of parentformdata; track parentformdata) {
                  <ng-option
                    [value]="parentformdata.formMasterID"
                    >
                    {{ parentformdata.formName }}
                  </ng-option>
                }
              </ng-select>
              <span>Select ParentForm</span>
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <ng-select
                [items]="operationdata"
                [multiple]="true"
                bindLabel="operationName"
                [selectableGroupAsModel]="false"
                bindValue="operationID"
                [closeOnSelect]="false"
                ngModel
                #operation="ngModel"
                name="operation"
                required
              ></ng-select>
              <span>Select Operation *</span>
              @if (!operation.valid && addform.submitted) {
                <div class="invalid-tooltip">
                  Operation is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" required ngModel #icon="ngModel" name="icon" />
              <span>Icon *</span>
              @if (!icon.valid && addform.submitted) {
                <div class="invalid-tooltip">
                  Icon is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input class="form-control" type="text" required ngModel #path="ngModel" name="path" />
              <span>Path *</span>
              @if (!path.valid && addform.submitted) {
                <div class="invalid-tooltip">
                  Path is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-6">
            <span><b>Defult Rights *</b></span>
            &nbsp;&nbsp;
            <input
              type="radio"
              name="defaultRight"
              value="true"
              ngModel
              #defaultRight="ngModel"
              style="margin-right: 1%"
              required
              />
              <label for="true" style="margin-right: 1%">Yes</label>
              <input
                type="radio"
                name="defaultRight"
                value="false"
                ngModel
                #defaultRight="ngModel"
                style="margin-right: 1%"
                required
                />
                <label for="false">No</label>
                @if (!defaultRight.valid && addform.submitted) {
                  <div class="invalid-tooltip">
                    Defult Rights is required!
                  </div>
                }
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="text"
                  required
                  ngModel
                  #menuName="ngModel"
                  name="menuName"
                  />
                  <span>Menu Name *</span>
                  @if (!menuName.valid && addform.submitted) {
                    <div class="invalid-tooltip">
                      Menu Name is required!
                    </div>
                  }
                </label>
              </div>
              <br />
              <div class="col-md-12">
                <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                <button
                  class="btn btn-danger btn-shadow mt-4"
                  [routerLink]="adminRoot + '/superadminmenus/form'"
                  style="margin-left: 2%"
                  >
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>

        <simple-notifications
          [options]="{ position: ['top', 'center'], maxStack: 1 }"
        ></simple-notifications>
