<div style="text-align: right"></div>
<div class="row">
  @for (item of rows; track item) {
    <div class="col-12 col-sm-12 col-lg-6 col-xl-4">
      <div class="card d-flex flex-row mb-4">
        <a class="d-flex" href="javascript:;"></a>
        <div class="d-flex flex-grow-1 min-width-zero">
          <div
            class="card-body pl-0 align-self-center d-flex flex-column flex-lg-row justify-content-between min-width-zero"
            style="margin-left: 5%"
            >
            <div class="min-width-zero">
              <a href="javascript:;">
                <p class="list-item-heading mb-1 truncate">{{ item.deviceType | uppercase }}</p>
                <p class="text-muted mb-0 text-small">{{ item.appVersion }}</p>
              </a>
            </div>
            <div style="margin-top: 14px">
              <a class="btn btn-outline-primary btn-xs" (click)="lgModal1.show(); edit(item)">EDIT</a>
              <br />
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>

<div
  bsModal
  #lgModal1="bs-modal"
  class="modal fade"
  tabindex="-1"
  role="dialog"
  aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}"
  >
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title pull-left">Edit App Version</h4>
        <button
          type="button"
          class="btn-close close pull-right"
          (click)="lgModal1.hide()"
          aria-label="Close"
          >
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        @if (editbyid) {
          <form #editversion="ngForm" novalidate (ngSubmit)="onSubmit1()">
            <div class="row">
              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <input
                    class="form-control"
                    type="text"
                    ngModel
                    #appVersion="ngModel"
                    name="appVersion"
                    [(ngModel)]="editbyid.appVersion"
                    />
                    <span>App Version</span>
                  </label>
                </div>
              </div>
              <button class="btn btn-primary" type="submit">{{ 'forms.submit' | translate }}</button>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
  <simple-notifications
    [options]="{ position: ['top', 'center'], maxStack: 1 }"
  ></simple-notifications>
