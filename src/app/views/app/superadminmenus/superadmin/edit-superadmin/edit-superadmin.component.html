<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Edit User</h5>

    <form #editsuperadmin="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <input
              class="form-control"
              type="text"
              required
              ngModel
              #firstNAme="ngModel"
              [(ngModel)]="companydata.firstName"
              name="firstNAme"
              />
              <span>First Name *</span>
              @if (!firstNAme.valid && editsuperadmin.submitted) {
                <div class="invalid-tooltip">
                  First Name is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #middleNAme="ngModel"
                [(ngModel)]="companydata.middleName"
                name="middleNAme"
                />
                <span>Middle Name *</span>
                @if (!middleNAme.valid && editsuperadmin.submitted) {
                  <div class="invalid-tooltip">
                    Middle Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="text"
                  required
                  ngModel
                  #lastNAme="ngModel"
                  [(ngModel)]="companydata.lastName"
                  name="lastNAme"
                  />
                  <span>Last Name *</span>
                  @if (!lastNAme.valid && editsuperadmin.submitted) {
                    <div class="invalid-tooltip">
                      Last Name is required!
                    </div>
                  }
                </label>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <label class="form-group has-float-label">
                  <input
                    class="form-control"
                    type="text"
                    required
                    ngModel
                    #contactNumber="ngModel"
                    [(ngModel)]="companydata.userNumber"
                    name="contactNumber"
                    />
                    <span>User Number *</span>
                    @if (!contactNumber.valid && editsuperadmin.submitted) {
                      <div class="invalid-tooltip">
                        Contact Number is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-6">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="email"
                      required
                      email
                      ngModel
                      #email="ngModel"
                      [(ngModel)]="companydata.email"
                      name="email"
                      />
                      <span>User Email *</span>
                      @if (!email.valid && editsuperadmin.submitted) {
                        <div class="invalid-tooltip">
                          Email is required!
                        </div>
                      }
                      @if (email?.errors?.email && editsuperadmin.submitted) {
                        <div class="invalid-tooltip">
                          Email must be a valid address!
                        </div>
                      }
                    </label>
                  </div>
                </div>

                <div class="col-md-12">
                  <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                  <button
                    class="btn btn-danger btn-shadow mt-4"
                    [routerLink]="adminRoot + '/superadminmenus/superadmin'"
                    style="margin-left: 2%"
                    >
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          </div>

          <simple-notifications
            [options]="{ position: ['top', 'center'], maxStack: 1 }"
          ></simple-notifications>
