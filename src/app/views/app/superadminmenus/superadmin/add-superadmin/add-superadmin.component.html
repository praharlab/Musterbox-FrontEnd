<style>
  .password-toggle-icon {
  position: absolute;
  top: 47%;
  right: 10px;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999; /* Adjust the color as needed */
}
</style>

<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="card mb-4">
  <div class="card-body">
    <h5 class="mb-4">Add Super Admin</h5>

    <form #addsuperadmin="ngForm" novalidate (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <input
              class="form-control"
              type="text"
              required
              ngModel
              #firstNAme="ngModel"
              name="firstNAme"
              />
              <span>First Name *</span>
              @if (!firstNAme.valid && addsuperadmin.submitted) {
                <div class="invalid-tooltip">
                  First Name is required!
                </div>
              }
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #middleNAme="ngModel"
                name="middleNAme"
                />
                <span>Middle Name *</span>
                @if (!middleNAme.valid && addsuperadmin.submitted) {
                  <div class="invalid-tooltip">
                    Middle Name is required!
                  </div>
                }
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="text"
                  required
                  ngModel
                  #lastNAme="ngModel"
                  name="lastNAme"
                  />
                  <span>Last Name *</span>
                  @if (!lastNAme.valid && addsuperadmin.submitted) {
                    <div class="invalid-tooltip">
                      Last Name is required!
                    </div>
                  }
                </label>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input
                    class="form-control"
                    type="text"
                    required
                    ngModel
                    #contactNumber="ngModel"
                    name="contactNumber"
                    />
                    <span>Mobile Number *</span>
                    @if (!contactNumber.valid && addsuperadmin.submitted) {
                      <div class="invalid-tooltip">
                        Contact Number is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input
                      class="form-control"
                      type="email"
                      required
                      email
                      ngModel
                      #email="ngModel"
                      name="email"
                      />
                      <span>Email *</span>
                      @if (!email.valid && addsuperadmin.submitted) {
                        <div class="invalid-tooltip">
                          Email is required!
                        </div>
                      }
                      @if (email?.errors?.email && addsuperadmin.submitted) {
                        <div class="invalid-tooltip">
                          Email must be a valid address!
                        </div>
                      }
                    </label>
                  </div>

                  <div class="col-md-4">
                    <label class="form-group has-float-label">
                      <input
                        class="form-control"
                        type="{{ showPassword ? 'text' : 'password' }}"
                        placeholder=""
                        required
                        ngModel
                        #password="ngModel"
                        name="password"
                        />
                        <span>Password *</span>
                        @if (!password.valid && addsuperadmin.submitted) {
                          <div class="invalid-tooltip">
                            Password is required!
                          </div>
                        }
                        <div class="password-toggle-icon" (click)="togglePasswordVisibility()">
                          @if (showPassword == true) {
                            <!-- <span class="glyph-icon simple-icon-close"></span> -->
                            <img
                              src="../../../../../assets/eyeclosed.png"
                              alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                              />
                            }
                            @if (showPassword == false) {
                              <img
                                src="../../../../../assets/eyeopen.png"
                                alt=""
                  style="
                    position: absolute;
                    top: 47%;
                    right: 10px;
                    transform: translateY(-50%);
                    cursor: pointer;
                    width: 22px;
                    color: #999;
                  "
                                />
                              }
                            </div>
                          </label>

                          <!--
                          <label class="form-group has-float-label">
                            <input class="form-control" type="password" required ngModel #password="ngModel"  name="password"/>
                            <span>Password *</span>
                            <div *ngIf="!password.valid && addsuperadmin.submitted" class="invalid-tooltip">Password is required!</div>
                          </label> -->
                        </div>
                      </div>

                      <div class="col-md-12">
                        <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
                        <button
                          class="btn btn-danger btn-shadow mt-4"
                          [routerLink]="adminRoot + '/superadminmenus/superadmin'"
                          style="margin-left: 2%"
                          >
                          Cancel
                        </button>
                      </div>
                    </form>
                  </div>
                </div>

                <simple-notifications
                  [options]="{ position: ['top', 'center'], maxStack: 1 }"
                ></simple-notifications>
