<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header
  [showOrderBy]="false"
  [showDisplayMode]="false"
  [searchValue]="filterData.searchQuery"
  (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)"
  [itemsPerPage]="filterData.limit"
  [itemOptionsPerPage]="itemOptionsPerPage"
  name="Lead"
></app-list-page-header>

<div class="card mb-4">
  <div class="card-body">
    @if (permissionview.length != 0) {
      <form #datefilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select
                ngModel
                #registrationStatus="ngModel"
                [(ngModel)]="filterData.registrationStatus"
                name="registrationStatus"
                >
                <ng-option value="Pending">PENDING</ng-option>
                <ng-option value="Registered">REGISTERED</ng-option>
              </ng-select>
              <span>Status</span>
            </label>
          </div>
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="date"
                ngModel
                [(ngModel)]="filterData.startdate"
                #startdate="ngModel"
                name="startdate"
                (change)="selectfrom()"
                />
                <span>From Date</span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input
                  class="form-control"
                  type="date"
                  ngModel
                  [(ngModel)]="filterData.enddate"
                  #enddate="ngModel"
                  name="enddate"
                  />
                  <span>To Date</span>
                </label>
              </div>
              <div class="col-md-5">
                <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
                  {{ 'forms.submit' | translate }}
                </button>
                &nbsp;&nbsp;
                <button class="btn btn-primary form-group" type="button" (click)="clear()">Clear</button>
                <span> &nbsp;&nbsp; </span>
                @if (rows.length > 0) {
                  <button class="btn btn-info form-group" (click)="downloadFile()">
                    Export
                  </button>
                }
              </div>
            </div>
          </form>
        }
      </div>
    </div>

    @if (rows && permissionview.length != 0) {
      <div class="row">
        <div class="col-12 mb-4 data-table-rows">
          <ngx-datatable
            [scrollbarH]="true"
            [rowHeight]="50"
            [rows]="rows"
            [footerHeight]="100"
            [columnMode]="'force'"
            [limit]="filterData.limit"
            [externalPaging]="true"
            [count]="page.totalCount"
            [offset]="page.offset"
            (page)="onChange($event)"
            >
            <ngx-datatable-column name="Status" [width]="120">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <button
                  class="btn btn-xs"
            [ngClass]="{
              'btn-outline-warning': row.registrationStatus == 'Pending',
              'btn-outline-success': row.registrationStatus == 'Registered'
            }"
                  >
                  {{ row.registrationStatus == 'Registered' ? 'Registered' : row.registrationStatus }}
                </button>
              </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column
              name="Company Name"
              prop="leadCompanyName"
              [flexGrow]="1.2"
              [width]="150"
            ></ngx-datatable-column>
            <ngx-datatable-column
              name="Company Address"
              prop="leadCompanyAddress"
              [flexGrow]="1.2"
              [width]="150"
            ></ngx-datatable-column>
            <ngx-datatable-column
              name="Contact Person Name"
              prop="contactPersonName"
              [flexGrow]="1.2"
              [width]="150"
            ></ngx-datatable-column>
            <ngx-datatable-column
              name="Contact Person Number"
              prop="contactPersonMobileNo"
              [flexGrow]="1.2"
              [width]="150"
            ></ngx-datatable-column>
            <ngx-datatable-column
              name="Contact Person Email"
              prop="contactPersonEmail"
              [flexGrow]="1.2"
              [width]="150"
            ></ngx-datatable-column>
            <ngx-datatable-column name="Created Date" prop="createdAt" [flexGrow]="1.2" [width]="130">
              <ng-template let-row="row" ngx-datatable-cell-template>
                <div class="text-center">
                  {{ row.createdAt | date : 'dd-MM-yyyy' }}
                  <br />
                  {{ row.createdAt | date : 'h:mm a' }}
                </div>
              </ng-template>
            </ngx-datatable-column>
            @if (true) {
              <ngx-datatable-footer>
                <ng-template
                  ngx-datatable-footer-template
                  let-rowCount="rowCount"
                  let-pageSize="pageSize"
                  let-selectedCount="selectedCount"
                  let-curPage="curPage"
                  let-offset="offset"
                  let-limit="limit"
                  >
                  <div class="w-100 d-flex justify-content-center">
                    <pagination
                      [totalItems]="rowCount"
                      [boundaryLinks]="true"
                      [customFirstTemplate]="firstTemplate"
                      [customLastTemplate]="lastTemplate"
                      [itemsPerPage]="filterData.limit"
                      [maxSize]="5"
                      [(ngModel)]="currentPage"
                      (pageChanged)="table.onFooterPage($event)"
                      [customNextTemplate]="nextTemplate"
                      [customPreviousTemplate]="prevTemplate"
                    ></pagination>
                  </div>
                </ng-template>
              </ngx-datatable-footer>
            }
          </ngx-datatable>
        </div>
      </div>
    }

    <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
      <i class="simple-icon-arrow-left"></i>
    </ng-template>
    <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
      <i class="simple-icon-arrow-right"></i>
    </ng-template>
    <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-right"></i>
    </ng-template>
    <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
      <i class="simple-icon-arrow-left"></i>
    </ng-template>

    <simple-notifications
      [options]="{ position: ['top', 'center'], maxStack: 1 }"
    ></simple-notifications>
