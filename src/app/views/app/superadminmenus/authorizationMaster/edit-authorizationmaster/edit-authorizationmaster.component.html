<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (authdata) {
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="mb-4">Edit Authorization Master</h5>
      <form #editauthdata="ngForm" novalidate (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <label class="form-group has-float-label">
              <input
                class="form-control"
                type="text"
                required
                ngModel
                #authorizationMasterName="ngModel"
                [(ngModel)]="authdata.authorizationMasterName"
                name="authorizationMasterName"
                />
                <span>Authorization Master Name *</span>
                @if (!authorizationMasterName.valid && editauthdata.submitted) {
                  <div
                    class="invalid-tooltip"
                    >
                    Authorization Master Name is required!
                  </div>
                }
              </label>
            </div>
          </div>
          <div class="col-md-12">
            <button class="btn btn-primary mt-4" type="submit">{{ 'forms.submit' | translate }}</button>
            <button
              class="btn btn-danger btn-shadow mt-4"
              [routerLink]="adminRoot + '/superadminmenus/auth_master'"
              style="margin-left: 2%"
              >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  <simple-notifications
    [options]="{ position: ['top', 'center'], maxStack: 1 }"
  ></simple-notifications>
