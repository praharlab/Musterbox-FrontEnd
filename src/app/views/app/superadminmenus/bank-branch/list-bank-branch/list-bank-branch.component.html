<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Bank Branch" [showadd]="permissioncreate" [showOrderBy]="false" [showDisplayMode]="false"
  [searchValue]="filterData.searchQuery" (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit"
[itemOptionsPerPage]="itemOptionsPerPage" (addNewItem)="showAddNewModal()"></app-list-page-header>
<div class="card mb-4">
  <div class="card-body">
    <form #datefilter="ngForm" novalidate>
      <div class="row">
        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #bankMasterID="ngModel" name="bankMasterID">
              @for (bank of allBank; track bank) {
                <ng-option [value]="bank.bankMasterID  ">
                  {{ bank.bankName }}
                </ng-option>
              }
            </ng-select>
            <span>Select Bank</span>
          </label>
        </div>

        <div class="col-md-4">
          <label class="form-group has-float-label">
            <ng-select placeholder="Choose your option" ngModel #status="ngModel" name="status">
              <ng-option value="1">Active</ng-option>
              <ng-option value="0">Deactive</ng-option>
            </ng-select>
            <span>Bank Branch Status</span>
          </label>
        </div>

        <div class="col-md-12">
          <button class="btn btn-primary form-group" type="submit" (click)="onSubmit()">
            {{ 'forms.submit' | translate }}
          </button>
          &nbsp;&nbsp;
          <button class="btn btn-primary form-group ml-1" type="button" (click)="clear()">
            Clear
          </button>
          @if (rows && rows.length != 0) {
            <button class="btn btn-success form-group ml-2" type="button" (click)="download()"
              >
              Export
            </button>
          }
        </div>
      </div>
    </form>

  </div>
</div>
@if (rows && rows.length != 0) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable [scrollbarH]="scrollBarHorizontal" [rowHeight]="50" [rows]="rows" [footerHeight]="100"
        [columnMode]="'force'" [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount"
        [offset]="page.offset" (page)="onChange($event)">
        <ngx-datatable-column name="Bank Name" prop="bankMaster.bankName" [flexGrow]="1.2"
        [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Bank Branch Name" prop="bankBranchName" [flexGrow]="1.2"
        [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Bank Branch Code" prop="bankBranchCode" [flexGrow]="1.2"
        [width]="80"></ngx-datatable-column>
        <ngx-datatable-column name="Status" prop="status" [flexGrow]="1.2" [width]="30">
          <ng-template let-row="row" ngx-datatable-cell-template>
            @if (row.status == '1') {
              <button type="button" class="btn btn-success"
                (click)="alertDeactiveConfirmation(row.bankBranchID)">
                {{ 'Active' | translate }}
              </button>
            }
            {{ ' ' }}
            @if (row.status == '0') {
              <button type="button" class="btn btn-danger"
                (click)="alertActiveConfirmation(row.bankBranchID)">
                {{ 'Deactive' | translate }}
              </button>
            }
            {{ ' ' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <a (click)="navigateToEditPage(row)">
              <span tooltip="Edit Company Details." [class]="'glyph-icon simple-icon-pencil tool_tip'"
              style="padding-right: 10px; font-size: 18px"></span>
              {{ ' ' }}
            </a>
            <a (click)="alertConfirmation(row.bankBranchID)">
              <span tooltip="Delete Company Details." [class]="'glyph-icon simple-icon-trash tool_tip'"
              style="padding-right: 6px; font-size: 18px"></span>
              {{
              '
              '
              }}
            </a>
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
              let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
              <div class="w-100 d-flex justify-content-center">
                <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                  [(ngModel)]="currentPage" (pageChanged)="table.onFooterPage($event)"
                [customNextTemplate]="nextTemplate" [customPreviousTemplate]="prevTemplate"></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>

<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
