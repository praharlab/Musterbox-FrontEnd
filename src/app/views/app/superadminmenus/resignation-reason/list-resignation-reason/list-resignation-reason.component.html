<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header
  name="Resignation Reason"
  [showOrderBy]="false"
  [showadd]="permissioncreate"
  [showDisplayMode]="false"
  [searchValue]="filterData.searchQuery"
  (searchKeyUp)="updateFilter($event)"
  (itemsPerPageChange)="onLimitChange($event)"
  [itemsPerPage]="filterData.limit"
  [itemOptionsPerPage]="itemOptionsPerPage"
  (addNewItem)="showAddNewModal()"
></app-list-page-header>
@if (rows) {
  <div class="row">
    <div class="col-12 mb-4 data-table-rows">
      <ngx-datatable
        [scrollbarH]="scrollBarHorizontal"
        [rowHeight]="50"
        [rows]="rows"
        [footerHeight]="100"
        [columnMode]="'force'"
        [limit]="filterData.limit"
        [externalPaging]="true"
        [count]="page.totalCount"
        [offset]="page.offset"
        (page)="onChange($event)"
        >
        <ngx-datatable-column
          name="Reason"
          prop="reason"
          [flexGrow]="1.2"
          [width]="80"
        ></ngx-datatable-column>
        <ngx-datatable-column name="Created At" [flexGrow]="1.2" [width]="180">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.createdAt | date : 'dd-MM-yyyy' }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column name="Action" [sortable]="true" [width]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <a (click)="navigateToEditPage(row)">
              <span
                tooltip="Edit Reason Details."
                [class]="'glyph-icon simple-icon-pencil tool_tip'"
                style="padding-right: 10px; font-size: 18px"
              ></span>
              {{ ' ' }}
            </a>
            <a (click)="alertConfirmation(row.resigantionReasonID)">
              <span
                tooltip="Delete Reason Details."
                [class]="'glyph-icon simple-icon-trash tool_tip'"
                style="padding-right: 6px; font-size: 18px"
              ></span>
              {{
              '
              '
              }}
            </a>
          </ng-template>
        </ngx-datatable-column>
        @if (true) {
          <ngx-datatable-footer>
            <ng-template
              ngx-datatable-footer-template
              let-rowCount="rowCount"
              let-pageSize="pageSize"
              let-selectedCount="selectedCount"
              let-curPage="curPage"
              let-offset="offset"
              let-limit="limit"
              >
              <div class="w-100 d-flex justify-content-center">
                <pagination
                  [totalItems]="rowCount"
                  [boundaryLinks]="true"
                  [customFirstTemplate]="firstTemplate"
                  [customLastTemplate]="lastTemplate"
                  [itemsPerPage]="filterData.limit"
                  [maxSize]="5"
                  [(ngModel)]="currentPage"
                  (pageChanged)="table.onFooterPage($event)"
                  [customNextTemplate]="nextTemplate"
                  [customPreviousTemplate]="prevTemplate"
                ></pagination>
              </div>
            </ng-template>
          </ngx-datatable-footer>
        }
      </ngx-datatable>
    </div>
  </div>
}

<ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-left"></i>
</ng-template>
<ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-right"></i>
</ng-template>
<ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
  <i class="simple-icon-arrow-left"></i>
</ng-template>

<simple-notifications
  [options]="{ position: ['top', 'center'], maxStack: 1 }"
></simple-notifications>
