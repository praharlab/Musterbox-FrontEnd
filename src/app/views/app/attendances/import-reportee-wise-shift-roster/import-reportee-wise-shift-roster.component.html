<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
@if (permissionview.length != 0 && permissioncreate.length != 0) {
  <div class="card mb-4">
    <div class="card-body">
      <h4 class="mb-4">Import Shift Roster</h4>
      <form #datefilter="ngForm" novalidate>
        <div class="row">
          <div class="col-md-4">
            <label class="form-group has-float-label">
              <ng-select [items]="alluser" [multiple]="true" bindLabel="name" groupBy="selectedAllGroup"
                [selectableGroup]="true" (ngModelChange)="selectUser()" [selectableGroupAsModel]="false"
                bindValue="userMasterID" [closeOnSelect]="false" ngModel #user="ngModel" name="user"
                [(ngModel)]="selectedUser">
                <ng-template ng-optgroup-tmp let-item="item" let-item$="item$" let-index="index">
                  <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" name="selectall"
                    [ngModelOptions]="{ standalone: true }" />
                    Select All
                  </ng-template>
                </ng-select>
                <span>Select User</span>
              </label>
            </div>
            <div class="col-md-4">
              <label class="form-group has-float-label">
                <input class="form-control" type="date" ngModel [(ngModel)]="filterData.fromDate"
                  (change)="selectFromDate()" #fromDate="ngModel" name="fromDate" required />
                  <span>From Date *</span>
                  @if (!fromDate.valid && datefilter.submitted) {
                    <div class="invalid-tooltip">
                      From Date is required!
                    </div>
                  }
                </label>
              </div>
              <div class="col-md-4">
                <label class="form-group has-float-label">
                  <input class="form-control" type="date" ngModel [(ngModel)]="filterData.toDate"
                    (change)="selectTodate()" [min]="filterData.startDate" #toDate="ngModel" name="toDate"
                    required />
                    <span>To Date *</span>
                    @if (!toDate.valid && datefilter.submitted) {
                      <div class="invalid-tooltip">
                        To Date is required!
                      </div>
                    }
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="form-group has-float-label">
                    <input class="form-control" type="file" ngModel #file="ngModel" (change)="onFileChange($event)"
                      accept=".xlsx, .xls" name="file" [required]="fileRequired" />
                      <span>Import File *</span>
                      @if (!file.valid && datefilter.submitted && fileRequired) {
                        <div class="invalid-tooltip">
                          File is required!
                        </div>
                      }
                      @if (file.valid) {
                        <p>{{ fileName }}</p>
                      }
                    </label>
                  </div>
                  <div class="col-md-12">
                    <button class="btn btn-primary form-group" type="submit" (click)="validateData()">
                      {{ 'forms.submit' | translate }}
                    </button>
                    &nbsp;&nbsp;
                    <button class="btn btn-primary form-group ml-1" type="button" (click)="clear()">
                      Clear
                    </button>
                    <span> &nbsp;&nbsp; </span>
                    @if (alluser.length > 0 ) {
                      <button class="btn btn-success form-group ml-2" type="submit" (click)="download()"
                        >
                        Demo Excel
                      </button>
                    }
                  </div>
                </div>
              </form>
            </div>
          </div>
        }



        <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-left" style="margin-right: -6px"></i>
          <i class="simple-icon-arrow-left"></i>
        </ng-template>
        <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-right" style="margin-right: -6px"></i>
          <i class="simple-icon-arrow-right"></i>
        </ng-template>
        <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-right"></i>
        </ng-template>
        <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
          <i class="simple-icon-arrow-left"></i>
        </ng-template>

        <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
        <app-import-show-shift-roster-data [permissioncreate]="permissioncreate" [rows]="rows" [permissionview]="permissionview"
          [allshift]="allshift" [dateRange]="dateRange" (onSaveData)="saveData()" [remarkCount]="remarkCount"
        (onRevalidateData)="reValidateData($event)"></app-import-show-shift-roster-data>
