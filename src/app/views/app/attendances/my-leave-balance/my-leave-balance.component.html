<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<div class="row">
  <div class="col-12">
    <app-heading title="My Leave Balance"></app-heading>
    <app-breadcrumb title="My Leave Balance"></app-breadcrumb>
    <div class="separator mb-5"></div>
  </div>
</div>

@if (visible) {
  <div class="row mb-5">
    @for (item of rows; track item) {
      <div class="col-md-2">
        <div class="card">
          <div class="card-body d-flex flex-lg-column flex-md-row flex-sm-row flex-column">
            <div class="price-top-part" style="cursor: pointer">
              <i class="iconsminds-calendar-4 large-icon"></i>
              <h5 class="mb-0 font-weight-semibold color-theme-1 mb-4">
                {{ item.leaveName }} : {{ item.Balance }}
              </h5>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
}
