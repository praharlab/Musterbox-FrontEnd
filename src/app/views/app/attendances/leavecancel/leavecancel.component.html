<div style="position: relative">
  <ngx-ui-loader></ngx-ui-loader>
</div>
<app-list-page-header name="Leave Cancellation" [showOrderBy]="false" [showDisplayMode]="false"
  (itemsPerPageChange)="onLimitChange($event)" [itemsPerPage]="filterData.limit" [showSearch]="false"
[itemOptionsPerPage]="itemOptionsPerPage"></app-list-page-header>

@if (permissionview.length > 0) {
  <app-common-filter #commonFilter [hideFilters]="hideFilters" [showButtons]="showButtons" (onSubmit)="onSubmit($event)"
    (onClear)="clear()" (clearData)="clear()" [showRequiredFields]="showRequiredFields"
    (init)="init($event)" (emitUsers)="emitUsers($event)">
  </app-common-filter>
}

@if (rows) {
  <div class="row">
    @if (rows && rows.length != 0) {
      <div class="col-12 mb-4 data-table-rows">
        <ngx-datatable [scrollbarH]="true" [rowHeight]="50" [rows]="rows" [footerHeight]="100" [columnMode]="'force'"
          [limit]="filterData.limit" [externalPaging]="true" [count]="page.totalCount" [offset]="page.offset"
          (page)="onChange($event)">
          <ngx-datatable-column name="Sr. No" prop="srlNo" [flexGrow]="1.2" [width]="90" value="1">
            <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
              {{ filterData.limit * (filterData.page - 1) + rowIndex + 1 }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Name" prop="displayName" [flexGrow]="1.2" [width]="250"></ngx-datatable-column>
          <ngx-datatable-column name="Number" prop="userNumber" [flexGrow]="1.2" [width]="180"></ngx-datatable-column>
          <ngx-datatable-column name="Days" prop="days" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
          <ngx-datatable-column name="Leave Name" prop="LeaveName" [flexGrow]="1.2" [width]="120"></ngx-datatable-column>
          <ngx-datatable-column name="Date" prop="date" [flexGrow]="1.2" [width]="180">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row.date | date: 'dd-MM-yyyy' }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Sandwich Leave" prop="issandwichleave" [flexGrow]="1.2"
          [width]="180"></ngx-datatable-column>
          <ngx-datatable-column name="Action" prop="authorizationStatus" [width]="300">
            <ng-template let-row="row" ngx-datatable-cell-template>
              @if (row.authorizationStatus == '3') {
                <div style="display: flex">
                  <button type="button" class="btn btn-danger" (click)="lgModal1.show(); alertDeactiveConfirmation(row)">
                    {{ 'Cancel' | translate }}
                  </button>
                  {{ ' ' }}
                </div>
              }
            </ng-template>
          </ngx-datatable-column>
          <div bsModal #lgModal1="bs-modal" class="modal fade" tabindex="-1" role="dialog"
            aria-labelledby="dialog-sizes-name1" [config]="{backdrop: 'static', keyboard: false}">
            <div class="modal-dialog modal-lg">
              <div class="modal-content">
                <div class="modal-header">
                  <h4 class="modal-title pull-left">Cancel Leave</h4>
                  <button type="button" class="btn-close close pull-right" (click)="lgModal1.hide()" aria-label="Close"
                    #closeModal>
                    <span aria-hidden="true" class="visually-hidden">&times;</span>
                  </button>
                </div>
                @if (leavedata) {
                  <div class="modal-body">
                    <form #accept="ngForm" novalidate (ngSubmit)="cancel()">
                      <div class="row">
                        <div class="col-md-4">
                          <label class="form-group has-float-label">
                            <input class="form-control" type="text" [(ngModel)]="leavedata.displayName" #name="ngModel"
                              name="name" readonly />
                              <span>Name</span>
                            </label>
                          </div>
                          <div class="col-md-4">
                            <label class="form-group has-float-label">
                              <input class="form-control" type="text" [(ngModel)]="leaveDate" #date="ngModel" name="date"
                                readonly />
                                <span>Date</span>
                              </label>
                            </div>
                            <div class="col-md-4">
                              <label class="form-group has-float-label">
                                <input class="form-control" type="text" [(ngModel)]="leavedata.LeaveName" #leave="ngModel"
                                  name="leave" readonly />
                                  <span>Leave Type</span>
                                </label>
                              </div>
                            </div>
                            <div class="row">
                              <div class="col-md-12">
                                <label class="form-group has-float-label">
                                  <input type="text" class="form-control" ngModel #remarks="ngModel" name="remarks" required />
                                  <span>Remarks</span>
                                  @if (!remarks.valid && accept.submitted) {
                                    <div class="invalid-tooltip">
                                      Remarks is required!
                                    </div>
                                  }
                                </label>
                              </div>
                            </div>
                            <button class="btn btn-primary" type="submit">
                              {{ 'forms.submit' | translate }}
                            </button>
                          </form>
                        </div>
                      }
                    </div>
                  </div>
                </div>
                @if (true) {
                  <ngx-datatable-footer>
                    <ng-template ngx-datatable-footer-template let-rowCount="rowCount" let-pageSize="pageSize"
                      let-selectedCount="selectedCount" let-curPage="curPage" let-offset="offset" let-limit="limit">
                      <div class="w-100 d-flex justify-content-center">
                        <pagination [totalItems]="rowCount" [boundaryLinks]="true" [customFirstTemplate]="firstTemplate"
                          [customLastTemplate]="lastTemplate" [itemsPerPage]="filterData.limit" [maxSize]="5"
                          (pageChanged)="table.onFooterPage($event)" [customNextTemplate]="nextTemplate"
                        [customPreviousTemplate]="prevTemplate"></pagination>
                      </div>
                    </ng-template>
                  </ngx-datatable-footer>
                }
              </ngx-datatable>
            </div>
          }
        </div>
      }

      <ng-template #firstTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-left"></i>
      </ng-template>
      <ng-template #lastTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right" style="margin-right:-6px;"></i>
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #nextTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-right"></i>
      </ng-template>
      <ng-template #prevTemplate let-disabled="disabled" let-currentPage="currentPage">
        <i class="simple-icon-arrow-left"></i>
      </ng-template>

      <simple-notifications [options]="{ position: ['top', 'center'], maxStack: 1 }"></simple-notifications>
