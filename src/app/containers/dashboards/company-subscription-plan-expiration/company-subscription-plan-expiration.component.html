  <div></div>
}
@if (showloader == false) {
  <div>
    @if (getReponseData.subscriptionData.showSubscriptionExpirationMessage == true) {
      <div

              {{ getReponseData.subscriptionData.subscriptionExpirationMessage }}

          </span>
        </div>
      </div>
    }
  </div>
}
