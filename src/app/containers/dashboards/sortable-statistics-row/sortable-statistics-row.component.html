<div class="row" [sortablejs]="itemsRow" [sortablejsOptions]="{ handle: '.handle' }">
  <div class="col-xl-4 col-lg-6 mb-4">
    <app-radial-process-card
      [title]="'Profile Status'"
      [percent]="profileStatusTrueCount"
      [isSortable]="true"
    ></app-radial-process-card>
  </div>
  <!-- <div
  class="col-xl-4 col-lg-6 mb-4"
  *ngIf="profileStatusData.pendingTabs.length > 0 && profileStatusData.pendingTabs[0].length > 0"
  > -->
  <div class="col-xl-4 col-lg-6 mb-4">
    <div class="card" style="height: 100%">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div style="height: 100%">
          <p style="margin-bottom: 0px">
            @for (tab of profileStatusData.pendingTabs; track tab) {
              @if (tab.display === false) {
                <span
                  class="badge badge-pill badge-outline-theme-2 mb-1 mr-2 ml-1"
                  >
                  {{ tab.tabName }}
                </span>
              }
            }
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
