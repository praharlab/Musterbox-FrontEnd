<div class="card mb-12">
  <div class="card-header my-2" style="flex-direction: column">
    <h3 class="card-header text-left my-2">Visit & Expense</h3>

    <div [class]="class">
      <!-- <app-glide #carousel [settings]="{
        type: 'carousel',
        perView: 4,
        hideNav: true,
        breakpoints: { '320': { perView: 1 }, '576': { perView: 2 },'1800': { perView: 3 },'1900': { perView: 4 } }
    }"> -->
      <div class="row">
        @for (item of data; track item) {
          <div class="col-md-4" cursor="none">
            <div class="icon-row-item" style="width: inherit">
              <div class="card mb-1" style="cursor: default">
                <div class="card-body text-center">
                  <i [class]="item.icon"></i>
                  <p class="card-text font-weight-semibold mb-0">
                    {{ item.title }}
                  </p>
                  <p class="lead text-center">{{ item.value }}</p>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    <!-- </app-glide> -->
  </div>
</div>
</div>
