<style>
  /* Modern Topnav Styles */
  .topnav-modern {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px !important;
  height: 72px;
  background: var(--m-surface);
  border-bottom: 1px solid var(--m-border-subtle);
  box-shadow: 0 1px 0 var(--m-border-subtle), 0 2px 12px rgba(15, 23, 42, 0.05);
}

.topnav-left {
display: flex;
align-items: center;
gap: 16px;
flex: 0 0 auto;
}

.topnav-center {
flex: 1;
display: flex;
justify-content: center;
}

.topnav-right {
display: flex;
align-items: center;
gap: 8px;
flex: 0 0 auto;
}

.menu-btn-modern {
width: 36px;
height: 36px;
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: background 0.2s;
border: none;
background: transparent;
color: var(--m-text-muted);
padding: 0;
}

.menu-btn-modern:hover {
background: var(--m-primary-softer);
color: var(--m-primary);
}

.menu-btn-modern svg rect {
fill: currentColor;
}

.navbar-brand-modern {
display: flex;
align-items: center;
gap: 10px;
text-decoration: none !important;
color: inherit !important;
}

.navbar-brand-modern img {
height: 38px;
width: auto;
object-fit: contain;
max-width: 140px;
}

.navbar-brand-modern .brand-name {
font-size: 1.05rem;
font-weight: 700;
color: var(--m-primary);
letter-spacing: -0.3px;
white-space: nowrap;
font-family: 'Inter', sans-serif;
}

.nav-icon-btn {
width: 36px;
height: 36px;
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.2s;
border: none;
background: transparent;
color: var(--m-text-muted);
position: relative;
padding: 0;
}

.nav-icon-btn:hover {
background: var(--m-primary-softer);
color: var(--m-primary);
}

.nav-icon-btn .badge-dot {
position: absolute;
top: 4px;
right: 4px;
min-width: 16px;
height: 16px;
border-radius: 8px;
background: var(--m-danger);
color: #fff;
font-size: 9px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
padding: 0 3px;
border: 2px solid var(--m-surface);
line-height: 1;
}

.nav-icon-btn i {
font-size: 17px;
}

.dark-toggle-wrap {
display: flex;
align-items: center;
padding: 0 4px;
}

.nav-divider {
width: 1px;
height: 28px;
background: var(--m-border-subtle);
margin: 0 4px;
}

.user-btn-modern {
display: flex;
align-items: center;
gap: 10px;
padding: 5px 10px 5px 5px;
border-radius: 10px;
cursor: pointer;
transition: background 0.2s;
border: none;
background: transparent;
}

.user-btn-modern:hover {
background: var(--m-primary-softer);
}

.user-btn-modern .user-avatar-img {
width: 32px;
height: 32px;
border-radius: 50%;
object-fit: cover;
border: 2px solid var(--m-border-subtle);
}

.user-btn-modern .user-name-text {
font-size: 0.82rem;
font-weight: 600;
color: var(--m-text);
font-family: 'Inter', sans-serif;
max-width: 110px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

.user-btn-modern .chevron-icon {
font-size: 10px;
color: var(--m-text-subtle);
}

/* Dropdown */
.user-dropdown-modern {
border-radius: 14px !important;
border: 1px solid var(--m-border-subtle) !important;
box-shadow: 0 8px 32px rgba(0, 54, 90, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06) !important;
padding: 8px !important;
min-width: 210px !important;
margin-top: 10px !important;
}

.user-dropdown-modern .user-header {
display: flex;
flex-direction: column;
align-items: center;
padding: 12px 8px 14px;
gap: 8px;
text-decoration: none;
}

.user-dropdown-modern .user-header .avatar-large {
width: 52px;
height: 52px;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--m-border-subtle);
}

.user-dropdown-modern .user-header .user-full-name {
font-size: 0.85rem;
font-weight: 700;
color: var(--m-text);
font-family: 'Inter', sans-serif;
}

.user-dropdown-modern .dropdown-divider {
margin: 4px 0 !important;
border-color: var(--m-border-subtle) !important;
}

.dropdown-item-modern {
display: flex !important;
align-items: center;
gap: 10px;
padding: 9px 12px !important;
border-radius: 8px !important;
font-size: 0.82rem;
color: var(--m-text) !important;
font-family: 'Inter', sans-serif;
font-weight: 500;
transition: background 0.15s;
cursor: pointer;
text-decoration: none;
}

.dropdown-item-modern:hover {
background: var(--m-primary-softer) !important;
color: var(--m-primary) !important;
}

.dropdown-item-modern i {
font-size: 14px;
width: 18px;
color: var(--m-text-muted);
}

.dropdown-item-modern.danger-item {
color: var(--m-danger) !important;
}

.dropdown-item-modern.danger-item i {
color: var(--m-danger);
}

.dropdown-item-modern.danger-item:hover {
background: var(--m-danger-soft) !important;
}

@media (max-width: 600px) {

.search-pill,
.topnav-center {
display: none !important;
}

.user-btn-modern .user-name-text {
display: none;
}
}
</style>

<!-- Styling lives in the <style> block above rather than an inline style
attribute: inline styles outrank the theme, so the old hardcoded #fff /
#eef2f7 / rgba(0,54,90,..) values could not follow the palette. -->
<nav class="navbar fixed-top topnav-modern">

  <!-- Left: Hamburger + Logo -->
  <div class="topnav-left">
    <button class="menu-btn-modern d-none d-md-flex"
      (click)="menuButtonClick($event, sidebar.menuClickCount, sidebar.containerClassnames); (false)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" viewBox="0 0 18 14">
        <rect y="0" width="18" height="2" rx="1" />
        <rect y="6" width="14" height="2" rx="1" />
        <rect y="12" width="18" height="2" rx="1" />
      </svg>
    </button>
    <button class="menu-btn-modern d-flex d-md-none"
      (click)="mobileMenuButtonClick($event, sidebar.containerClassnames)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="14" viewBox="0 0 18 14">
        <rect y="0" width="18" height="2" rx="1" />
        <rect y="6" width="18" height="2" rx="1" />
        <rect y="12" width="18" height="2" rx="1" />
      </svg>
    </button>

    <!-- Company Logo / Name (dynamic from backend) -->
    @if (companydata) {
      <a class="navbar-brand-modern" [routerLink]="'/app/dashboards/analytics'">
        @if (imgshow) {
          <img src="{{ apiURL }}uploads/company/logo/{{ companyLogoService.getCompanyLogo() }}"
            alt="Company Logo" />
        }
        @if (!imgshow) {
          <span class="brand-name">{{ companydata.companyName }}</span>
        }
      </a>
    }
  </div>

  <!-- Center: Search Bar -->
  <div class="topnav-center d-none d-md-flex">
    <app-search-bar></app-search-bar>
  </div>

  <!-- Right: Action Icons + User -->
  <div class="topnav-right">

    <!-- User Request Box -->
    <app-user-request-box></app-user-request-box>

    <!-- Notifications -->
    <button class="nav-icon-btn" (click)="onClick()" tooltip="Notifications" placement="bottom">
      <i class="simple-icon-bell"></i>
      @if (notificationcount > 0) {
        <span class="badge-dot">{{ notificationcount }}</span>
      }
    </button>

    <!-- Dark Mode Toggle -->
    <div class="dark-toggle-wrap d-none d-md-flex">
      <div class="custom-control custom-switch" tooltip="Dark Mode" placement="bottom">
        <input type="checkbox" class="custom-control-input" id="darkModeSwitch" [checked]="isDarkModeActive"
          (change)="onDarkModeChange($event)" />
        <label class="custom-control-label" for="darkModeSwitch"></label>
      </div>
    </div>

    <!-- Fullscreen -->
    <button class="nav-icon-btn d-none d-sm-flex" (click)="fullScreenClick()" tooltip="Fullscreen" placement="bottom">
      @if (!isFullScreen) {
        <i class="simple-icon-size-fullscreen"></i>
      }
      @if (isFullScreen) {
        <i class="simple-icon-size-actual"></i>
      }
    </button>

    <!-- App Grid Menu (Super Admin Only) -->
    @if (usertype == 0) {
      <button class="nav-icon-btn" (click)="togglePopup()" tooltip="App Menu" placement="bottom">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 21 20" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M0 5H5.25V0H0V5ZM7.875 20H13.125V15H7.875V20ZM0 20H5.25V15H0V20ZM0 12.5H5.25V7.5H0V12.5ZM7.875 12.5H13.125V7.5H7.875V12.5ZM15.75 0V5H21V0H15.75ZM7.875 5H13.125V0H7.875V5ZM15.75 12.5H21V7.5H15.75V12.5ZM15.75 20H21V15H15.75V20Z"
            fill="currentColor" />
        </svg>
      </button>
    }

    <div class="nav-divider"></div>

    <!-- User Dropdown -->
    <div class="user d-inline-block" dropdown>
      <button class="user-btn-modern p-0" type="button" dropdownToggle>
        @if (imgshow1) {
          <img class="user-avatar-img" src="{{ apiURL }}uploads/user/photo/{{ userdata.photo }}"
            alt="Profile" />
        }
        @if (!imgshow1) {
          <span>
            @if (userdata.firstName && userdata.lastName) {
              <app-profile-pic [firstName]="userdata.firstName"
                [lastName]="userdata.lastName">
              </app-profile-pic>
            }
          </span>
        }
        <span class="user-name-text d-none d-md-block">{{ displayName }}</span>
        <i class="simple-icon-arrow-down chevron-icon d-none d-md-block"></i>
      </button>

      <div class="dropdown-menu dropdown-menu-right user-dropdown-modern" *dropdownMenu role="menu">
        <!-- Header -->
        <a class="user-header" routerLink="/app/me"
          style="text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:8px; padding: 12px 8px 14px;">
          @if (imgshow1) {
            <img class="avatar-large" src="{{ apiURL }}uploads/user/photo/{{ userdata.photo }}"
              alt="Profile" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--m-border-subtle);" />
          }
          @if (!imgshow1) {
            <span>
              @if (userdata.firstName && userdata.lastName) {
                <app-profile-pic [firstName]="userdata.firstName"
                  [lastName]="userdata.lastName">
                </app-profile-pic>
              }
            </span>
          }
          <span style="font-size:0.85rem;font-weight:700;color:var(--m-text);font-family:'Inter',sans-serif;">
            Hi, {{ userdata.displayName }}
          </span>
        </a>

        <li class="divider dropdown-divider"></li>

        <a class="dropdown-item-modern" routerLink="/app/me">
          <i class="simple-icon-user"></i> My Profile
        </a>
        <a class="dropdown-item-modern" routerLink="/app/changepassword">
          <i class="simple-icon-lock"></i> Change Password
        </a>

        <li class="divider dropdown-divider"></li>

        <a class="dropdown-item-modern danger-item" (click)="onSignOut()">
          <i class="simple-icon-logout"></i> Sign Out
        </a>
      </div>
    </div>
  </div>
</nav>

<app-pop-up-menu></app-pop-up-menu>
