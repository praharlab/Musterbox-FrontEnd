<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo">
  <defs>
    <linearGradient id="mkTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="mkSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#mkTile)"/>
  <rect width="120" height="60" rx="28" fill="url(#mkSheen)"/>

  <!-- ascending bars: payroll over time -->
  <g fill="#ffffff">
    <rect x="30" y="68" width="12" height="24" rx="6" opacity=".55"/>
    <rect x="50" y="56" width="12" height="36" rx="6" opacity=".78"/>
    <rect x="70" y="40" width="12" height="52" rx="6"/>
  </g>

  <!-- person mark above the leading bar -->
  <circle cx="76" cy="27" r="9" fill="#5eead4"/>
  <path d="M63 92a13 13 0 0 1 26 0z" fill="#5eead4" opacity="0"/>
</svg>
