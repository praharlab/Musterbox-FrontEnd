version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.3
        - nvm use 22.22.3
        - node --version
        - npm ci
    build:
      commands:
        - nvm use 22.22.3
        - npm run build
  artifacts:
    baseDirectory: dist/musterbox
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
