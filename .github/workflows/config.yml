name: Build release

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build development bundle
        run: npm run build:dev

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: musterbox-${{ github.ref_name }}-dev
          path: dist/musterbox-dev/
          if-no-files-found: error
          retention-days: 30

      - name: Build staging bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build:stage

      - name: Upload staging artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: musterbox-${{ github.ref_name }}-staging
          path: dist/musterbox-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Build production bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build:prod

      - name: Upload production artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: musterbox-${{ github.ref_name }}-prod
          path: dist/musterbox-prod/
          if-no-files-found: error
          retention-days: 30